name: iOS
on:
  push:
    branches: [main]
    paths: [frontend/ios/**, contracts/fixtures/**, backend/**, .github/workflows/ios.yaml]
  pull_request:
    paths: [frontend/ios/**, contracts/fixtures/**, backend/**, .github/workflows/ios.yaml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Select pinned Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$(cat frontend/ios/.xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Swift format and lint
        run: sh frontend/ios/scripts/format.sh --check
      - name: Clean simulator build and analysis
        run: sh frontend/ios/scripts/build.sh
      - name: Models, transport and session tests
        run: sh frontend/ios/scripts/test.sh
      - name: Entry, draft and API retry UI tests
        id: ui
        run: sh frontend/ios/scripts/test-ui.sh
      - name: Preserve failed UI test diagnostics
        if: failure() && steps.ui.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ui-${{ github.run_id }}
          path: frontend/ios/.build/UIResults-*.xcresult
          include-hidden-files: true
          retention-days: 7
