name: Component releases
on:
  push:
    tags:
      - 'backend/v*'
      - 'web/v*'
      - 'monitoring/v*'
      - 'android/v*'
      - 'ios/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing component/vX.Y.Z or component/vX.Y.Z-rc.N tag on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  metadata:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      component: ${{ steps.metadata.outputs.component }}
      commit: ${{ steps.metadata.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
      runner: ${{ steps.metadata.outputs.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag reachable from main before executing repository tooling
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release/metadata.py --tag "$RELEASE_TAG" --build-number "$GITHUB_RUN_NUMBER" --output "$RUNNER_TEMP/release.json" --github-output "$GITHUB_OUTPUT"
  build:
    name: Build ${{ needs.metadata.outputs.component }}
    needs: metadata
    runs-on: ${{ needs.metadata.outputs.runner }}
    timeout-minutes: 60
    outputs:
      failures: ${{ steps.report.outputs.failures }}
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install Android toolchain
        if: needs.metadata.outputs.component == 'android'
        uses: ./.github/actions/setup-android
      - name: Select pinned Xcode
        if: needs.metadata.outputs.component == 'ios'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Install browsers for web checks
        if: needs.metadata.outputs.component == 'web'
        run: npx playwright install --with-deps chromium webkit
      - name: Build cloud artifact
        id: cloud
        if: contains(fromJSON('["backend","web","monitoring"]'), needs.metadata.outputs.component)
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: python3 scripts/ci/run.py cloud python3 scripts/release/build.py --tag "$RELEASE_TAG" --build-number "$GITHUB_RUN_NUMBER" --output "$RUNNER_TEMP/release-artifacts"
      - name: Build signed Android artifact
        id: android
        if: needs.metadata.outputs.component == 'android'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOMEWHERE_API_ORIGIN: ${{ vars.SOMEWHERE_API_ORIGIN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/ci/run.py android python3 scripts/release/build.py --tag "$RELEASE_TAG" --build-number "$GITHUB_RUN_NUMBER" --output "$RUNNER_TEMP/release-artifacts"
      - name: Build signed iOS artifact
        id: ios
        if: needs.metadata.outputs.component == 'ios'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOMEWHERE_API_ORIGIN: ${{ vars.SOMEWHERE_API_ORIGIN }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: python3 scripts/ci/run.py ios python3 scripts/release/build.py --tag "$RELEASE_TAG" --build-number "$GITHUB_RUN_NUMBER" --output "$RUNNER_TEMP/release-artifacts"
      - name: Upload complete release set
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.metadata.outputs.component }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Stage report and logs
        id: report
        if: always()
        uses: ./.github/actions/ci-report
        with:
          stage: build
          steps: ${{ toJSON(steps) }}
  publish:
    name: Publish verified artifact set
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run and verify before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: release-${{ needs.metadata.outputs.component }}-${{ github.run_attempt }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/release-artifacts"
          git fetch --tags origin main
          python3 scripts/release/publish.py --directory "$RUNNER_TEMP/release-artifacts"
  summary:
    name: Run summary
    if: always()
    needs: [metadata, build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Publish results and failure excerpts
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/report.py workflow
