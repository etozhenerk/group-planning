name: Android
on:
  push:
    branches: [main]
    paths: [frontend/android/**, contracts/fixtures/**, .github/workflows/android.yaml]
  pull_request:
    paths: [frontend/android/**, contracts/fixtures/**, .github/workflows/android.yaml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kotlin style, clean build, Lint and unit tests
        run: sh frontend/android/scripts/check.sh
