schema: spec-driven

context: |
  Это самостоятельный пет-проект. Используй оригинальный OpenSpec без AIFF.
  Пиши артефакты по-русски, сохраняя структурные заголовки и ключевые слова OpenSpec.
  Продуктовый контекст, подтверждённые решения и вопросы находятся в docs/.
  Приняты Go для бэкенда, React + TypeScript для веба, Swift + SwiftUI и
  Kotlin + Jetpack Compose для нативных оболочек. Основные экраны и сценарии — BDUI.
  См. docs/architecture/0001-bdui.md. DivKit пока кандидат; движок, библиотеки,
  версии и контракты предстоит проверить прототипом. Не выдавай кандидата за решение.
  Планируй сквозные изменения с явным указанием затронутых приложений:
  backend, frontend/web, frontend/ios, frontend/android.
  Запускай CLI как npm run --silent openspec -- <аргументы> из корня репозитория.

rules:
  proposal:
    - Укажи проблему, границы изменения и затронутые приложения.
  specs:
    - Используй проверяемые сценарии; не описывай запланированную функцию как уже реализованную.
  design:
    - Объясни изменения данных, API и поведения затронутых платформ; неприменимые части отметь явно.
    - Для BDUI укажи поддерживаемые компоненты и действия, совместимость старых клиентов, границу серверной поставки и откат.
  tasks:
    - Раздели работу по затронутым приложениям и зависимостям; добавь необходимые проверки.
    - Для серверного изменения BDUI запланируй проверки web, iOS и Android, включая прежние клиентские сборки.

operations:
  apply:
    guidance:
      - Перед редактированием прочитай корневой AGENTS.md и инструкции затронутых приложений.
      - Для обвязки и документации запускай npm run agent:check; для кода используй реальные проверки приложения.
  archive:
    guidance:
      - Сначала проверь реализацию по требованиям и сохрани результаты проверки вместе с изменением.
