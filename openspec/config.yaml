schema: spec-driven

context: |
  Это самостоятельный пет-проект. Используй оригинальный OpenSpec.
  Пиши артефакты по-русски, сохраняя структурные заголовки и ключевые слова OpenSpec.
  Продуктовый контекст, подтверждённые решения и вопросы находятся в docs/.
  Приняты Go для бэкенда, React + TypeScript для веба, Swift + SwiftUI и
  Kotlin + Jetpack Compose для нативных приложений. Каждый клиент реализует экраны,
  навигацию и формы в собственном коде; Go-сервер предоставляет предметные данные
  и операции через общий API. BDUI не используется. См. docs/architecture/0002-client-ui.md.
  Предложение первого среза находится в openspec/changes/gathering-activity-feed/design.md,
  операции API — в api.md, вход — в auth.md, этапы — в tasks.md того же изменения.
  Для локальной разработки по умолчанию используется memory.Store без БД/Docker;
  перезапуск этого режима сбрасывает данные. Пользователь разрешил заключительный
  облачный этап: production использует PostgreSQL 16 на ВМ и версионные SQL-миграции.
  Сайт https://smwhere.ru работает с постоянным хранилищем и реальным Яндекс ID;
  результаты и незавершённые проверки находятся в deployment-and-store-release.
  Наличие работающего сайта не означает готовности mobile/store-релизов.
  Локальный запуск не требует облака; backend/docs/auth.md описывает OAuth,
  backend/docs/postgres.md — постоянное хранилище и миграции,
  backend/README.md — запуск, mock и проверки. Секреты не хранить в Git.
  После одобрения UI используй design-system-publish; после реализации экрана
  design-review с независимым субагентом и design:ready до закрытия UI-задачи.
  Источник значений design-system/tokens.json, контракты docs/design/components.
  Непроверенная платформа и устаревший отчёт не дают pass.
  При изменении дизайна во время реализации или ревью сам выполни цикл
  docs/design/revisions.md: обнови реальные макеты и UX/specs/design/tasks,
  повторно вызови design-system-publish, обнови затронутые токены/контракты и
  manifest, продолжи разрешённую реализацию и независимый design-review.
  Уже данное решение не согласовывай повторно; задачи с устаревшей приёмкой
  открой заново, прежние отчёты/evidence сохрани с исходными hash.
  Согласованные UX и дизайн общие; изменения мобильного UI требуют новой сборки.
  Правила UX/UI находятся в docs/design/README.md, общие соглашения кода —
  в docs/development.md, правила стеков — в локальных AGENTS.md приложений.
  Для iOS и Android обязательны также локальные docs/code-style.md.
  README содержит постоянные инструкции; прогресс и результаты — в tasks.md и отчётах изменения.
  Веб: строгий FSD, алиас @/ для внутренних импортов, только TypeScript;
  в файле компонента только импорты, сам компонент и тип его пропсов.
  Компоненты и модули должны оставаться небольшими.
  Планируй сквозные изменения с явным указанием затронутых приложений:
  backend, frontend/web, frontend/ios, frontend/android.
  Запускай CLI как npm run --silent openspec -- <аргументы> из корня репозитория.
  Перед продуктовой реализацией примени test-spec: testing.md, кейсы и manifest
  по testing/README.md. Соблюдай пирамиду unit/integration/немного E2E без квот.
  После задачи обязателен feature-test с независимым субагентом на работающем
  продукте и qa:ready до checkbox. Ручной проход в основном делает агент.
  Перед выкаткой release-test проверяет все применимые кейсы, включая старые
  nonautomated/partial/flaky, и обязательные suites на точном кандидате;
  qa:release-ready создаёт receipt. Сборка кандидата разрешена до приёмки.
  Смена поведения/дизайна обновляет кейсы и повторяет функциональную приёмку.
  exploratory-test запускается только по явной просьбе пользователя о независимом
  исследовании без кейсов; не добавляй его автоматически к apply, CI или релизу.
  Родитель готовит бриф, свежий субагент без истории исследует UI без specs,
  кейсов, макетов, кода и известных дефектов. Стартовые чтения продукта ему
  не передаются. После фиксации отчёта родитель делает отдельный triage.
  Исследователь не исправляет продукт; его отчёт не заменяет обязательную приёмку.

rules:
  proposal:
    - Укажи проблему, границы изменения и затронутые приложения.
    - Для интерфейсной фичи укажи объём UX/UI и материалы, которые нужно подготовить до реализации.
  specs:
    - Используй проверяемые сценарии; не описывай запланированную функцию как уже реализованную.
  design:
    - Подготовь testing.md через test-spec — риски, платформы, окружения, ID кейсов, уровни пирамиды и ручной проход. Без продуктового поведения явно укажи неприменимость.
    - Объясни изменения данных, API и поведения затронутых платформ; неприменимые части отметь явно.
    - Для интерфейсной фичи сначала подготовь ux.md с переходами, состояниями, макетами и различиями платформ; сошлись на него из design.md. Без UI укажи неприменимость.
    - Соблюдай архитектуру и соглашения затронутых приложений из их AGENTS.md; свяжи экраны с компонентами и контрактами.
    - При коррекции дизайна во время реализации обнови сами макеты и UX, затем связанные артефакты по docs/design/revisions.md; укажи заменяемую ревизию и влияние на общие компоненты и платформы.
    - Раздели серверные операции, данные API и реализацию экранов, навигации и состояния в каждом затронутом клиенте. Учти совместимость API с поддерживаемыми выпущенными клиентами.
  tasks:
    - exploratory-test планируется только по явной просьбе пользователя; создание навыка, обычная проверка и релиз его не запускают. Он не является обязательным gate.
    - Включи test-spec до реализации и независимый feature-test после поведения; testing-manifest связывает все задачи с кейсами/платформами или обоснованным exempt. Checkbox требует qa:ready; UI также design:ready.
    - Для выкатки включи release-test с полным набором кейсов и обязательных suites; qa:release-ready должен относиться к точному кандидату, а не demo/QA-сборке.
    - Для UI включи публикацию через design-system-publish до кода и независимый design-review с субагентом после каждого готового набора состояний; свяжи manifest и критерий design:ready.
    - Раздели работу по затронутым приложениям и зависимостям; добавь необходимые проверки.
    - Учти готовность UX/UI до реализации. Для первого кода приложения включи настройки инструментов и реальные команды проверки его локальных правил, включая ограничения веба.
    - Для UI запланируй сравнение реализации с указанной версией макетов на затронутых платформах.
    - После изменения дизайна открой заново задачи с утратившей актуальность приёмкой; включи повторную публикацию, реализацию правки и независимое ревью. Старый pass не закрывает новую ревизию.
    - Для изменения общего API запланируй проверки затронутых клиентов, включая поддерживаемые прежние сборки; для изменений UI — реализацию, проверки и выпуск каждого затронутого клиента.

operations:
  apply:
    guidance:
      - Не запускай exploratory-test автоматически. Только по явному запросу независимого исследования используй свежий контекст без кейсов/specs/кода; сопоставление находок с ними выполняй отдельно после фиксации отчёта.
      - Перед продуктовым кодом примени test-spec; после реализации задачи выполни feature-test с независимым субагентом и qa:ready до checkbox. Нет окружения или доказательства — blocked, не pass.
      - При изменении требований, UX или поведения обнови testing.md, cases и manifest, открой утратившие приёмку задачи и повтори feature-test вместе с требуемым design-review.
      - Перед выкаткой выполни release-test и qa:release-ready по полному каталогу и точному artifact. Старый pass и отсутствие изменений в функции не исключают ручной кейс из регрессии.
      - Перед редактированием прочитай корневой AGENTS.md и инструкции затронутых приложений.
      - Для интерфейсной фичи прочитай ux.md и макеты; до реализации проверь определённость нужных экранов, состояний и действий, учитывая уже данное разрешение.
      - Соблюдай docs/development.md и локальные правила; настройки проверок первого приложения входят в его инициализацию.
      - После одобрения дизайна до UI-кода примени design-system-publish; прочитай tokens, authority и contracts, зарегистрируй design-manifest.json.
      - При новом запросе изменить дизайн во время apply/review сам обнови реальные макеты и связанные UX/specs/design/tasks по docs/design/revisions.md, повторно вызови design-system-publish и обнови затронутые токены/контракты/manifest до правки приложения. Учти уже данное решение; согласуй только отсутствующий выбор, без повторного одобрения этапов.
      - После коррекции сохрани прежние отчёты/evidence с исходными hash, открой задачи с устаревшей приёмкой и верни продолжаемую работу в checkpoint. Сохраняй явную паузу. После разрешённой реализации обязательно повтори независимый design-review по новой ревизии и design:ready; идущее ревью старой ревизии не подтверждает готовность новой.
      - После реализации экрана вызови design-review и отдельного субагента; устрани замечания и выполни npm run design:ready -- --manifest <путь> до отметки UI-задачи выполненной. При отсутствии evidence или инструмента сохрани blocked, при явной паузе пользователя phase=paused.
      - Для обвязки и документации запускай npm run agent:check; для кода используй реальные проверки приложения.
  archive:
    guidance:
      - Для продуктовых задач проверь актуальную функциональную приёмку qa:ready по testing-manifest; legacy-галочки и структура specs её не заменяют.
      - Для UI проверь актуальный pass всех платформ через design:ready; существование отчёта или скриншота не является приёмкой.
      - Сначала проверь реализацию по требованиям и сохрани результаты проверки вместе с изменением.
