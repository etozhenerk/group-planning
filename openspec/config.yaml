schema: spec-driven

context: |
  Это самостоятельный пет-проект. Используй оригинальный OpenSpec.
  Пиши артефакты по-русски, сохраняя структурные заголовки и ключевые слова OpenSpec.
  Продуктовый контекст, подтверждённые решения и вопросы находятся в docs/.
  Приняты Go для бэкенда, React + TypeScript для веба, Swift + SwiftUI и
  Kotlin + Jetpack Compose для нативных приложений. Каждый клиент реализует экраны,
  навигацию и формы в собственном коде; Go-сервер предоставляет предметные данные
  и операции через общий API. BDUI не используется. См. docs/architecture/0002-client-ui.md.
  Предложение первого среза находится в openspec/changes/gathering-activity-feed/design.md,
  операции API — в api.md, вход — в auth.md, этапы — в tasks.md того же изменения.
  Пользователь отложил создание БД: первый этап использует memory.Store в Go.
  PostgreSQL, Docker и миграции не нужны. Перезапуск сбрасывает временные данные.
  Добавлены HTTP-сервер, анонимный preview и identity с Яндекс OAuth/web/native
  сессиями. Fake-provider тесты проходят; реальный вход и клиенты ещё не проверены,
  операции встреч реализованы и проверены. Реальное подключение Яндекс ID отложено
  до конца разработки. backend/docs/auth.md описывает включение OAuth,
  backend/README.md — запуск, mock и проверки.
  Согласованные UX и дизайн общие; изменения мобильного UI требуют новой сборки.
  Правила UX/UI находятся в docs/design/README.md, общие соглашения кода —
  в docs/development.md, правила стеков — в локальных AGENTS.md приложений.
  Для iOS и Android обязательны также локальные docs/code-style.md.
  README содержит постоянные инструкции; прогресс и результаты — в tasks.md и отчётах изменения.
  Веб: строгий FSD, алиас @/ для внутренних импортов, только TypeScript;
  в файле компонента только импорты, сам компонент и тип его пропсов.
  Компоненты и модули должны оставаться небольшими.
  Планируй сквозные изменения с явным указанием затронутых приложений:
  backend, frontend/web, frontend/ios, frontend/android.
  Запускай CLI как npm run --silent openspec -- <аргументы> из корня репозитория.

rules:
  proposal:
    - Укажи проблему, границы изменения и затронутые приложения.
    - Для интерфейсной фичи укажи объём UX/UI и материалы, которые нужно подготовить до реализации.
  specs:
    - Используй проверяемые сценарии; не описывай запланированную функцию как уже реализованную.
  design:
    - Объясни изменения данных, API и поведения затронутых платформ; неприменимые части отметь явно.
    - Для интерфейсной фичи сначала подготовь ux.md с переходами, состояниями, макетами и различиями платформ; сошлись на него из design.md. Без UI укажи неприменимость.
    - Соблюдай архитектуру и соглашения затронутых приложений из их AGENTS.md; свяжи экраны с компонентами и контрактами.
    - Раздели серверные операции, данные API и реализацию экранов, навигации и состояния в каждом затронутом клиенте. Учти совместимость API с поддерживаемыми выпущенными клиентами.
  tasks:
    - Раздели работу по затронутым приложениям и зависимостям; добавь необходимые проверки.
    - Учти готовность UX/UI до реализации. Для первого кода приложения включи настройки инструментов и реальные команды проверки его локальных правил, включая ограничения веба.
    - Для UI запланируй сравнение реализации с указанной версией макетов на затронутых платформах.
    - Для изменения общего API запланируй проверки затронутых клиентов, включая поддерживаемые прежние сборки; для изменений UI — реализацию, проверки и выпуск каждого затронутого клиента.

operations:
  apply:
    guidance:
      - Перед редактированием прочитай корневой AGENTS.md и инструкции затронутых приложений.
      - Для интерфейсной фичи прочитай ux.md и макеты; до реализации проверь определённость нужных экранов, состояний и действий, учитывая уже данное разрешение.
      - Соблюдай docs/development.md и локальные правила; настройки проверок первого приложения входят в его инициализацию.
      - Для обвязки и документации запускай npm run agent:check; для кода используй реальные проверки приложения.
  archive:
    guidance:
      - Сначала проверь реализацию по требованиям и сохрани результаты проверки вместе с изменением.
