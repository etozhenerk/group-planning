<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="../../../../frontend/web/src/app/styles/design-tokens.css"><title>Фото · компактный предпросмотр iOS</title><style>body{margin:0;max-width:390px;background:var(--bg);color:var(--text);font-family:inherit}.panel{padding:20px;background:var(--surface);border-radius:24px 24px 0 0;margin-top:160px}.photos{display:flex;gap:12px;overflow-x:auto;padding:22px 14px 18px 0}.photo{position:relative;flex:0 0 176px}.photo img{display:block;width:176px;height:132px;object-fit:cover;border-radius:13px}.remove{position:absolute;right:-16px;top:-16px;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;color:var(--text)}.remove span{background:var(--bg);border:1px solid var(--border);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:18px}.actions{display:flex;justify-content:space-between;margin-top:20px}</style></head><body><section class="panel"><h2>Отправить фото</h2><div class="photos"><div class="photo"><img src="friends.png" alt="Выбранное фото"><button class="remove" aria-label="Убрать фото"><span>×</span></button></div><div class="photo"><img src="dinner.png" alt="Выбранное фото"><button class="remove" aria-label="Убрать фото"><span>×</span></button></div><div class="photo"><img src="boardgame.png" alt="Выбранное фото"><button class="remove" aria-label="Убрать фото"><span>×</span></button></div></div><p class="caption">Видно участникам встречи</p><div class="actions"><button class="button subtle">Выбрать ещё</button><button class="button primary">Отправить</button></div></section><script>document.querySelectorAll('.remove').forEach(button=>button.addEventListener('click',()=>button.closest('.photo').remove()))</script></body></html>
