<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Отправить файл · somewhere · макет v1</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="interactions.js"></script>
  </head>
  <body class="">
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="list.html"
          ><img src="brand.svg" alt="" />somewhere</a
        >
        <nav class="nav-links" aria-label="Основная навигация">
          <a class="nav-link active" href="list.html"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="3" />
              <path d="M7 3v4m10-4v4M3 11h18" /></svg
            >Мои встречи</a
          ><a class="nav-link" href="invitations.html"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3" />
              <path d="m3 7 9 6 9-6" /></svg
            >Приглашения<span class="count">2</span></a
          >
        </nav>
        <a class="profile-link" href="profile.html"
          ><span class="avatar">С</span>
          <div>Саша<small>Мой профиль</small></div></a
        >
      </aside>
      <div class="workspace">
        <header class="mobile-brand">
          <a class="brand" href="list.html"
            ><img src="brand.svg" alt="" />somewhere</a
          >
        </header>
        <main class="main narrow">
          <a class="inline-link" href="chat.html"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 5-7 7 7 7" /></svg
            >Назад</a
          >
          <header class="heading"><h1>Отправить файл</h1></header>
          <section class="panel stack">
            <div class="file-preview">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z M14 3v6h6M8 14h8M8 18h5"
                />
              </svg>
              <div>
                <b>Правила игры.pdf</b>
                <p class="caption">PDF · 2,4 МБ</p>
              </div>
            </div>
            <label class="field"
              >Подпись<textarea placeholder="Добавьте пару слов"></textarea>
            </label>
            <p class="caption">Видно участникам встречи</p>
            <div class="row spread">
              <a class="button subtle" href="upload.html"
                ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" /></svg
                >Выбрать ещё</a
              ><a class="button primary" href="chat-attachment.html"
                >Отправить</a
              >
            </div>
          </section>
          <a class="review-link" href="upload-error.html"
            >Макет ошибки загрузки</a
          >
        </main>
        <nav class="bottom-nav" aria-label="Основная навигация">
          <a class="active" href="list.html"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="3" />
              <path d="M7 3v4m10-4v4M3 11h18" /></svg
            >Встречи</a
          ><a class="" href="invitations.html"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3" />
              <path d="m3 7 9 6 9-6" /></svg
            >Приглашения</a
          ><a class="" href="profile.html"
            ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg
            >Профиль</a
          >
        </nav>
      </div>
    </div>
  </body>
</html>
