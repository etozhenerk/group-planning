<!doctype html>
<html lang="ru">
  <head>

    <link rel="stylesheet" href="date-poll.css" />
    <style>
      .device-gallery {
        max-width: 1050px;
        margin: auto;
        padding: 25px 30px;
        display: flex;
        gap: 40px;
        flex-wrap: wrap;
      }
      .device-gallery h1 {
        font-size: 24px;
        margin: 0 0 10px;
      }
      .device-gallery header {
        width: 100%;
        color: #d5d1dc;
      }
      .device-gallery header a {
        color: #b9b9c2;
        text-decoration: underline;
      }
      .device {
        flex: 0 0 auto;
      }
      .device h2 {
        font-size: 15px;
        margin: 5px 0 14px;
        font-weight: 550;
      }
      .device iframe {
        display: block;
        border: 1px solid #52505a;
        border-radius: 26px;
        background: #24252a;
      }

  </head>
  <body>
    <main class="device-gallery">

        <a href="index.html">Все состояния</a>
      </header>
      <section class="device">
        <h2>Форма · 390 × 844</h2>
        <iframe
          title="Форма опроса на телефоне"
          src="create.html"
          width="390"
          height="844"
        ></iframe>
      </section>
      <section class="device">
        <h2>Решение организатора · 320 × 760</h2>
        <iframe
          title="Опрос на узком экране"
