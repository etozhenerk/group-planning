</style><style>/* Только подтверждённые глобальные коррекции; геометрия композиции из snapshot. */
[data-mobile-silhouette] > svg {
  display: block;
  width: 72%;
  height: 72%;
  opacity: 0.7;
}

[data-mobile-back] {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: var(--ds-target-web, 44px) !important;
  min-width: var(--ds-target-web, 44px) !important;
  height: var(--ds-target-web, 44px) !important;
  min-height: var(--ds-target-web, 44px) !important;
  padding: 0 !important;
  background: transparent !important;
  border: 0 !important;
  flex: none !important;
}

[data-mobile-back] > svg {
  display: block;
  width: 24px;
  height: 24px;
  flex: none;
}

[data-mobile-back]:focus-visible {
  outline: 2px solid var(--ds-color-accent);
  outline-offset: 0;
}

html[data-preview-platform="android"] [data-mobile-back] {
  width: 48px !important;
  min-width: 48px !important;
  height: 48px !important;
  min-height: 48px !important;
}

/* Слайды прокручиваются при нехватке высоты/крупном тексте, footer остаётся доступен. */
[data-onboarding] [data-page-track] > section {
  overflow-y: auto;
  justify-content: safe center;
}

/* Постоянный слот статуса на последней странице, чтобы error не накрывал пример. */
[data-onboarding]:has([data-last]) > footer {
  margin-top: 48px;
}

[data-mobile-photo] > img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}

html:not([data-input-modality="keyboard"]) [data-mobile-back]:focus {
  outline: none;
}

html[data-preview-platform="android"] [data-page-back] {
  min-width: 48px;
  min-height: 48px;
}

/* Поздняя общая коррекция относится только к действительно закреплённой панели. */
[data-mobile-fixed-panel] {
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  margin: 0 !important;
  border-radius: var(--ds-radius-sheet) var(--ds-radius-sheet) 0 0 !important;
  box-shadow: 0 -8px 28px var(--ds-color-mobile-sticky-shadow, #0005) !important;
  padding-bottom: calc(
    var(--ds-space-s6) +
      var(--reference-bottom-safe-area, env(safe-area-inset-bottom, 0px))
  ) !important;
}

[data-mobile-fixed-panel-host] {
  transform: none !important;
}

/* Восемь точек — один range с достаточной областью управления. Вид не меняется. */
[data-mobile-progress] {
  position: relative;
}

[data-mobile-progress] > button {
  pointer-events: none;
}

[data-mobile-progress] > input {
  position: absolute;
  left: 50%;
  top: calc((34px - var(--ds-target-web, 44px)) / 2);
  transform: translateX(-50%);
  width: calc(27px * 8);
  height: var(--ds-target-web, 44px);
  min-height: var(--ds-target-web, 44px);
  margin: 0;
  padding: 0;
  border: 0;
  opacity: 0;
  appearance: none;
}

[data-mobile-progress] > input::-webkit-slider-thumb {
  width: 27px;
  height: var(--ds-target-web, 44px);
  appearance: none;
}

[data-mobile-progress] > input::-moz-range-thumb {
  width: 27px;
  height: var(--ds-target-web, 44px);
  border: 0;
}

[data-mobile-progress]:has(input:focus-visible)::after {
  content: "";
  position: absolute;
  left: 50%;
  top: calc((34px - var(--ds-target-web, 44px)) / 2);
  transform: translateX(-50%);
  width: calc(27px * 8);
  height: var(--ds-target-web, 44px);
  border-radius: var(--ds-component-mobile-back-focus-radius, 12px);
  outline: 2px solid var(--ds-color-accent);
  pointer-events: none;
}

html[data-preview-platform="android"] [data-mobile-progress] > input,
html[data-preview-platform="android"]
  [data-mobile-progress]:has(input:focus-visible)::after {
  height: var(--ds-target-android, 48px);
  min-height: var(--ds-target-android, 48px);
  top: calc((34px - var(--ds-target-android, 48px)) / 2);
}
