openapi: 3.1.1
info:
  title: Somewhere API
  version: 0.1.0
  description: "Контракт первого среза: вход → назначенная встреча → приглашение → RSVP → чат.
    Зарегистрированы health, preview, OAuth/session и операции встреч с memory.Store.
    Вход выключен без конфигурации. Реальный Яндекс ID отложен до конца разработки;
    клиенты ещё не реализованы. x-implemented отмечает маршрут, а не готовность всего сценария."
servers:
  - url: http://127.0.0.1:8080
    description: Локальная разработка без OAuth; реальный вход требует единого HTTPS origin.
tags:
  - name: runtime
    description: Состояние процесса
  - name: auth
    description: Собственные сессии после проверки Яндекс ID
  - name: meetings
    description: Встречи и общая лента
paths:
