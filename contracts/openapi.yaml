components:
  securitySchemes:
    DeletionReceipt:
      type: apiKey
      in: header
      name: X-Deletion-Token
      description: Только повтор уже завершённого удаления в течение 24 часов; не
        авторизует первый запрос и не даёт доступа к данным.
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-somewhere_session
      description: Secure, HttpOnly, SameSite=Lax, Path=/; для мутаций Origin +
        X-CSRF-Token.
    NativeSession:
      type: http
      scheme: bearer
      description: Собственная непрозрачная сессия, не токен Яндекса. Не смешивать с cookie.
  parameters:
    MeetingID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Token:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: ^([A-Za-z0-9_-]{22}|[A-Za-z0-9_-]{43})$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Один UUID на намерение; сообщение использует client_request_id. TTL
        receipt 30 дней в пределах процесса. Другое тело с тем же ключом — 409.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      description: Обязателен для мутации с web-cookie вместе с точным Origin; Bearer
        не использует CSRF.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PollID:
      name: poll_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
      description: Идентификатор задачи подготовки.
  schemas:
    UUID:
      type: string
      format: uuid
    Revision:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
    Answer:
      type: string
      enum:
        - going
        - maybe
        - not_going
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        display_name:
          type: string
          minLength: 1
        avatar_url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
      required:
        - id
        - display_name
      additionalProperties: true
    ReturnContext:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: home
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: invitation
            token:
              type: string
              pattern: ^([A-Za-z0-9_-]{22}|[A-Za-z0-9_-]{43})$
          required:
            - kind
            - token
          additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
    InvitationPreview:
      type: object
      properties:
        meeting_id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          anyOf:
            - type: string
              maxLength: 4000
            - type: "null"
        starts_on:
          anyOf:
            - type: string
              format: date
            - type: "null"
          description: Календарный день в часовом поясе встречи; null только для прежних
            записей без даты.
        starts_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        timezone:
          type: string
          minLength: 1
        place:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
        cover_url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        my_rsvp:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        my_rsvp_revision:
          $ref: "#/components/schemas/Revision"
        join_closes_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        can_join:
          type: boolean
        join_disabled_reason:
          anyOf:
            - type: string
              enum:
                - join_closed
                - meeting_past
            - type: "null"
        organizer:
          $ref: "#/components/schemas/User"
          description: Необязательное публичное имя организатора только в авторизованном
            списке сохранённых приглашений; без email/phone.
      required:
        - meeting_id
        - title
        - description
        - starts_at
        - timezone
        - place
        - cover_url
        - my_rsvp
        - my_rsvp_revision
      additionalProperties: false
    RsvpResult:
      type: object
      properties:
        meeting_id:
          $ref: "#/components/schemas/UUID"
        rsvp:
          $ref: "#/components/schemas/Answer"
        rsvp_revision:
          $ref: "#/components/schemas/Revision"
        can_access_feed:
          type: boolean
        meeting_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - meeting_id
        - rsvp
        - rsvp_revision
        - can_access_feed
        - meeting_revision
      additionalProperties: true
    RsvpSnapshot:
      type: object
      properties:
        meeting_id:
          $ref: "#/components/schemas/UUID"
        rsvp:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        rsvp_revision:
          $ref: "#/components/schemas/Revision"
        can_access_feed:
          type: boolean
          const: false
        meeting_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - meeting_id
        - rsvp
        - rsvp_revision
        - can_access_feed
        - meeting_revision
      additionalProperties: true
    CoverInput:
      description: JPEG/PNG до 5 MiB и 16 миллионов пикселей. Сервер проверяет и
        повторно кодирует изображение.
      type: object
      properties:
        media_type:
          type: string
          enum: [ image/jpeg, image/png ]
        data:
          type: string
          minLength: 4
          maxLength: 6990508
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
      required: [ media_type, data ]
      additionalProperties: false
    CreateMeeting:
      type: object
      properties:
        cover:
          anyOf:
            - $ref: "#/components/schemas/CoverInput"
            - type: "null"
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          anyOf:
            - type: string
              maxLength: 4000
            - type: "null"
        starts_on:
          type: string
          format: date
        starts_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        timezone:
          type: string
          minLength: 1
        place:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
      required:
        - title
        - timezone
      anyOf:
        - required:
            - starts_on
          properties:
            starts_on:
              type: string
              format: date
        - required:
            - starts_at
          properties:
            starts_at:
              type: string
              format: date-time
      additionalProperties: false
    UpdateMeeting:
      type: object
      properties:
        cover:
          anyOf:
            - $ref: "#/components/schemas/CoverInput"
            - type: "null"
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          anyOf:
            - type: string
              maxLength: 4000
            - type: "null"
        starts_on:
          type: string
          format: date
        starts_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        timezone:
          type: string
          minLength: 1
        place:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
        expected_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - expected_revision
      additionalProperties: false
    RsvpRequest:
      type: object
      properties:
        answer:
          $ref: "#/components/schemas/Answer"
        expected_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - answer
        - expected_revision
      additionalProperties: false
    MessageRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        client_request_id:
          $ref: "#/components/schemas/UUID"
      required:
        - text
        - client_request_id
      additionalProperties: false
    SavedInvitation:
      type: object
      properties:
        invitation_url:
          type: string
          format: uri
        preview:
          $ref: "#/components/schemas/InvitationPreview"
      required:
        - invitation_url
        - preview
      additionalProperties: false
    InvitationsPage:
      type: object
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/SavedInvitation"
        next_cursor:
          anyOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
      required:
        - invitations
        - next_cursor
      additionalProperties: false
    InvitationLink:
      type: object
      properties:
        invitation_url:
          type: string
          format: uri
      required:
        - invitation_url
      additionalProperties: true
    Participant:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          type: string
          enum:
            - organizer
            - guest
        rsvp:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        rsvp_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - user
        - role
        - rsvp
        - rsvp_revision
      additionalProperties: true
    Participants:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
