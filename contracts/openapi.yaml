          required:
            - code
            - field_errors
            - request_id
          additionalProperties: false
      required:
        - error
      additionalProperties: false
  responses:
    APIError:
      description: Ошибка согласно api.md; детали реализации не раскрываются.
      headers:
        X-Request-ID:
          description: Сгенерированный сервером ID запроса. Входящий заголовок не считается доверенным.
          schema:
            $ref: "#/components/schemas/UUID"
