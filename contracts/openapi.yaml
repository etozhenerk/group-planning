          in: query
          schema:
            $ref: "#/components/schemas/ChatCursor"
          description: Взаимоисключающе с around_entry_id. Последний next_cursor начинает новый цикл.
        - name: around_entry_id
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Текущий авторизованный снимок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSync"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "405":
          $ref: "#/components/responses/APIError"
        "410":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
        "503":
