openapi: 3.1.1
info:
  title: Somewhere API
  version: 0.1.0
  description: "API встреч: вход, приглашения, ответы, чат, календарь и опросы даты/места. Сервер использует memory.Store; вход требует настройки Яндекс ID. x-implemented отмечает серверный маршрут, а не готовность сценария во всех клиентах."
servers:
  - url: http://127.0.0.1:8080
    description: Локальная разработка без OAuth; реальный вход требует единого HTTPS origin.
tags:
  - name: runtime
    description: Состояние процесса
  - name: auth
    description: Собственные сессии после проверки Яндекс ID
  - name: meetings
    description: Встречи и общая лента
