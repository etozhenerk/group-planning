          schema:
            type: string
            enum:
              - upcoming
              - past
              - undated
        - name: from
          in: query
          description: Локальная дата включительно. Требует to и датированный period;
            максимум 42 дня.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Локальная дата исключительно; всегда передаётся парой с from.
          schema:
