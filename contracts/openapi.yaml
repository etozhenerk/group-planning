components:
  securitySchemes:
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-somewhere_session
      description: Secure, HttpOnly, SameSite=Lax, Path=/; для мутаций Origin + X-CSRF-Token.
    NativeSession:
      type: http
      scheme: bearer
      description: Собственная непрозрачная сессия, не токен Яндекса. Не смешивать с cookie.
  parameters:
    MeetingID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Token:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: ^([A-Za-z0-9_-]{22}|[A-Za-z0-9_-]{43})$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Один UUID на намерение; сообщение использует client_request_id. TTL receipt 30 дней в
        пределах процесса. Другое тело с тем же ключом — 409.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      description: Обязателен для мутации с web-cookie вместе с точным Origin; Bearer не использует CSRF.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  schemas:
    UUID:
      type: string
      format: uuid
    Revision:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
    Answer:
      type: string
      enum:
        - going
        - maybe
        - not_going
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        display_name:
          type: string
          minLength: 1
      required:
        - id
        - display_name
      additionalProperties: true
    ReturnContext:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: home
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: invitation
            token:
              type: string
              pattern: ^([A-Za-z0-9_-]{22}|[A-Za-z0-9_-]{43})$
          required:
            - kind
            - token
          additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
    InvitationPreview:
      type: object
      properties:
        meeting_id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          anyOf:
            - type: string
              maxLength: 4000
            - type: "null"
        starts_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        timezone:
          type: string
          minLength: 1
        place:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
        cover_url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        my_rsvp:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        my_rsvp_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - meeting_id
        - title
        - description
        - starts_at
        - timezone
        - place
        - cover_url
        - my_rsvp
        - my_rsvp_revision
      additionalProperties: false
    RsvpResult:
      type: object
      properties:
        meeting_id:
          $ref: "#/components/schemas/UUID"
        rsvp:
          $ref: "#/components/schemas/Answer"
        rsvp_revision:
          $ref: "#/components/schemas/Revision"
        can_access_feed:
          type: boolean
        meeting_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - meeting_id
        - rsvp
        - rsvp_revision
        - can_access_feed
        - meeting_revision
      additionalProperties: true
    RsvpSnapshot:
      type: object
      properties:
        meeting_id:
          $ref: "#/components/schemas/UUID"
        rsvp:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        rsvp_revision:
          $ref: "#/components/schemas/Revision"
        can_access_feed:
          type: boolean
          const: false
        meeting_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - meeting_id
        - rsvp
        - rsvp_revision
        - can_access_feed
        - meeting_revision
      additionalProperties: true
    CreateMeeting:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          anyOf:
            - type: string
              maxLength: 4000
            - type: "null"
        starts_at:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
        place:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
      required:
        - title
        - starts_at
        - timezone
      additionalProperties: false
    UpdateMeeting:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          anyOf:
            - type: string
              maxLength: 4000
            - type: "null"
        starts_at:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
        place:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
        expected_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - expected_revision
      additionalProperties: false
    RsvpRequest:
      type: object
      properties:
        answer:
          $ref: "#/components/schemas/Answer"
        expected_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - answer
        - expected_revision
      additionalProperties: false
    MessageRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        client_request_id:
          $ref: "#/components/schemas/UUID"
      required:
        - text
        - client_request_id
      additionalProperties: false
    InvitationLink:
      type: object
      properties:
        invitation_url:
          type: string
          format: uri
      required:
        - invitation_url
      additionalProperties: true
    Participant:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          type: string
          enum:
            - organizer
            - guest
        rsvp:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        rsvp_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - user
        - role
        - rsvp
        - rsvp_revision
      additionalProperties: true
    Participants:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
      required:
        - participants
      additionalProperties: true
    AuthStart:
      oneOf:
        - type: object
          properties:
            client_kind:
              type: string
              const: web
            return_context:
              $ref: "#/components/schemas/ReturnContext"
          required:
            - client_kind
            - return_context
          additionalProperties: false
        - type: object
          properties:
            client_kind:
              type: string
              enum:
                - ios
                - android
            return_context:
              $ref: "#/components/schemas/ReturnContext"
            app_challenge:
              type: string
              pattern: ^[A-Za-z0-9_-]{43}$
          required:
            - client_kind
            - return_context
            - app_challenge
          additionalProperties: false
    AuthStarted:
      type: object
      properties:
        attempt_id:
          $ref: "#/components/schemas/UUID"
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
        - attempt_id
        - authorization_url
        - expires_at
      additionalProperties: true
    MobileExchange:
      type: object
      properties:
        attempt_id:
          $ref: "#/components/schemas/UUID"
        handoff_code:
          type: string
          minLength: 1
        app_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
      required:
        - attempt_id
        - handoff_code
        - app_verifier
      additionalProperties: false
    MobileSession:
      type: object
      properties:
        session_token:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
        return_context:
          $ref: "#/components/schemas/ReturnContext"
      required:
        - session_token
        - expires_at
        - return_context
      additionalProperties: true
    Me:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        expires_at:
          type: string
          format: date-time
        csrf_token:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
      required:
        - user
        - expires_at
        - csrf_token
      additionalProperties: true
    Meeting:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        organizer_id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          anyOf:
            - type: string
              maxLength: 4000
            - type: "null"
        starts_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        timezone:
          type: string
          minLength: 1
        place:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
        cover_url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        participant_count:
          type: integer
          minimum: 1
        revision:
          $ref: "#/components/schemas/Revision"
        my_rsvp:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        my_rsvp_revision:
          $ref: "#/components/schemas/Revision"
        created_at:
          type: string
          format: date-time
      required:
        - id
        - organizer_id
        - title
        - description
        - starts_at
        - timezone
        - place
        - cover_url
        - participant_count
        - revision
        - my_rsvp
        - my_rsvp_revision
        - created_at
      additionalProperties: true
    CreatedMeeting:
      type: object
      properties:
        meeting:
          $ref: "#/components/schemas/Meeting"
        role:
          type: string
          const: organizer
        invitation_url:
          type: string
          format: uri
      required:
        - meeting
        - role
        - invitation_url
      additionalProperties: true
    MeetingSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
          minLength: 1
          maxLength: 120
        starts_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        timezone:
          type: string
          minLength: 1
        place:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
        cover_url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        participant_count:
          type: integer
          minimum: 1
        revision:
          $ref: "#/components/schemas/Revision"
        my_rsvp:
          anyOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        my_rsvp_revision:
          $ref: "#/components/schemas/Revision"
      required:
        - id
        - title
        - starts_at
        - timezone
        - place
        - cover_url
        - participant_count
        - revision
        - my_rsvp
        - my_rsvp_revision
      additionalProperties: true
    MeetingsPage:
      type: object
      properties:
        meetings:
          type: array
          items:
            $ref: "#/components/schemas/MeetingSummary"
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
      required:
        - meetings
        - next_cursor
      additionalProperties: true
    FeedEntry:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        meeting_id:
          $ref: "#/components/schemas/UUID"
        sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        kind:
          type: string
          minLength: 1
          description: "Открытая строка: неизвестный тип сохраняется как безопасная заглушка."
        payload_version:
          type: integer
          minimum: 1
        actor:
          $ref: "#/components/schemas/User"
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
        client_request_id:
          anyOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
      required:
        - id
        - meeting_id
        - sequence
        - kind
        - payload_version
        - actor
        - occurred_at
        - payload
        - client_request_id
      additionalProperties: true
    FeedPage:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FeedEntry"
        has_more:
          type: boolean
        meeting_revision:
          $ref: "#/components/schemas/Revision"
        participant_count:
          type: integer
          minimum: 1
        my_rsvp:
