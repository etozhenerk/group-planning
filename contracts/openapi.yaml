components:
  securitySchemes:
    DeletionReceipt:
      type: apiKey
      in: header
      name: X-Deletion-Token
      description: Только повтор уже завершённого удаления в течение 24 часов; не авторизует первый запрос и не даёт доступа к данным.
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-somewhere_session
      description: Secure, HttpOnly, SameSite=Lax, Path=/; для мутаций Origin + X-CSRF-Token.
    NativeSession:
      type: http
      scheme: bearer
      description: Собственная непрозрачная сессия, не токен Яндекса. Не смешивать с cookie.
  parameters:
    MeetingID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Token:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: ^([A-Za-z0-9_-]{22}|[A-Za-z0-9_-]{43})$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Один UUID на намерение; сообщение использует client_request_id. TTL receipt 30 дней в пределах процесса. Другое тело с тем же ключом — 409.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 1
