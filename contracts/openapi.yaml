  /api/v1/meetings/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/MeetingID"
    get:
      operationId: syncChat
      summary: Начальный снимок либо ограниченная сверка до fixed through; 410 требует нового снимка
      tags:
        - meetings
      security:
        - WebSession: []
        - NativeSession: []
      x-implemented: true
      parameters:
        - $ref: "#/components/parameters/Limit"
