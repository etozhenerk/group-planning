            - type: "null"
        my_rsvp_revision:
          $ref: "#/components/schemas/Revision"
        latest_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
      required:
        - entries
        - has_more
        - meeting_revision
        - participant_count
        - my_rsvp
        - my_rsvp_revision
        - latest_sequence
      additionalProperties: true
    Error:
      type: object
