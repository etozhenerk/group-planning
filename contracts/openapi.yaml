openapi: 3.1.1
info:
  title: Somewhere API
  version: 0.1.0
  description: "API встреч: вход, приглашения, ответы, чат, календарь и опросы
    даты/места. Сервер использует memory.Store; вход требует настройки Яндекс
    ID. x-implemented отмечает серверный маршрут, а не готовность сценария во
    всех клиентах."
servers:
  - url: http://127.0.0.1:8080
    description: Локальная разработка без OAuth; реальный вход требует единого HTTPS origin.
tags:
  - name: runtime
    description: Состояние процесса
  - name: auth
    description: Собственные сессии после проверки Яндекс ID
  - name: meetings
    description: Встречи и общая лента
paths:
  /api/v1/realtime:
    get:
      operationId: connectChatRealtime
      summary: Поток ссылочных уведомлений чата через Centrifuge
      description: >-
        WebSocket upgrade, включённый при realtime=true. Web использует HttpOnly
        cookie и точный Origin; native — Bearer HTTP header и subprotocol
        centrifuge-protobuf. URL query и connect token/headers запрещены. Connect data
        допускает только отсутствие, null или пустой объект без полей.
        Личный канал personal:<user_id> задаёт сервер, клиент подписывается на одну
        meeting:<meeting_id>. Hint содержит schema_version, meeting_id,
        stream_epoch и decimal latest_change_sequence; личный канал добавляет
        invalidation и access_revoked. После subscribe/reconnect обязателен HTTP sync.
        Ошибки Centrifuge и ограничения описаны в backend/README.md.
      tags:
        - meetings
      security:
        - WebSession: []
        - NativeSession: []
      x-implemented: true
      parameters:
        - name: Origin
          in: header
          description: Точный настроенный origin обязателен для web-cookie.
          required: false
          schema:
            type: string
      responses:
        "101":
          description: Соединение переключено на протокол Centrifuge.
        "400":
          description: Неверный query или WebSocket handshake; upgrade может вернуть текстовую transport error.
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "405":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
  /api/v1/chat-capabilities:
    get:
      operationId: getChatCapabilities
      summary: Поддерживаемые возможности чата без ложного read/realtime UI
      tags:
        - meetings
      security:
        - WebSession: []
        - NativeSession: []
      x-implemented: true
      parameters: []
      responses:
        "200":
          description: Текущий авторизованный снимок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCapabilities"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "405":
          $ref: "#/components/responses/APIError"
        "410":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
        "500":
