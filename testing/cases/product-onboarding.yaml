- id: TC-AUTH-C08F3966
  title: "Непрерывные состояния веб-входа: API ответил раньше перехода браузера"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/product-onboarding/spec.md
    requirement: Непрерывные состояния веб-входа
    scenario: API ответил раньше перехода браузера
    sha256: 8128559f5ff6e671c39884e02b954f336353c50455fe25a7e48af59fab637b8a
  platforms:
    - web
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Веб-клиент SHALL сохранять состояние ожидания кнопки от нажатия до перехода
      в Яндекс, скрывая текст и стрелку без изменения геометрии. Возврат SHALL показывать единый
      индикатор без технических заголовков, с доступной подписью и поддержкой
      уменьшения анимации. Ошибка SHALL предоставлять подходящее действие повтора.
  steps:
    - action: URL входа уже получен, но браузер ещё не открыл Яндекс
      expected: кнопка продолжает показывать индикатор и не принимает повторное нажатие
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
