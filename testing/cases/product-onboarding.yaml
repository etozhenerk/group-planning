- id: TC-AUTH-0E2CAE49
  title: "Знакомство до входа: Посетитель знакомится с сервисом"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/product-onboarding/spec.md
    requirement: Знакомство до входа
    scenario: Посетитель знакомится с сервисом
    sha256: f034da4118c55609deabb28ad58a234986e94afcb9b50184db9cfe969b35cb90
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Система SHALL при общем первом входе показывать страницу, объясняющую
      приглашения по ссылке, общий чат, голосования, задачи подготовки и просмотр
