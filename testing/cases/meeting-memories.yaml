- id: TC-VIBE-75A8C069
  title: "Заметный переход в вайб после встречи: Прошедшая встреча без фотографий"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Заметный переход в вайб после встречи
    scenario: Прошедшая встреча без фотографий
    sha256: 00bb46e7bbbb1ee29011f0bccedac33541299aae82db52ecbd3efc901d494163
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md;
      зафиксированы сборка, API и время.
    - >-
      После существующего календарного перехода встречи в `past` клиент SHALL

      показывать заметный вход в вайб над прокручиваемой перепиской. Переход в
      `past`

      SHALL NOT означать ручного подтверждения, что встреча состоялась, или
      закрывать

      чат. При отсутствии фото SHALL предлагаться добавление, при наличии —
      просмотр.
  steps:
    - action: текущий участник открывает чат прошедшей встречи без фото
      expected: видит блок «Как всё прошло?» с действием «Добавить фото» может
        продолжать переписку без загрузки фотографий
  cleanup:
