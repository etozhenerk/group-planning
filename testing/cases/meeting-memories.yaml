- id: TC-VIBE-NATIVE-SWIPE-TAP
  title: "Разделение свайпа и нажатия фотостопки на native: Нативный свайп не открывает полный экран"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Разделение свайпа и нажатия фотостопки на native
    scenario: Нативный свайп не открывает полный экран
    sha256: 1ac45196b093de2b7ecfaa0890724868f46ae491ff036044a9b719324f908eac
  platforms:
    - ios
    - android
  preconditions:
    - Изолированный API и точные QA-сборки; устройство/OS/locale/время и нормативный native UX
      зафиксированы отдельно для iOS и Android. Web-проход не принимается за native.
    - Используются собственные тестовые профили/файлы. Системный picker, Share, gestures и
      промежуточные кадры проверяются реально; недоступная операция отмечается blocked. Реальным
      адресатам сообщения не отправляются.
  steps:
    - action: В альбоме с тремя фото выполнить горизонтальные свайпы в обе стороны, затем короткий
        отменённый жест и вертикальную прокрутку.
      expected: Завершённый горизонтальный свайп меняет индекс, короткий/вертикальный не меняют его; ни
        один из жестов не открывает fullscreen на отпускании.
    - action: После завершения движения отдельно коротко нажать текущее фото и закрыть просмотр.
      expected: Tap открывает именно текущее фото; закрытие возвращает тот же индекс без дополнительного
        перелистывания.
    - action: Повторить swipe/tap при Reduce Motion и обычном движении.
      expected: Смысл жестов одинаков, отключение анимации не превращает swipe в tap. Используются
        реальные жесты и кадры, не только программная смена индекса.
  cleanup:
    - Удалить только собственные тестовые данные; восстановить изменённые QA network/Reduce Motion
      настройки, закрыть системные панели и остановить свои fixtures.
  automation:
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
- id: TC-VIBE-NATIVE-PRELOAD
  title: "Предзагрузка фотографий нативного вайба: Нативный вайб листается без повторных загрузок"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Предзагрузка фотографий нативного вайба
    scenario: Нативный вайб листается без повторных загрузок
    sha256: 81cfb094f46f39e3f70841a67086971930f5812b424b88bbb23c74e65d5a1e00
  platforms:
    - ios
    - android
  preconditions:
    - Изолированный API и точные QA-сборки; устройство/OS/locale/время и нормативный native UX
      зафиксированы отдельно для iOS и Android. Web-проход не принимается за native.
    - Используются собственные тестовые профили/файлы. Системный picker, Share, gestures и
      промежуточные кадры проверяются реально; недоступная операция отмечается blocked. Реальным
      адресатам сообщения не отправляются.
  steps:
    - action: Очистить только собственный QA-кеш, открыть альбом с различимыми фото; при пагинации
        использовать больше одной страницы. Дождаться подтверждённой подготовки набора.
      expected: Подготовлены все доступные снимки, включая ещё не открытые; измерены запросы/состояния,
        готовность не объявлена при ошибке загрузки.
    - action: После подготовки временно отключить доступ тестового приложения к сети и пролистать весь
        набор в обе стороны.
      expected: Каждое фото сразу видно без loading, пустого кадра и подмены; ранее не открывавшиеся
        снимки также доступны из подготовленного набора.
    - action: Вернуть сеть; на отдельном fixture вызвать ошибку подготовки одного фото и затем отзыв
        доступа.
      expected: Ошибка не выдаётся за готовность; доступные фото не теряются из-за одного сбоя. После
        отзыва закрытый кеш и просмотр удалены по прежним правилам.
  cleanup:
    - Удалить только собственные тестовые данные; восстановить изменённые QA network/Reduce Motion
      настройки, закрыть системные панели и остановить свои fixtures.
  automation:
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
