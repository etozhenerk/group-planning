- id: TC-VIBE-WEB-DIRECT-UPLOAD
  title: "Прямая форма добавления воспоминаний в web: Web открывает загрузку прямо из баннера вайба"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Прямая форма добавления воспоминаний в web
    scenario: Web открывает загрузку прямо из баннера вайба
    sha256: f4370e1bae6e6dac9b3f568147788cfe2a56cfdc5f1abd4f414cf848f587ff84
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md, текущий участник встречи; зафиксированы
      exact web build, API, браузер, viewport, locale, время и опубликованный raw 3.0.0.
    - Desktop и mobile web проверяются отдельно. Для системной отмены нужен настоящий OS picker;
      подстановка файлов или synthetic cancel не доказывают этот путь. Недоступный системный UI
      отмечается blocked.
    - Подготовлены обезличенные тестовые фото с известными пропорциями, PDF и черновик «Привет XX
      мир» с выделением XX; реальные личные данные не используются.
  steps:
    - action: В прошедшей встрече без фото сохранить черновик и позицию чата; нажать «Добавить фото» в
        баннере.
      expected: "Сразу открыта пустая форма добавления в вайб: dialog desktop или bottom sheet mobile web.
        Фон альбома допустим; отдельного промежуточного показа или дополнительного нажатия для формы
        нет, OS picker автоматически не открывается."
    - action: Закрыть форму, затем открыть снова и нажать явный выбор внутри неё.
      expected: После первого закрытия вернулись прежний чат, draft/selection и scroll. После повторного
        открытия OS picker запускается только явным выбором.
    - action: Выбрать фото, проверить предпросмотр и подтвердить отправку; открыть вайб после успеха.
      expected: До подтверждения альбом не пополняется. После подтверждённой отправки выбранное фото
        находится в альбоме один раз.
  cleanup:
    - Удалить только собственные тестовые вложения/встречу либо сбросить fixture; вернуть исходные
      viewport/ориентацию и закрыть собственные OS picker/формы.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
