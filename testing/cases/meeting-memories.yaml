      exact web build, API, браузер, viewport, locale, время и опубликованный raw 3.0.0.
    - Desktop и mobile web проверяются отдельно. Для системной отмены нужен настоящий OS picker;
      подстановка файлов или synthetic cancel не доказывают этот путь. Недоступный системный UI
      отмечается blocked.
    - Подготовлены обезличенные тестовые фото с известными пропорциями, PDF и черновик «Привет XX
      мир» с выделением XX; реальные личные данные не используются.
  steps:
    - action: Из баннера пустого вайба открыть форму; три раза подряд открыть настоящий OS picker и нажать
        Cancel.
      expected: После каждой отмены остаётся пустая форма, самостоятельный экран альбома не открывается;
        черновик/selection чата сохранены.
    - action: Выбрать две фотографии, затем трижды повторить открытие/Cancel OS picker.
      expected: Оба предпросмотра, их порядок и форма сохраняются после Cancel №1, №2 и №3; новая попытка
        выбора доступна.
    - action: Не подтверждая отправку, закрыть форму и проверить альбом с другого тестового профиля.
      expected: Новых фото в альбоме нет; локальный выбор не стал опубликованным материалом. У исходного
        пользователя сохранены draft/selection и позиция чата.
  cleanup:
    - Удалить только собственные тестовые вложения/встречу либо сбросить fixture; вернуть исходные
      viewport/ориентацию и закрыть собственные OS picker/формы.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
- id: TC-VIBE-WEB-FULLSCREEN-CONTAIN
