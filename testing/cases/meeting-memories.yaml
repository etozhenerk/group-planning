    scenario: Web показывает портретное и широкое фото целиком
    sha256: 7e2cdc013422a212018aa058eb74b87816f42db3f43b4ffa7562c0aa96f15685
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md, текущий участник
      встречи; зафиксированы exact web build, API, браузер, viewport, locale,
      время и опубликованный raw 3.0.0.
    - Desktop и mobile web проверяются отдельно. Для системной отмены нужен
      настоящий OS picker; подстановка файлов или synthetic cancel не доказывают
      этот путь. Недоступный системный UI отмечается blocked.
    - Подготовлены обезличенные тестовые фото с известными пропорциями, PDF и
      черновик «Привет XX мир» с выделением XX; реальные личные данные не
      используются.
  steps:
    - action: В тестовом альбоме открыть фото 600×1200, 1600×600 и 800×800 с
        контрастными метками всех четырёх краёв на desktop и mobile web.
      expected: Каждый кадр целиком помещается в доступную область с исходными
        пропорциями; все метки видны, нет cover-crop или растягивания. Свободные
        поля допустимы.
    - action: Проверить 390×844, landscape 844×390 и desktop 1440×1000, изменяя
        ориентацию/размер при открытом просмотре.
      expected: Изображение остаётся целым после resize/rotation; закрытие и счётчик
        доступны, горизонтальный/вертикальный overflow не обрезает фото.
    - action: Перелистнуть на следующий снимок и закрыть просмотр видимой кнопкой;
        отдельно проверить desktop ArrowLeft/ArrowRight и Escape.
      expected: Индекс, счётчик и выбранное фото согласованы; возврат сохраняет
        снимок. На телефоне закрытие не зависит от Escape.
