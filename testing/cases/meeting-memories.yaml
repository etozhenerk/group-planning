- id: TC-VIBE-B5FF73B4
  title: "Полноэкранные фото без подписей: Возврат из полноэкранного просмотра"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Полноэкранные фото без подписей
    scenario: Возврат из полноэкранного просмотра
    sha256: eb29a7a26ec8ca2658eb4796761a40ec9384cb89ae38c89d4256ab9febded2da
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Полноэкранный просмотр SHALL сохранять пропорции исходного фото, поддерживать
      свайпы, ArrowLeft/ArrowRight и закрытие через Escape/кнопку закрытия. Возврат
      SHALL восстанавливать выбранное фото. Технические подсказки про жесты, формат
      хранения и права SHALL NOT занимать визуальное пространство альбома.
  steps:
    - action: участник перелистывает фото и закрывает просмотр
      expected: возвращается к тому же фото в фотостопке видит название встречи и счётчик, без подписей к
        снимкам
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
