- id: TC-VIBE-F5929004
  title: "Общий альбом участников: Фото добавляет обычный участник"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Общий альбом участников
    scenario: Фото добавляет обычный участник
    sha256: 8d81832cd0f4a3579c886e378385d1066ff6f7b8813a71349f57abf61499b95d
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Любой текущий участник встречи, включая организатора, SHALL иметь возможность
      добавлять фотографии в её вайб. Добавление SHALL быть явным: фотографии из чата
      SHALL NOT автоматически попадать в альбом. Фотографии SHALL NOT иметь поля
      пользовательской подписи. Доступ SHALL следовать правилам meeting-media и
      существующему доступу к встрече.
  steps:
    - action: участник без роли организатора добавляет выбранные фото
      expected: после подтверждения загрузки фото появляются в общем альбоме форма не запрашивает подписи
        к фотографиям
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
