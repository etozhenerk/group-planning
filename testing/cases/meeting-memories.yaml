  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Предварительная загрузка фотографий web
    scenario: Повторный свайп использует уже загруженные фотографии web
    sha256: 65ab39847e1c01e46b5d7e38efa6f48ce6e0807627236406b96314f19fcc82c4
  platforms:
    - web
  preconditions:
    - Изолированный QA API; точная web сборка, desktop/mobile viewport, два тестовых участника,
      собственные обезличенные изображения.
  steps:
    - action: Открыть альбом из четырёх фото с задержанными ответами; дождаться предварительной загрузки.
      expected: Фото загружаются заранее, количество одновременных запросов ограничено.
    - action: Перелистать все фото вперёд/назад, затем click и закрыть fullscreen, затем drag.
      expected: Тёплый повтор без загрузчиков/повторной сети; click открывает фото, drag только листает.
    - action: Отозвать доступ и выйти; проверить старую ссылку/возврат и другой аккаунт.
      expected: Приватные изображения недоступны; старые запросы не восстанавливают cache, другой аккаунт
        не получает прежние фото.
  cleanup:
    - Удалить только свои тестовые данные, восстановить сеть и viewport.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
