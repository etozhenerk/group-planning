- id: TC-VIBE-IOS-STABLE-SWIPE
  title: Фото не меняет размер после завершённого свайпа
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Устойчивая геометрия нативного свайпа
    scenario: Фото не меняет размер после завершённого свайпа
    sha256: f412a535ba7be71a0b1221ae76d912cb1c2eb34f2169d3af4ceb22e8e0b27b87
  platforms:
    - ios
    - android
  preconditions:
    - Изолированный QA API, точный кандидат выбранной платформы iOS/Android; тестовое устройство с
      экранной клавиатурой.
    - iOS/Android SHALL определять геометрию входящего снимка до показа его передней карточкой и
      сохранять её после завершения жеста. Поздняя загрузка, декодирование или callback кеша SHALL
      NOT менять размер уже показанного фото. Переход задней карточки в переднюю SHALL быть
      непрерывным; отключённые анимации меняют снимок без промежуточного полёта.
  steps:
    - action: Записать оба направления свайпа; сравнить размеры одной входящей карточки в момент settling
        и через0.5/1/2с. Повторить с delayedimage и ReduceMotion.
      expected: Нет позднего скачка размера или замененного изображения. Promotion непрерывен,
        settledgeometry стабильна; ReduceMotion без полёта. Tap открывает правильное полное фото.
  cleanup:
    - Удалить только свои QA данные, вернуть тестовые настройки.
  automation:
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
