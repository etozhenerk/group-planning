- id: TC-VIBE-D2414F1E
  title: "Фотостопка с жестовым управлением: Перелистывание и возврат"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Фотостопка с жестовым управлением
    scenario: Перелистывание и возврат
    sha256: f966057f93d443f4518177574f8d74f41725b1849b0e7e08d5d59ebfbdcd9854
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md;
      зафиксированы сборка, API и время.
    - |-
      Вайб SHALL показывать крупную фотостопку без видимых кнопок листания.
      Горизонтальный жест SHALL двигать верхнее фото за указателем и переключать
      снимок при завершении; короткий жест SHALL возвращать его. Клавиши
      ArrowLeft/ArrowRight SHALL переключать фото вне текстового ввода. Сетка,
      счётчик и полноэкранный просмотр SHALL оставаться доступны.
  steps:
    - action: участник свайпает влево, затем вправо, затем нажимает ArrowLeft
      expected: каждый свайп показывает следующее по порядку фото; явная клавиша
        ArrowLeft возвращает к предыдущему; счётчик и полноэкранная ссылка
        соответствуют текущему снимку
    - action: В mobile web повторить оба горизонтальных свайпа настоящими touch-событиями, начиная
        на самом изображении и его кнопке. Пройти последний снимок, затем короткий и вертикальный
        жест, затем отдельный tap.
      expected: Каждый завершённый горизонтальный свайп показывает следующее фото; после последнего
        стопка начинается заново. Короткий и вертикальный жест не переключают и не открывают
        fullscreen, отдельный tap открывает текущий снимок. Mouse drag не принимается за touch-проверку.
    - action: В web открыть снимок указателем и закрыть полный просмотр крестиком. Проверить
        фактически активный элемент и всю область фотостопки, затем перейти на стопку клавиатурой
        и перелистнуть ArrowLeft/ArrowRight.
      expected: После pointer-закрытия клавиатурная рамка не появляется ни вокруг кнопки фотографии,
        ни вокруг контейнера с tabindex. Фокус и индекс сохраняются. При клавиатурном переходе
        область фотостопки имеет видимый фокус и поддерживает клавиши листания.
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture;
      восстановить изменённые настройки.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
