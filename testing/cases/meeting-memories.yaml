- id: TC-VIBE-D2414F1E
  title: "Фотостопка с жестовым управлением: Перелистывание и возврат"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Фотостопка с жестовым управлением
    scenario: Перелистывание и возврат
    sha256: 067cafcc2ccc725a40759a04e823f7d02ec3ab1a76726661b32ca4f7019b8db5
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Вайб SHALL показывать крупную фотостопку без видимых кнопок листания.
      Горизонтальный жест SHALL двигать верхнее фото за указателем и переключать
      снимок при завершении; короткий жест SHALL возвращать его. Клавиши
      ArrowLeft/ArrowRight SHALL переключать фото вне текстового ввода. Сетка,
      счётчик и полноэкранный просмотр SHALL оставаться доступны.
  steps:
    - action: участник свайпает влево, затем нажимает ArrowLeft
      expected: открывается следующее, затем предыдущее фото счётчик и полноэкранная ссылка соответствуют
        текущему снимку
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
