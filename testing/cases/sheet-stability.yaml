- id: TC-READERS-STABLE-VIEWPORT
  title: Ответ списка не двигает панель
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Стабильное открытие списка прочитавших
    scenario: Ответ списка не двигает панель
    sha256: fcf4ad7b8c2fb1205a5fefc151b7ec6bd7524c23840847d11b2915b4e467e480
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное приложение и synthetic данные; фиксируются точная сборка,
      viewport, время и published4.0.0.
    - >-
      ### Requirement: Стабильное открытие списка прочитавших


      Панель SHALL с первого кадра резервировать viewport трёх строк с двумя
      штатными

      промежутками. Loading, empty, error и list SHALL NOT менять detent или
      положение

      содержимого; длинный список прокручивается внутри.
  steps:
    - action: пользователь открывает список и получает пустой, короткий, длинный ответ
        или ошибку
      expected: header и viewport остаются на прежнем месте без скачка; длинный список
        доступен прокруткой
  cleanup:
    - Удалить только созданные fixture данные; восстановить временные настройки
      тестового устройства.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
- id: TC-CHAT-PENDING-INDICATOR
  title: Быстрая и медленная отправка
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Отложенный индикатор отправки без изменения геометрии
    scenario: Быстрая и медленная отправка
    sha256: 280f9ea44c0ec145bc8dee628a874d16698a1816ef5e5d3ae97d934a92632ee7
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное приложение и synthetic данные; фиксируются точная сборка,
      viewport, время и published4.0.0.
    - >-
      ### Requirement: Отложенный индикатор отправки без изменения геометрии


      Queued/sending SHALL NOT показывать текст отправки. Постоянный слот
      metadata SHALL

      быть пуст первые2000ms от enqueue, затем показывать небольшой спиннер.
      Переход

      queued→sending SHALL NOT сбрасывать таймер; ACK SHALL сохранять
      UI-идентичность

      и высоту строки. Ошибки и действия повтора сохраняются.
  steps:
    - action: пользователь отправляет сообщение с быстрым ACK, затем с ACK дольше двух
        секунд
      expected: у первого индикатор не мелькает; у второго спиннер появляется
        после2000ms без изменения высоты и scroll anchor; ACK не перемонтирует
        строку
  cleanup:
    - Удалить только созданные fixture данные; восстановить временные настройки
      тестового устройства.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
- id: TC-IOS-EMOJI-CATEGORY-ALIGN
  title: Переключение категорий iOS
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Ровные категории эмодзи iOS
    scenario: Переключение категорий iOS
    sha256: 8c94ffb80d35e707526aea797f0fb12c60649843b7ffac39a89b3c2bfa26b3b5
  platforms:
    - ios
  preconditions:
    - Изолированное приложение и synthetic данные; фиксируются точная сборка,
      viewport, время и published4.0.0.
    - >-
      ### Requirement: Ровные категории эмодзи iOS


      Иконки категорий iOS SHALL иметь одинаковый SVG viewBox, frame23 и центр
      цели44×44.

      Selected SHALL NOT менять размер или центр; доступны имя и selected trait.
  steps:
    - action: пользователь последовательно выбирает каждую категорию эмодзи
      expected: размер и центр одинаковы, underline не сдвигает иконки, VoiceOver
        сообщает имя и выбор
  cleanup:
    - Удалить только созданные fixture данные; восстановить временные настройки
      тестового устройства.
  automation:
    ios:
      status: planned
      health: unknown
      tests: []
