- id: TC-TASK-1DAB5DF2
  title: "Предложение не означает принятие: Друг ещё не ответил"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/preparation-tasks/spec.md
    requirement: Предложение не означает принятие
    scenario: Друг ещё не ответил
    sha256: 35bbeed763a1ab75fa6dfc9af5f67c0fb404f80c3e7df384e32b6bcd801f546d
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture и реально собранный клиент по testing/environments.md;
      синтетические профили, зафиксированные build/API, часы, locale ru-RU, timezone и устройство.
      Production и реальные сообщения не используются.
    - "Отдельные синтетические профили: Саша — организатор/автор, Тимофей — адресат, Лена — другой
      текущий участник. У всех исходно есть доступ к разговору; задача и её ревизия зафиксированы."
    - "Mobile web: 320 × 760 и 390 × 844; iOS/Android: выбранный QA-телефон. Для низкой высоты — 390
      × 430 и landscape 844 × 390 на web, реальные доступные ориентация/IME на native. Viewport не
      подменяет системную клавиатуру; недоступное действие фиксируется blocked."
    - На desktop web отдельно проверить общие действия при 1440 px; принятые отдельные страницы и
      sidebar сохраняются. 768 px проверить по опубликованному breakpoint; мобильную композицию не
      навязывать desktop.
  steps:
    - action: Саша предлагает Тимофею «Заказать пиццу»; до действий адресата открыть inline-карточку и
        подробности обоими профилями.
      expected: В обоих местах задача предложена Тимофею от Саши; нет согласившегося исполнителя или
        события принятия.
    - action: Закрыть и повторно открыть подробности без подтверждения принятия.
      expected: Просмотр не меняет статус/ревизию и не назначает исполнителя; черновик разговора сохраняется.
  cleanup:
    - Очистить только собственные fixture-данные после сохранения журнала/evidence; восстановить
      ориентацию, размер текста и настройки клавиатуры.
  automation:
