- id: TC-CHAT-SECURITY-BDBF283F
  title: "Минимизация сохранённых приватных данных: Диагностика сбоя"
  lifecycle: active
  level: e2e
  risk: critical
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-security/spec.md
    requirement: Минимизация сохранённых приватных данных
    scenario: Диагностика сбоя
    sha256: 6267df21f29ef4880949cf5f540ca7d357348ce63c7d8c2eecf8c2c128c76c03
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - Диагностика и журнал уведомлений SHALL обходиться без копий текста и токенов. Нативные
      исходящие SHALL использовать системную защиту хранения; web SHALL учитывать ограничения
      профиля браузера и ошибку сохранения, не обещая защиты от XSS посредством IndexedDB.
  steps:
    - action: фиксируются ошибка отправки, reconnect или задержка синхронизации
      expected: диагностика содержит безопасные идентификаторы/метрики без тела сообщения и credentials
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
