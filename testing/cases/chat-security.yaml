- id: TC-CHAT-SECURITY-791FF479
  title: "Аутентифицированные защищённые соединения: Подписка с чужого сайта или на чужую встречу"
  lifecycle: active
  level: e2e
  risk: critical
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-security/spec.md
    requirement: Аутентифицированные защищённые соединения
    scenario: Подписка с чужого сайта или на чужую встречу
    sha256: 3ec58333d9d6fc9b5a14437d27a04df2ae6cb84ac5b8be269ed2ad3b697934c4
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - Внешние HTTP и realtime-соединения SHALL использовать TLS с проверкой сертификата. Сервер
      SHALL аутентифицировать соединение, проверять web Origin и разрешение подписки; секреты SHALL
      NOT передаваться в URL или попадать в диагностические журналы.
  steps:
    - action: клиент использует запрещённый Origin либо не имеет доступа к запрошенной встрече
      expected: сервер отклоняет подключение или подписку без приватного содержимого
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
