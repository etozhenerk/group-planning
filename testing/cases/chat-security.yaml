- id: TC-CHAT-SECURITY-1DC708F2
  title: "Актуальные права и минимальное уведомление: Отзыв между уведомлением и загрузкой"
  lifecycle: active
  level: e2e
  risk: critical
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-security/spec.md
    requirement: Актуальные права и минимальное уведомление
    scenario: Отзыв между уведомлением и загрузкой
    sha256: ee6b9177879a3af92533f8d2c5e1e8fc85079daff855edbb05c5b030c99ee255
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - Сервер SHALL проверять актуальное членство при выдаче истории, изменений и read state. Общая
      публикация SHALL NOT содержать текст сообщений, индивидуальные позиции чтения или значения
      скрытых голосов.
  steps:
    - action: пользователь потерял доступ после получения сигнала об изменении
      expected: последующий запрос приватных данных отклонён и клиент очищает состояние встречи
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
