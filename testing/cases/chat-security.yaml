  lifecycle: active
  level: integration
  risk: critical
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-security/spec.md
    requirement: Аутентифицированные защищённые соединения
    scenario: Подписка с чужого сайта или на чужую встречу
    sha256: 3ec58333d9d6fc9b5a14437d27a04df2ae6cb84ac5b8be269ed2ad3b697934c4
  platforms: &a2
    - backend
  preconditions:
    - "Изолированное окружение из testing.md: участники A/B/C, посторонний X, встреча M;
      ru-RU/Europe/Moscow, собственные тестовые данные. Записать точную сборку и API. Новые endpoint
      проверяются только после их реализации; до этого результат not_run/blocked."
    - Тестовый TLS endpoint, разрешённый web Origin и посторонний Origin; сессии A/X. Tokens только в
      разрешённых headers/connect credentials.
  steps:
    - action: Подключиться с чужого Origin, подставленным user_id или подписаться X на M.
      expected: Соединение/подписка отклонены без payload; session identity определяется сервером.
    - action: Выполнить допустимые web cookie/native credentials connect и HTTP CSRF mutation.
      expected: Разрешённая аутентификация работает; WS не отменяет CSRF HTTP-команд, credentials отсутствуют в
        URL/логах.
  cleanup:
