- id: TC-CHAT-SECURITY-0830EED9
  title: "Честная модель шифрования: Текущий серверный режим"
  lifecycle: active
  level: e2e
  risk: critical
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-security/spec.md
    requirement: Честная модель шифрования
    scenario: Текущий серверный режим
    sha256: dce90f4486cb80a7d795ef09e87d1da83b2728e52e84ace8af2a21c3af9ff109
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - Продукт SHALL явно различать защиту транспорта/хранилища и E2EE. При доступном серверу тексте
      он SHALL NOT заявлять сквозное шифрование. Заявление о защите хранения SHALL опираться на
      проверенную конфигурацию и восстановление резервных копий.
  steps:
    - action: сервер обрабатывает открытый текст сообщения через TLS
      expected: UI и документация не обещают недоступность содержимого оператору сервера
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
