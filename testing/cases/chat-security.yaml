- id: TC-CHAT-SECURITY-92CE8303
  title: "Изоляция аккаунтов и устаревших ответов: Ответ предыдущего аккаунта"
  lifecycle: active
  level: e2e
  risk: critical
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-security/spec.md
    requirement: Изоляция аккаунтов и устаревших ответов
    scenario: Ответ предыдущего аккаунта
    sha256: 4cb3d1409747cc77bdabb20f0aa61072cc272f9dca1abe548c89a965bb353f1a
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - Клиенты SHALL изолировать историю, черновики, исходящие и cursors по аккаунту и доступу.
      Logout, удаление аккаунта или утрата доступа SHALL отменять работу и очищать соответствующие
      приватные данные; запоздалый ответ SHALL NOT восстанавливать их.
  steps:
    - action: отправка или синхронизация завершилась после входа другим пользователем
      expected: ответ отбрасывается и ни текст, ни read marker не попадают в новый аккаунт
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
