    requirement: Чтение зависит от видимости
    scenario: Сообщение получено в фоне
    sha256: 07e4610d87151bf64297104e3a4cb58c3fb368137f4ecdfba25283789880407e
  platforms: &a2
    - web
    - ios
    - android
  preconditions:
    - "Изолированное окружение из testing.md: участники A/B/C, посторонний X, встреча M;
      ru-RU/Europe/Moscow, собственные тестовые данные. Записать точную сборку и API. Новые endpoint
