      expected: До порога продвижения нет; после порога формируется допустимый read-through с batching не чаще
        1/с.
  cleanup:
    - Остановить только собственный fixture/transport fault, удалить созданную встречу и тестовые
      аккаунты. Вернуть сетевые ограничения и управляемые часы. Не удалять чужие данные и не
      перезапускать пользовательское демо.
  automation:
    web:
      status: partial
      health: unknown
      tests:
        - path: frontend/web/src/entities/meeting/model/createReadMarker.test.ts
          selector: "visibility-qualified read marker"
          runner: web-check
          level: unit
        - path: frontend/web/tests/43-chat-read-visibility.spec.ts
          selector: "a tall message reads only its visible end after controlled foreground dwell"
