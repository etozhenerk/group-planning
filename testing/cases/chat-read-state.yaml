- id: TC-CHAT-READ-STATE-8A47BDBD
  title: "Предсказуемая инициализация: Существующая большая история"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-read-state/spec.md
    requirement: Предсказуемая инициализация
    scenario: Существующая большая история
    sha256: 109a7d9972d85727e5bd38d80142d4e53f71abf10a6894cad287e4dfa70abee7
  platforms: *a1
  preconditions:
    - "Изолированное окружение из testing.md: участники A/B/C, посторонний X, встреча M;
      ru-RU/Europe/Moscow, собственные тестовые данные. Записать точную сборку и API. Новые endpoint
      проверяются только после их реализации; до этого результат not_run/blocked."
    - История M содержит 10k записей, A уже участник; включение read state и конкурентная запись
      управляются барьером.
  steps:
    - action: Инициализировать baseline текущего tail атомарно с новым сообщением B.
      expected: Старая история не объявлена новой; конкурентное сообщение учитывается согласно порядку commit и
        не теряется между baseline/snapshot.
    - action: Проверить actual marker и receipt автора B.
      expected: Actual marker остаётся 0; миграция базы не создаёт прочтение.
    - action: Для старой встречи без chat stream запросить batch receipts и первую страницу readers до первого Sync.
      expected: Оба endpoint доступны после активации; baseline не превращается в прочтение, epoch создаётся один раз без journal/outbox. Посторонний не создаёт stream; continuation без существующего epoch требует reset.
  cleanup:
    - Остановить только собственный fixture/transport fault, удалить созданную встречу и тестовые
      аккаунты. Вернуть сетевые ограничения и управляемые часы. Не удалять чужие данные и не
      перезапускать пользовательское демо.
  automation:
    backend:
      status: planned
      health: unknown
      tests: []
