- id: TC-CHAT-READ-STATE-284DD6EE
  title: "Личные непрочитанные: Смешанные обновления"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-read-state/spec.md
    requirement: Личные непрочитанные
    scenario: Смешанные обновления
    sha256: b791c06b349768012a7296ed786610e6e1f110a28a01948db3be9fbf42be02ba
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - Система SHALL считать непрочитанными сообщения других пользователей после максимума начальной
      базы и позиции прочтения. Собственные сообщения, системные записи, изменения опросов и реакции
      SHALL NOT увеличивать счётчик сообщений. Счётчик и первое непрочитанное SHALL быть согласованы
      между устройствами.
  steps:
    - action: после позиции появились два чужих сообщения, своё сообщение и результат опроса
      expected: счётчик равен двум, а переход к непрочитанным открывает первое чужое сообщение
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
