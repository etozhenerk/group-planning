- id: TC-CHAT-READ-STATE-068DA926
  title: "Общая монотонная позиция прочтения: Запоздалое устройство"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-read-state/spec.md
    requirement: Общая монотонная позиция прочтения
    scenario: Запоздалое устройство
    sha256: 186b905dd9998423c443a7204c2d4da6934d3ae800a96b62ec9948054f6b6449
  platforms: &a1
    - backend
  preconditions:
    - "Изолированное окружение из testing.md: участники A/B/C, посторонний X, встреча M;
      ru-RU/Europe/Moscow, собственные тестовые данные. Записать точную сборку и API. Новые endpoint
      проверяются только после их реализации; до этого результат not_run/blocked."
    - У A есть доступные sequence 140 и 150; два клиента используют одну личность, actual marker <140.
  steps:
    - action: PUT 150, затем запоздалый PUT 140 и повтор PUT 150.
      expected: Фактический marker остаётся 150 во всех ответах; повторы не создают новую запись change/outbox.
    - action: Прочитать sync/list и receipt aggregates другим клиентом A и автором B.
      expected: Личный unread и публичный receipt обновлены разрешёнными projections; read→sync→read не
        образует цикл.
  cleanup:
    - Остановить только собственный fixture/transport fault, удалить созданную встречу и тестовые
      аккаунты. Вернуть сетевые ограничения и управляемые часы. Не удалять чужие данные и не
      перезапускать пользовательское демо.
  automation:
    backend:
      status: planned
      health: unknown
      tests: []
