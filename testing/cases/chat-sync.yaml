    - action: На web открыть вторую вкладку, передать ей очередь после закрытия первой; затем выполнить logout.
      expected: Атомарное владение не создаёт двух активных отправок одного intent; logout очищает общее
        хранилище и владельцев обеих вкладок. Native подтверждает изоляцию после cold start.
  cleanup:
