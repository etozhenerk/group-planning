- id: TC-CHAT-SYNC-E77C7AE6
  title: "Устойчивое намерение отправить: Завершение процесса до ответа"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-sync/spec.md
    requirement: Устойчивое намерение отправить
    scenario: Завершение процесса до ответа
    sha256: e8bf54c9216111e94adced3da0b5ec75ddfe1cca02a7f7adb8b75d2305261ea8
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - Каждый клиент SHALL сохранять исходящее с устойчивым ID до очистки поля и сетевой отправки.
      Повтор с тем же аккаунтом, встречей, ID и содержимым SHALL возвращать прежний результат;
      другое содержимое SHALL отклоняться.
  steps:
    - action: приложение закрыто после локального сохранения и серверного commit, но до получения ответа
      expected: после входа тем же аккаунтом клиент сверяет прежний ID и показывает одну подтверждённую
        запись
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
