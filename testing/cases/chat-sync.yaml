- id: TC-CHAT-SYNC-2D68FE69
  title: "Подтверждённая последовательность обновлений: Своя отправка опередила получение чужой"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-sync/spec.md
    requirement: Подтверждённая последовательность обновлений
    scenario: Своя отправка опередила получение чужой
    sha256: 1b0831757e3ea8a0cd162aac226599266f25c4f5ed957b28d3190055e4e28d0d
  platforms: &a2
    - web
    - ios
    - android
  preconditions:
    - "Изолированное окружение из testing.md: участники A/B/C, посторонний X, встреча M;
      ru-RU/Europe/Moscow, собственные тестовые данные. Записать точную сборку и API. Новые endpoint
      проверяются только после их реализации; до этого результат not_run/blocked."
    - Владелец клиента получил M до sequence=100; transport позволяет отдельно выпускать GET и POST
      ответы, доступ A действует.
  steps:
    - action: Сохранить чужую 101; вернуть ACK собственной 102 до следующего GET. Записать display entries и
        следующий запрос.
      expected: ACK виден один раз, но receive cursor остаётся 100 и запрос начинается после 100, не
        102/latest_sequence.
    - action: Вернуть 101/102 двумя страницами; повторить страницу и выполнить before=100. Затем вернуть пустой
        incremental.
      expected: Итог 100/101/102 в серверном порядке, дублей нет. Cursor двигается лишь с применёнными GET;
        history/пустой ответ его не меняют.
    - action: Повторить на пустом initial и sequence выше 2^53; прервать применение второй страницы.
      expected: После пустого initial используется after=0; precision сохранена, cursor не опережает
        применённые данные после ошибки.
  cleanup:
    - Остановить только собственный fixture/transport fault, удалить созданную встречу и тестовые
      аккаунты. Вернуть сетевые ограничения и управляемые часы. Не удалять чужие данные и не
      перезапускать пользовательское демо.
  automation:
    web:
      status: partial
      health: unknown
      tests:
        - path: frontend/web/src/entities/meeting/model/loadChat.test.ts
          selector: "uses snapshot and then the confirmed cursor, committing each bounded page before the next"
          runner: web-check
          level: integration
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
