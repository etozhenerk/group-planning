- id: TC-CHAT-SYNC-AA76CADB
  title: "Восстановление после разрыва и перезапуска: Сбой после commit до уведомления"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-sync/spec.md
    requirement: Восстановление после разрыва и перезапуска
    scenario: Сбой после commit до уведомления
    sha256: 0878f8c98471b8d19ae10bf2ecfd20b99956e6bb191eb453d87cc8c29f94c3c5
  platforms: &a3
    - backend
  preconditions:
    - "Изолированное окружение из testing.md: участники A/B/C, посторонний X, встреча M;
      ru-RU/Europe/Moscow, собственные тестовые данные. Записать точную сборку и API. Новые endpoint
      проверяются только после их реализации; до этого результат not_run/blocked."
    - Memory используется для rollback/dispatch fault; сохранность рестарта проверяется только на
      изолированной somewhere_integration. Есть управляемые точки до publish и после publish до отметки.
  steps:
    - action: Commit сообщения вместе с change/outbox; остановить dispatcher до publish, затем перезапустить
        API/dispatcher на SQL.
      expected: Сообщение, change и недоставленный outbox сохранены; drain публикует hint без нового сообщения.
    - action: Повторить crash после publish до отметки и потерю NOTIFY; затем rollback предметной транзакции.
      expected: Повтор hint безопасен; периодический drain восстанавливает доставку, rollback не оставляет ни
        запись, ни change/outbox.
    - action: Ограничить очередь медленного клиента и исчерпать recovery retention.
      expected: Потребитель отключается восстановимо; недоставленный outbox не теряется молча, HTTP
        catch-up/reset сохраняет доступные изменения.
  cleanup:
    - Остановить только собственный fixture/transport fault, удалить созданную встречу и тестовые
      аккаунты. Вернуть сетевые ограничения и управляемые часы. Не удалять чужие данные и не
      перезапускать пользовательское демо.
