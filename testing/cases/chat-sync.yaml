- id: TC-CHAT-SYNC-65C6F806
  title: "Жизненный цикл и совместимость транспорта: Исправное соединение без активности"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/chat-sync/spec.md
    requirement: Жизненный цикл и совместимость транспорта
    scenario: Исправное соединение без активности
    sha256: 01a2d83a85187cc6772e00f96c0b726e4aa76904ebab9faa06f953a149500e5c
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - Новые клиенты SHALL получать изменения в активной сессии без постоянного опроса ленты при
      исправном realtime-канале. При его отказе SHALL существовать ограниченный запасной режим;
