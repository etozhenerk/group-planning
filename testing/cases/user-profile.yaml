- id: TC-PROFILE-F319B092
  title: "Синхронизация данных Яндекс ID: Явное очищение и частичные права"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/user-profile/spec.md
    requirement: Синхронизация данных Яндекс ID
    scenario: Явное очищение и частичные права
    sha256: da37fbbe2f238a0bd9a2fcceebc85b6f15967a6e025fe79cc4eb975ad2370fca
  platforms:
    - backend
  preconditions:
    - Изолированный identity/HTTP fixture с fake-provider и управляемыми полями; зафиксированы
      версия API, commit и тестовый subject. Реальный OAuth не объявляется проверенным этим тестом.
  steps:
    - action: Создать профиль с именем и датой, повторно войти с birthday=null при отсутствующем
        first_name.
      expected: Дата явно очищена, известное имя сохранено; отсутствующие необязательные поля не блокируют
        вход.
    - action: Повторить вход с полями контактов, отсутствующими из-за прав нового токена.
      expected: Известные контакты не затёрты; новые непредоставленные права не объявлены полученными.
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/identity/profile_test.go
          selector: TestRepeatedLoginPreservesMissingOptionalFields
          runner: backend-unit-integration
          level: integration
- id: TC-PROFILE-YANDEX-FIELDS
  title: "Профиль: реальные поля Яндекс ID, неполные данные и повторный вход"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/user-profile/spec.md
    requirement: Синхронизация данных Яндекс ID
    scenario: Все права и полные данные
    sha256: 0a877b0c47ed148b6d4653c54c6c116569dd8ff96235cd0588dcd8237cd13f50
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный fixture с управляемыми полями fake-provider; полные поля, затем birthday
      0000-12-23/sex null, затем явное очищение birthday при отсутствующем first_name. Фиксируются
      клиент/API и тестовый профиль.
    - Это проверка отображения/синхронизации на fake-provider. Реальный OAuth проверяется отдельно
      на доступном тестовом аккаунте, без паролей/токенов в evidence.
  steps:
    - action: Войти с полным набором полей и открыть собственный профиль.
      expected: Отображены полученные сервером имя, аватар, Яндекс ID, логин, имя/фамилия, дата рождения,
        пол и контакты; нет редактора и демонстрационных подстановок.
    - action: Повторить вход с неполной датой и неизвестным полом, открыть профиль после обновления.
      expected: Показаны «23 декабря» и «Не указано» без выдуманного года/возраста/пола; прежняя сессия
        остаётся действительной.
    - action: Войти с явным очищением birthday при отсутствующем first_name; затем проверить профиль без
        аватара/телефона.
      expected: Дата очищена, известное имя сохранено; инициалы/«Не указан» заменяют только реально
        отсутствующие значения.
    - action: Другим участником открыть состав/автора сообщения.
      expected: Личные поля владельца не раскрываются; доступны только публичные имя/аватар/ID.
  cleanup:
    - Очистить только тестовые данные и восстановить настройки; сохранить обезличенные результаты.
      Не затрагивать production или реальные обращения.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
