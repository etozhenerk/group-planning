- id: TC-PROFILE-4F3DAAFE
  title: "Синхронизация данных Яндекс ID: Все права и полные данные"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/user-profile/spec.md
    requirement: Синхронизация данных Яндекс ID
    scenario: Все права и полные данные
    sha256: 0a877b0c47ed148b6d4653c54c6c116569dd8ff96235cd0588dcd8237cd13f50
  platforms:
    - backend
  preconditions:
    - Изолированный identity/HTTP fixture с fake-provider и управляемыми полями; зафиксированы
      версия API, commit и тестовый subject. Реальный OAuth не объявляется проверенным этим тестом.
  steps:
    - action: Пройти тестовый OAuth/SDK обмен с полными выбранными полями provider; запросить собственный
        профиль по HTTP.
      expected: API возвращает ровно проверенные сервером значения, не доверяет полям клиента;
        отсутствующее не подменяет демонстрационным. Отображение всех клиентов принимается отдельно
        в TC-PROFILE-YANDEX-FIELDS.
    - action: Повторить вход того же subject и проверить прежнюю сессию.
      expected: Идентификатор профиля тот же, известные данные обновлены; прежняя действующая сессия не
        отозвана только из-за нового входа.
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/identity/profile_test.go
          selector: TestRepeatedLoginPreservesMissingOptionalFields
          runner: backend-unit-integration
          level: integration
