- id: TC-PROFILE-CC2372B4
  title: "Просмотр собственного профиля: Профиль без телефона"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/user-profile/spec.md
    requirement: Просмотр собственного профиля
    scenario: Профиль без телефона
    sha256: 23545cd104d25185a681d1bcf35df79f520e165dcff2a0858e77ccab51ead3e7
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - >-
      Клиенты SHALL открывать профиль из общей навигации и показывать имя, аватар,

      связь с Яндекс ID, логин, имя, фамилию, дату рождения, пол и доступные контакты. Отсутствие
      аватара SHALL заменяться

      инициалами, отсутствие контакта — честной подписью. Редактирование имени,

      аватара и контактов не входит в этот этап.
  steps:
    - action: Яндекс не передал телефон
      expected: в поле видно «Не указан», а остальные сведения доступны
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
