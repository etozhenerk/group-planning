- id: TC-OPS-1326848C
  title: "Ограниченные повторы и приватность: Долгое ограничение Telegram"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/telegram-monitoring-bot/specs/operations-telegram-notifications/spec.md
    requirement: Ограниченные повторы и приватность
    scenario: Долгое ограничение Telegram
    sha256: c791265ed79722768b78ba31028ba130e1c14054187e4fdf1fd5cb828062e499
  platforms:
    - monitoring
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Обработка SHALL иметь дедлайн 30 с, до трёх попыток Telegram, учёт retry_after
      и безопасные ошибки без токена/URL/payload. Секрет SHALL читаться из Lockbox;
      весь процесс SHALL работать без БД/API somewhere. Лимит PNG — 1 МиБ.
  steps:
    - action: Telegram требует retry_after больше пяти секунд
      expected: функция возвращает наблюдаемую ошибку без длительного ожидания и бесконечных повторов
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    monitoring:
      status: manual
      health: unknown
      tests: []
