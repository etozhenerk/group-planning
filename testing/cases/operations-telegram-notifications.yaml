- id: TC-OPS-A77B6B93
  title: "Разрешённые источники и получатель: Подмена параметров"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/telegram-monitoring-bot/specs/operations-telegram-notifications/spec.md
    requirement: Разрешённые источники и получатель
    scenario: Подмена параметров
    sha256: c0f0d605f9cf66bb3fdc5ec511d96b48aa5da8309b4945383e6aea2ccf18dcbf
  platforms:
    - monitoring
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Бот SHALL принимать только известные alert ID/статусы и согласованные технические
      метки. Запросы, единицы, пороги, ссылки и получатель SHALL задаваться конфигурацией;
      событие SHALL NOT подменять их. Неизвестное событие SHALL завершаться без отправки.
  steps:
    - action: событие содержит неизвестный alert ID, чужой folder/host/environment либо произвольные
        annotations
      expected: чужое событие отклоняется, annotations не используются для запросов, ссылок или текста
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    monitoring:
      status: manual
      health: unknown
      tests: []
- id: TC-OPS-9D3AB3FA
  title: "График и честное отсутствие данных: Нет свежей истории"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/telegram-monitoring-bot/specs/operations-telegram-notifications/spec.md
    requirement: График и честное отсутствие данных
    scenario: Нет свежей истории
    sha256: b8fa6f0ac16a8a9495abe97bd17d975482f193631b31dfd9c48b50c117ee9faf
  platforms:
    - monitoring
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Бот SHALL строить PNG из истории выбранной метрики с единицами, порогами, UTC-временем
      и разрывами. PNG SHALL NOT называться скриншотом интерфейса. Пропуск SHALL NOT стать
      нулём. Сбой чтения/рендера SHALL приводить к тексту с причиной отсутствия графика.
  steps:
    - action: источник пуст, недоступен или последнее значение старше трёх минут
      expected: уведомление явно показывает отсутствие или устаревание данных; не объявляет ноль или норму
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    monitoring:
      status: manual
      health: unknown
      tests: []
