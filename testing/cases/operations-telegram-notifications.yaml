- id: TC-OPS-EC714809
  title: "Воспроизводимая эксплуатация: Код проверен без токена"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/telegram-monitoring-bot/specs/operations-telegram-notifications/spec.md
    requirement: Воспроизводимая эксплуатация
    scenario: Код проверен без токена
    sha256: 6788c4ecb4e637dc7f3c3a4c7187fe7a8e5fe4f74483b1d4f6a39f25f9a8577d
  platforms:
    - monitoring
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Репозиторий SHALL содержать отдельный модуль, сборку, CI, каталог метрик и инструкцию
      закрытого выпуска/отката. Реальная доставка SHALL считаться подтверждённой только
      после проверки в разрешённом Telegram-чате, отдельно от тестов с заглушками.
  steps:
    - action: локальные тесты и сборка прошли, но бот ещё не подключён к чату
      expected: отчёт фиксирует готовность к подключению и непроверенную живую доставку отдельно
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    monitoring:
      status: manual
      health: unknown
      tests: []
