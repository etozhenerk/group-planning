- id: TC-FEED-1900A3BA
  title: "Один блок деталей встречи на вебе: Широкий экран"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/event-feed/spec.md
    requirement: Один блок деталей встречи на вебе
    scenario: Широкий экран
    sha256: eb11ba7a4955b06f594f2357a43263953fc6130ab694dc7198b23a092d169156
  platforms:
    - web
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Веб SHALL показывать одно название встречи в шапке. Дата, место, описание
      и компания SHALL находиться в правой панели при ширине от 1170 px или
      в панели по `i` на меньшей ширине. Эти варианты SHALL NOT показываться
      одновременно; лента SHALL NOT повторять текущие детали отдельным вступлением.
  steps:
    - action: ширина экрана не меньше 1170 px
      expected: детали находятся справа, кнопка `i` отсутствует, в ленте нет повторного блока
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
