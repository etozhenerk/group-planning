- id: TC-FEED-5C22B221
  title: "Компактная форма опроса: Длинная форма на телефоне"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/event-feed/spec.md
    requirement: Компактная форма опроса
    scenario: Длинная форма на телефоне
    sha256: 2bf1cfd17b69b1c0be6ba927af5ae5f4443c39d60df3e233b1b97d1a3a8b9007
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture и реально собранный клиент по testing/environments.md;
      синтетические профили, зафиксированные build/API, часы, locale ru-RU, timezone и устройство.
      Production и реальные сообщения не используются.
    - "Mobile web: 320 × 760 и 390 × 844; iOS/Android: выбранный QA-телефон. Для низкой высоты — 390
      × 430 и landscape 844 × 390 на web, реальные доступные ориентация/IME на native. Viewport не
      подменяет системную клавиатуру; недоступное действие фиксируется blocked."
    - На desktop web отдельно проверить общие действия при 1440 px; принятые отдельные страницы и
      sidebar сохраняются. 768 px проверить по опубликованному breakpoint; мобильную композицию не
      навязывать desktop.
    - Участник открывает форму даты; вариантов/настроек больше доступной высоты, задан черновик и
      участок чата выше конца.
  steps:
    - action: Добавить третий вариант, открыть календарь у нижней строки и прокрутить форму до конца,
        затем обратно.
      expected: Прокручиваются только поля, календарь доступен внутри панели, кнопка создания остаётся
        видимой. Тень над кнопкой есть, пока ниже остаётся непросмотренное содержимое.
    - action: Проверить все пять настроек и ошибку пустой/дублированной даты, затем нажать фон и снова
        открыть форму.
      expected: Настройки не скрыты в раскрывающие блоки; отправка фокусирует первое ошибочное поле. Фон
        чата не прокручен; закрытие не публикует запрос, при открытии восстановлен черновик.
  cleanup:
    - Очистить только собственные fixture-данные после сохранения журнала/evidence; восстановить
      ориентацию, размер текста и настройки клавиатуры.
  automation:
