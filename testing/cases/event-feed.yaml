- id: TC-FEED-C013DF5D
  title: "Шапка встречи и доступные панели веба: Приглашение из шапки на телефоне"
  lifecycle: active
  level: e2e
  risk: critical
  source:
    path: openspec/changes/gathering-activity-feed/specs/event-feed/spec.md
    requirement: Шапка встречи и доступные панели веба
    scenario: Приглашение из шапки на телефоне
    sha256: 3619f521b646389f9050eb71cd72b10913c02c76897e86cb15705c96eb8d2094
  platforms:
    - web
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Веб-клиент SHALL выравнивать заголовок встречи и действия шапки по центру
      и использовать узнаваемую иконку передачи приглашения. Панели SHALL плавно
      появляться по центру широкого экрана и от нижнего края телефона; настройка
      уменьшения движения SHALL отключать анимацию. Закрытие и фокус SHALL сохранять
      доступность клавиатуры, а подписи действий внутри панели SHALL оставаться читаемыми.
  steps:
    - action: организатор нажимает «Пригласить друзей» в шапке встречи
      expected: нижняя панель показывает ссылку и читаемые действия закрытие возвращает фокус на кнопку
        приглашения
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
