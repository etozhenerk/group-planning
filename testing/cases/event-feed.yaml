      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
- id: TC-FEED-1BFACA40
  title: "Завершённое движение диалога: Закрытие шторки жестом"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/event-feed/spec.md
    requirement: Завершённое движение диалога
    scenario: Закрытие шторки жестом
    sha256: fb352927592f17328c93cd730d944345b1b5c363be3adc2fa7c56b604d8e8af6
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture и реально собранный клиент по testing/environments.md;
      синтетические профили, зафиксированные build/API, часы, locale ru-RU, timezone и устройство.
      Production и реальные сообщения не используются.
    - "Mobile web: 320 × 760 и 390 × 844; iOS/Android: выбранный QA-телефон. Для низкой высоты — 390
      × 430 и landscape 844 × 390 на web, реальные доступные ориентация/IME на native. Viewport не
      подменяет системную клавиатуру; недоступное действие фиксируется blocked."
    - Открыта нижняя панель из чата с черновиком; выбран режим обычного движения и доступен режим
      reduced motion.
  steps:
    - action: Потянуть вниз коротким жестом верхнюю область панели, включая отступы над ручкой и сбоку,
        затем отпустить.
      expected: Панель следует жесту и возвращается без закрытия/потери данных; скролл полей не подменяет
        жест верхней области.
    - action: Повторить достаточный/быстрый свайп, затем переоткрыть и проверить крестик/системный Back.
      expected: Панель уходит за нижний край; содержимое и блокировка фона живут до конца выхода.
        Возвращается фокус открытия и исходный участок чата; Back не открывает отдельный экран.
    - action: Повторить закрытие с reduced motion и на desktop через крестик.
      expected: Уменьшение движения отключает анимацию без изменения результата; desktop сохраняет свой
        диалог/маршрут, крестик доступен.
  cleanup:
