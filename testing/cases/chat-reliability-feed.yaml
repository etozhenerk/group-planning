- id: TC-CHAT-PAGE-BOUNDS
  title: "Ограниченная загрузка и отображение истории: Границы страницы и пустой хвост"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/chat-reliability-and-sync/specs/event-feed/spec.md
    requirement: Ограниченная загрузка и отображение истории
    scenario: Границы страницы и пустой хвост
    sha256: 7a283a8e0b6066f72508b56c7cf3a9d598191a7e8a76cf1ea8b135ccbde966e8
  platforms:
    - backend
  preconditions:
    - "Изолированное окружение из testing.md: участники A/B/C, посторонний X, встреча M;
      ru-RU/Europe/Moscow, собственные тестовые данные. Записать точную сборку и API. Новые endpoint
      проверяются только после их реализации; до этого результат not_run/blocked."
    - "Memory contract fixture и изолированный PostgreSQL: 1k/10k/100k записей, limit 1/50/100; seed
      высоких sequence без создания 2^64 строк."
  steps:
    - action: Запросить initial, after=0/tail, before first/tail и around существующей записи; проверить
        limit+1 и order.
      expected: Ближайшие страницы без дыр/дублей, ASC результат, правильные направления has_more; пустой after
        пуст, tail согласован с snapshot.
    - action: Проверить значения выше 2^53, uint64 max/overflow, limit 0/101, несовместимые cursors, missing
        around, cancel и чужой доступ.
      expected: Точность decimal сохранена; некорректное отклонено, cancellation завершает чтение, права
        проверены до приватных данных.
    - action: Изменить возвращённую memory-копию, сделать rollback; выполнить SQL EXPLAIN и trace ограниченного
        чтения.
      expected: Store не изменён копией/rollback. Нет полного чтения/декодирования JSON ради страницы, есть
        индекс/LIMIT; p95 страницы≤100мс в записанном окружении.
