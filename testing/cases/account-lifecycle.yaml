- id: TC-ACCOUNT-139EA5EB
  title: "Исключение участника и сохранение истории: Голос в открытом и закрытом опросах"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/account-deletion/specs/account-lifecycle/spec.md
    requirement: Исключение участника и сохранение истории
    scenario: Голос в открытом и закрытом опросах
    sha256: 7b02468d55fbd5668ef83f63bb480b566e0f77cfc915826af8b0a6a0bfe8c16b
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      В сохранённых встречах система SHALL удалить ответы пользователя и его голоса
      в открытых опросах, пересчитать текущий состав по правилам опроса и заменить
      сохранённые имена автора на «Удалённый аккаунт». Закрытые результаты и тексты
      переписки SHALL сохраняться; удаление профиля SHALL не переписывать свободный текст.
    - Удаление выполняется тестовым HTTP-клиентом через сохранённый DELETE /me под собственной
      тестовой сессией; клиент проверяемого оставшегося участника открыт. Скрытый пункт профиля не
      требуется и не включается тестом.
  steps:
    - action: Через настоящий DELETE /me удалить соответствующего тестового участника с действующей
        сессией и CSRF для web; в клиенте оставшегося участника открыть опросы, задачи и историю.
      expected: его открытый голос удалён, закрытый результат не пересчитан, прежнее имя нигде в профиле
        или снимках авторства не отображается
  cleanup:
