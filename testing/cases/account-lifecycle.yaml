- id: TC-ACCOUNT-3B50E73F
  title: "Автоматический преемник организатора: Несколько участников и более ранний отказ"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/account-deletion/specs/account-lifecycle/spec.md
    requirement: Автоматический преемник организатора
    scenario: Несколько участников и более ранний отказ
    sha256: f577f4eb21f0e1605976d1cc2bfb79b3a5ac58fc0d9dcc5356b376b838c85e9b
  platforms:
    - backend
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      При удалении организатора система SHALL передать каждую его встречу оставшемуся
      текущему участнику «Приду», чьё первое вступление произошло раньше остальных.
      Передача SHALL не требовать подтверждения преемника и SHALL давать ему все
      права организатора. Повторное вступление SHALL не менять очередь первого вступления.
  steps:
    - action: организатор удаляется, первым вступил А и затем отказался, вторым Б с текущим «Приду»,
        третьим В с текущим «Приду»
      expected: организатором становится Б, а А и удаляемый человек не учитываются
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    backend:
      status: manual
      health: unknown
      tests: []
