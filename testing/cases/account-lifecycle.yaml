- id: TC-ACCOUNT-1C58ABFB
  title: "Атомарность и безопасный повтор: Ошибка во второй встрече"
  lifecycle: active
  level: integration
  risk: critical
  source:
    path: openspec/changes/account-deletion/specs/account-lifecycle/spec.md
    requirement: Атомарность и безопасный повтор
    scenario: Ошибка во второй встрече
    sha256: 3bb01ee3d3e2640d32ac8140a1f135cac2ddcede828418ae522809fe17e7d5c9
  platforms:
    - backend
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Удаление профиля и обработка всех встреч SHALL быть одной атомарной операцией.
      Повтор с тем же случайным секретом операции SHALL подтверждать прежний успех
      в течение 24 часов без действующей сессии и без удаления нового аккаунта.
      Секрет повтора SHALL не давать доступа к другим операциям или данным.
  steps:
    - action: операция завершилась ошибкой при обработке одной из встреч
      expected: профиль, сессии и все встречи остаются в исходном состоянии
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    backend:
      status: manual
      health: unknown
      tests: []
