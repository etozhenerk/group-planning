- id: TC-ACCOUNT-766FCFA1
  title: "Состояния клиента и очистка: Перезапуск после сетевой ошибки"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/account-deletion/specs/account-lifecycle/spec.md
    requirement: Состояния клиента и очистка
    scenario: Перезапуск после сетевой ошибки
    sha256: 64083036632cbd96c4ef8dd4fad16cef567ac481b14651038fb43a6f5a39305d
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Клиенты SHALL сохранять ключ незавершённой операции до подтверждения результата,
      показывать ожидание без повторных отправок и предлагать повтор при неопределённом
      результате. После подтверждённого удаления SHALL очищаться сессия, приватный
      кэш, черновики и контекст приглашений; публичный экран SHALL сообщать об успехе.
    - Пункт удаления в новом профиле скрыт. Для проверки совместимости подготовлено
      документированное состояние ранее начатой операции в собственном QA-клиенте; handler не
      вызывается напрямую. Если воспроизвести это состояние невозможно, кейс blocked, а не pass по
