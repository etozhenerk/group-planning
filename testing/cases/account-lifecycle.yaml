- id: TC-ACCOUNT-FB303DFB
  title: "Подтверждённое удаление собственного аккаунта: Пользователь отменил подтверждение"
  lifecycle: active
  level: e2e
  risk: critical
  source:
    path: openspec/changes/account-deletion/specs/account-lifecycle/spec.md
    requirement: Подтверждённое удаление собственного аккаунта
    scenario: Пользователь отменил подтверждение
    sha256: d0cbacf79dd62d32a290e10fb198cdd65d14e03d2abd672bd7361cb2ca774c52
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Web, iOS и Android SHALL предоставлять удаление в меню профиля. Перед отправкой
      клиент SHALL объяснять необратимость, сохранение общей переписки без имени,
      передачу организации и удаление встреч без преемника. Сервер SHALL принимать
      первый запрос только от действующей сессии удаляемого пользователя; web требует
      Origin и CSRF. Идентификатор чужого профиля SHALL NOT приниматься от клиента.
  steps:
    - action: пользователь открыл подтверждение и нажал «Отмена»
      expected: запрос не отправляется и профиль, встречи и сессия остаются прежними
  cleanup:
