- id: TC-ACCOUNT-A8D0B8CD
  title: "Отзыв профиля и доступа: Старое действие после удаления"
  lifecycle: active
  level: integration
  risk: critical
  source:
    path: openspec/changes/account-deletion/specs/account-lifecycle/spec.md
    requirement: Отзыв профиля и доступа
    scenario: Старое действие после удаления
    sha256: 2a1010d596ee16b37f56745e37f8afb338d3b83e9a1e074d0a6bb21bee3fd044
  platforms:
    - backend
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Успешное удаление SHALL удалять профиль, привязку провайдера, все сессии и связанные
      handoff. Старая сессия и ранее проверенный запрос SHALL не позволять восстановить
      участие или создать данные. Новый самостоятельный вход через тот же Яндекс ID
      SHALL создавать новый пустой профиль, без восстановления прежних прав.
  steps:
    - action: запрос успел пройти проверку сессии до удаления, но записывает сообщение или RSVP после него
      expected: запись отклоняется и удалённый пользователь не возвращается в состав
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    backend:
      status: manual
      health: unknown
      tests: []
