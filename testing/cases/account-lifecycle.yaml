- id: TC-ACCOUNT-FB303DFB
  title: "Подтверждённое удаление собственного аккаунта: Удаление скрыто в профиле"
  lifecycle: active
  level: e2e
  risk: critical
  source:
    path: openspec/changes/account-deletion/specs/account-lifecycle/spec.md
    requirement: Подтверждённое удаление собственного аккаунта
    scenario: Удаление скрыто в профиле
    sha256: ae0b403ddca9d9b9e6e4298f4c769e57d8c3114a65fb7f39b532d469a59f7c07
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Web, iOS и Android SHALL скрывать вход в удаление в профиле. Просмотр профиля
      SHALL NOT отправлять запрос удаления. API SHALL сохраняться: первый запрос
      требует действующей собственной сессии, web Origin и CSRF; чужой идентификатор
      не принимается. Атомарность, безопасный повтор и очистка ранее начатых операций
      SHALL сохраняться по следующим требованиям.
  steps:
    - action: Открыть профиль, прокрутить все действия и проверить дерево доступности; вернуться во
        встречи.
      expected: Пункта и кнопки удаления аккаунта нет визуально и в accessibility. DELETE /me не вызван;
        профиль, встречи и сессия не изменены.
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
- id: TC-ACCOUNT-9A32B220
  title: "Подтверждённое удаление собственного аккаунта: Посторонний запрос"
  lifecycle: active
  level: integration
  risk: critical
  source:
    path: openspec/changes/account-deletion/specs/account-lifecycle/spec.md
    requirement: Подтверждённое удаление собственного аккаунта
    scenario: Посторонний запрос
    sha256: f8ffed4f4a72c2fa6e4e4b9d78539d3142854f82f035e058daf2f4c4b4719bb3
  platforms:
    - backend
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Web, iOS и Android SHALL скрывать вход в удаление в профиле. Просмотр профиля
      SHALL NOT отправлять запрос удаления. API SHALL сохраняться: первый запрос
      требует действующей собственной сессии, web Origin и CSRF; чужой идентификатор
      не принимается. Атомарность, безопасный повтор и очистка ранее начатых операций
      SHALL сохраняться по следующим требованиям.
    - Каждый вариант использует свежие отдельные тестовые профили и действующую сессию там, где она
      нужна; положительный контроль не выполняется после удаления того же профиля.
  steps:
    - action: В изолированном HTTP fixture отправить DELETE /me без сессии, с отозванной сессией и с
        web-cookie без корректных Origin/CSRF. Сохранить снимки профилей и встреч.
      expected: Неавторизованные варианты отклонены без мутаций.
    - action: Под собственной действующей сессией попытаться передать идентификатор другого тестового
        профиля как цель удаления.
      expected: "Чужой профиль и его встречи не удалены: API не принимает внешний идентификатор как цель
        вместо владельца сессии."
    - action: На отдельном тестовом профиле выполнить тот же API действующей собственной сессией с
        корректными web Origin/CSRF и новым ключом операции.
      expected: "API удаления сохранён: подтверждает 204 и удаляет только собственный профиль по прежним
        атомарным правилам; скрытие пункта UI не отключает операцию."
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    backend:
      status: manual
      health: unknown
      tests: []
- id: TC-ACCOUNT-3B50E73F
  title: "Автоматический преемник организатора: Несколько участников и более ранний отказ"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/account-deletion/specs/account-lifecycle/spec.md
    requirement: Автоматический преемник организатора
    scenario: Несколько участников и более ранний отказ
    sha256: f577f4eb21f0e1605976d1cc2bfb79b3a5ac58fc0d9dcc5356b376b838c85e9b
  platforms:
    - backend
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      При удалении организатора система SHALL передать каждую его встречу оставшемуся
      текущему участнику «Приду», чьё первое вступление произошло раньше остальных.
      Передача SHALL не требовать подтверждения преемника и SHALL давать ему все
      права организатора. Повторное вступление SHALL не менять очередь первого вступления.
  steps:
    - action: организатор удаляется, первым вступил А и затем отказался, вторым Б с текущим «Приду»,
        третьим В с текущим «Приду»
      expected: организатором становится Б, а А и удаляемый человек не учитываются
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    backend:
      status: manual
      health: unknown
      tests: []
