- id: TC-LIST-6FB6D20F
  title: "Календарная граница истории: Вечер встречи"
  lifecycle: active
  level: unit
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/personal-meetings/spec.md
    requirement: Календарная граница истории
    scenario: Вечер встречи
    sha256: d205ab2478d411bd9610d104e473a4d9476af51282715cfea6a32876d31ab7f5
  platforms:
    - backend
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Система SHALL хранить статус встречи. Отложенная задача SHALL сохранять `past`
      со следующего дня по часовому поясу встречи, независимо от пользовательских
      запросов. До границы встреча SHALL оставаться в «Предстоящих». Граница использует
      серверное время и календарную дату, не прибавление 24 часов. API и статистика
      SHALL читать сохранённый статус; GET SHALL NOT менять его.
  steps:
    - action: встреча назначена на 24 октября в 19:00 по Москве, а сейчас 24 октября 23:00 по Москве
      expected: встреча остаётся в «Предстоящих»
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    backend:
      status: manual
      health: unknown
      tests: []
