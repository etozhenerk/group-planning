- id: TC-LIST-44EEA6A3
  title: "Надёжное выполнение отложенного перехода: Задача без посещений"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/personal-meetings/spec.md
    requirement: Надёжное выполнение отложенного перехода
    scenario: Задача без посещений
    sha256: 4b8077db162d74bb6e0f13b29c9214d518dbba8a867ced193d3ce25db255333c
  platforms:
    - backend
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Система SHALL согласованно сохранять встречу и задачу перехода. Обработчик
      SHALL безопасно переносить повторную доставку, проверять актуальное расписание
      перед записью и повторять выполнение после временных ошибок. В варианте с
      постоянным хранилищем задачи SHALL сохраняться после перезапуска и выполняться
      после пропущенного срока. Мок в памяти SHALL NOT считаться проверкой этой гарантии.
  steps:
    - action: срок задачи наступил и после создания встречи не было пользовательских запросов
      expected: обработчик сохраняет `past`, а последующая статистика читает этот статус
  cleanup:
