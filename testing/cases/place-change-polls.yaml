- id: TC-PLACE-D40C53F7
  title: "Текущий состав голосующих за место: Голосовавший вышел и вернулся"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/place-change-polls/spec.md
