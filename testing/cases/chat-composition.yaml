- id: TC-CHAT-1064C7F5
  title: "Панели действий чата на телефоне: Действие в мобильном чате"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Панели действий чата на телефоне
    scenario: Действие в мобильном чате
    sha256: 2f5990c8b9f756e2bb44f2ed327bbf523cfab48b7f323dfd39111c931743e720
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      На mobile web, iOS и Android все голосования, задачи и прочие действия из чата
      SHALL открываться в bottom sheet без отдельного экрана с Back, нижней навигации
      и футера. Desktop MAY сохранять отдельные страницы. Бизнес-правила опросов
      и задач SHALL сохраняться. Предложение места SHALL поддерживать необязательное
      пояснение «Почему здесь» до 2000 символов. Пояснение SHALL быть неизменяемой
      частью предложения, доступной только участникам с доступом к чату.
  steps:
    - action: пользователь открывает голосование, задачу или другое действие из чата на телефоне
      expected: действие открывается в bottom sheet поверх текущего чата отдельная страница с кнопкой
        «Назад» не появляется закрытие панели восстанавливает чат и сохраняет несданный черновик по
        UX
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
