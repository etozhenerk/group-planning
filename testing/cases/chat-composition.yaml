    - Два текущих участника имеют доступ к одной встрече; есть сообщения с устойчивыми ID, обычный текст,
      сообщение с вложением и системное событие. Разговор длиннее viewport; записан видимый участок выше конца
      и неотправленный черновик «До XX после».
    - "Mobile web: 320 × 760 и 390 × 844; iOS/Android: выбранный QA-телефон. Для низкой высоты — 390 × 430 и
      landscape 844 × 390 на web, реальные доступные ориентация/IME на native. Viewport не подменяет системную
      клавиатуру; недоступное действие фиксируется blocked."
    - Организатор может изменять встречу; отдельный участник не имеет этого права. Настроен безопасный отказ
      сохранения без commit.
    - Подготовлены два известных синтетических PNG в доступном тестовом picker; исходная встреча с обложкой.
      Управляемый отказ сохранения не затрагивает реальные аккаунты/файлы.
  steps:
    - action: Организатору открыть настройки, прокрутить сгруппированные поля, сфокусировать нижнее поле и показать
        доступную системную клавиатуру; повторить при низкой высоте.
      expected: Обложка — небольшой управляемый блок, не большая повторная карточка. Сохранение закреплено и
        достижимо при скролле/IME; содержимое прокручивается отдельно от фона, safe area не обрезает кнопку.
    - action: Выбрать первый синтетический PNG реальным picker, отменить выбор второго, затем сохранить и
        переоткрыть настройки другим допустимым клиентом/профилем.
      expected: Первый файл реально сохранён и отображён; отмена второго не стирает выбранную обложку.
        Подтверждённый результат сохраняется после переоткрытия, это не demo-переключатель наличия.
    - action: Удалить обложку и изменить текстовые поля; вызвать ошибку сохранения, закрыть и снова открыть форму,
        затем выполнить прежний безопасный повтор.
      expected: Ошибочный ответ не выдаётся за успех; поля/черновик удаления сохранены, последнее подтверждённое
        состояние остаётся корректным. После подтверждённого повтора обложка отсутствует и поля обновлены без
        дубликатов/потери сообщения.
    - action: Проверить вход обычным участником и вернуться из настроек через сведения к чату.
      expected: Чужие права редактирования не появляются; восстановлены родительский фокус, черновик и участок чата.
