    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture и реально собранный клиент по testing/environments.md; синтетические
      профили, зафиксированные build/API, часы, locale ru-RU, timezone и устройство. Production и реальные
      сообщения не используются.
    - Два текущих участника имеют доступ к одной встрече; есть сообщения с устойчивыми ID, обычный текст,
      сообщение с вложением и системное событие. Разговор длиннее viewport; записан видимый участок выше конца
      и неотправленный черновик «До XX после».
    - "Mobile web: 320 × 760 и 390 × 844; iOS/Android: выбранный QA-телефон. Для низкой высоты — 390 × 430 и
      landscape 844 × 390 на web, реальные доступные ориентация/IME на native. Viewport не подменяет системную
      клавиатуру; недоступное действие фиксируется blocked."
    - >-
      Desktop web 768/1440: действия «+» открываются модалками поверх чата; mobile web — нижними
      панелями. Native фото/файл сначала вызывают системный picker, предпросмотр появляется
      после успешного выбора; native Share сразу системный. Формы голосований/задач остаются
      нижними панелями.
  steps:
    - action: С черновиком и прокруткой выше конца открыть плюс, затем эмодзи, затем снова плюс.
      expected: "На каждом шаге активна одна поверхность: предыдущее меню/dock скрыто и не перехватывает ввод;
        черновик сохраняется."
    - action: Из меню открыть действие чата и закрыть его штатным способом; снова открыть emoji dock.
      expected: Форма заменяет меню, её закрытие восстанавливает тот же чат. Нет оставшихся затемнений/пустого
        резерва; после закрытия dock возвращается прежний участок, не принудительный конец.
    - action: Явно открыть поиск с системной клавиатурой, затем вернуться к сообщению.
      expected: Поле, закрытие и отправка достижимы в safe area; поисковый ввод не изменяет черновик до выбора
        эмодзи. На mobile web текст composer, поиска и полей панелей не меньше 16 px; обычный пользовательский
        zoom не запрещён. Native сохраняет системное масштабирование и прежнюю типографику.
    - action: Снять normal/reduced открытие и закрытие меню по плюсу, быстро повторно открыть при закрытии; выбрать
        действие и закрыть Escape/Back.
      expected: "Normal: промежуточные opacity/сдвиг 8, enter 180/exit 150 мс; retained exit без hit testing/AX.
        Reduced мгновенно; старое завершение не скрывает новое меню. Выбор действия не ждёт анимацию;
        Escape/Back возвращают фокус на плюс."
  cleanup:
