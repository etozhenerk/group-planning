- id: TC-CHAT-WEB-NO-ZOOM
  title: "Мобильные web-поля: минимум 16 px без случайного zoom при фокусе"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Управление панелями на телефоне
    scenario: Фокус поля на мобильном web
    sha256: c25c651583023a1ef7794c9d8ac762fefdef37677e979aab1efe8dd6b91bcb80
  platforms:
    - web
  preconditions:
    - Реально собранный web-клиент и изолированный Go memory fixture по testing/environments.md; синтетический
      организатор имеет доступ к встрече с длинной перепиской. Записаны build, API, locale ru-RU, timezone и
      браузер/устройство.
    - До начала установлен обычный пользовательский масштаб; записаны visualViewport.scale/offset и видимый
      участок чата выше конца. Composer содержит неотправленный текст «До XX после» с выделением XX; открытого
      опроса места нет, формы доступны.
    - Web 320 × 760 и 390 × 844; регрессия WebKit 402 × 874 из прежнего mobile-scroll.md. Для проверки
      реального auto-zoom/IME нужен доступный Safari на iPhone с настоящей клавиатурой. Эмуляция
      viewport/события клавиатуры или CSS-scale workbench не доказывает это поведение; недоступная часть
      фиксируется blocked, не pass.
  steps:
    - action: С исходным масштабом сфокусировать composer; зафиксировать computed font-size, visual viewport и
        доступность Send до/после открытия настоящей клавиатуры.
      expected: Текст поля не меньше 16 CSS px. При фокусе нет непрошеного увеличения масштаба; клавиатура занимает
        свою область, composer/Send доступны, черновик/выделение и участок чата сохранены.
    - action: Открыть emoji dock, явно сфокусировать русский поиск, ввести «пицца», затем кнопкой клавиатуры
        вернуться к composer.
      expected: Search также не меньше 16 CSS px; фокус не вызывает случайный zoom или скачок внешней страницы.
        Возврат восстанавливает selection, текст не отправлен; поиск сам по себе не меняет черновик.
    - action: Поочерёдно открыть формы даты, места, задачи и настройки; сфокусировать доступные
        input/textarea/select, затем открыть Share и его readonly поле ссылки. Для каждого записать computed
        font-size и наблюдение фокуса/клавиатуры.
      expected: Все фокусируемые текстовые поля мобильных панелей не меньше 16 CSS px, в том числе поиск, время,
        описание и readonly Share. Одновременно одна панель; закрытие/сохранение по-прежнему доступны. Размеры
        обычных подписей, иконок и native-типографика не выводятся из этого web-only ожидания.
    - action: Закрыть клавиатуру и панели, затем явно увеличить страницу пользовательским pinch zoom и вернуть
        исходный масштаб.
      expected: "Видимая область после закрытия клавиатуры восстанавливается по прежним правилам; нет пустого
        резерва/потери черновика или принудительного конца ленты. Пользовательский zoom доступен: нет
        user-scalable=no, запрещающего maximum-scale или искусственного уменьшения поля transform. Журнал
        различает измерение CSS и фактически выполненный Safari/IME проход."
  cleanup:
    - Закрыть тестовые панели/клавиатуру, восстановить исходные масштаб и ориентацию; очистить только
      собственные fixture-данные после сохранения evidence.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
