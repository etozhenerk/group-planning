- id: TC-CHAT-03C1F855
  title: "Компактное меню добавления: Выбор действия"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Компактное меню добавления
    scenario: Выбор действия
    sha256: 9f908477a87dc90312995f35201f5bc1a819f4d11e3c23da9cf6009262e0932b
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture и реально собранный клиент по testing/environments.md; синтетические
      профили, зафиксированные build/API, часы, locale ru-RU, timezone и устройство. Production и реальные
      сообщения не используются.
    - Два текущих участника имеют доступ к одной встрече; есть сообщения с устойчивыми ID, обычный текст,
      сообщение с вложением и системное событие. Разговор длиннее viewport; записан видимый участок выше конца
      и неотправленный черновик «До XX после».
    - "Mobile web: 320 × 760 и 390 × 844; iOS/Android: выбранный QA-телефон. Для низкой высоты — 390 × 430 и
      landscape 844 × 390 на web, реальные доступные ориентация/IME на native. Viewport не подменяет системную
      клавиатуру; недоступное действие фиксируется blocked."
    - >-
      Desktop web 768/1440: действия «+» открываются модалками поверх чата; mobile web — нижними
      панелями. Native фото/файл сначала вызывают системный picker, предпросмотр появляется
      после успешного выбора; native Share сразу системный. Формы голосований/задач остаются
      нижними панелями.
    - Открытого опроса даты нет; доступны права текущего участника на предложение.
  steps:
    - action: Открыть плюс рядом с черновиком.
      expected: В компактном меню доступны фото, файл, дата, место и задача; форма ещё не открыта, текст не изменён.
    - action: Выбрать «Предложить дату», заполнить два различных допустимых варианта и срок, затем создать опрос.
      expected: "Меню уступает место одной форме: mobile — нижняя панель, desktop — модальное окно поверх того же
        чата. Подтверждение создаёт один опрос по существующим правилам; черновик сообщения не отправлен."
    - action: Открыть встречу вторым участником.
      expected: В общей истории виден тот же опрос и его варианты; новых несанкционированных прав или второй копии нет.
  cleanup:
    - Очистить только собственные fixture-данные после сохранения журнала/evidence; восстановить ориентацию,
      размер текста и настройки клавиатуры.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
