- id: TC-CHAT-1F396228
  title: "Выбор эмодзи в сообщении: Вставка в черновик"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Выбор эмодзи в сообщении
    scenario: Вставка в черновик
    sha256: 5860ebb46a399935125a8042fca89f57659be8b6f6313e5b3f13be33940c200b
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Кнопка эмодзи SHALL открывать панель с поиском по русским названиям, недавними
      и категориями. Выбор SHALL вставлять эмодзи в текущую позицию или вместо
      выделенного текста без отправки. Текст, курсор и прокрутка разговора SHALL
      сохраняться при переключении панели и клавиатуры.
  steps:
    - action: пользователь выбирает эмодзи между двумя словами
      expected: эмодзи вставляется между ними, остальные символы не меняются сообщение отправляется только
        отдельным действием
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
