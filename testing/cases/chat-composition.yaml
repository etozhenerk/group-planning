- id: TC-CHAT-87982DEF
  title: "Кнопка панели эмодзи: Повторное нажатие"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Кнопка панели эмодзи
    scenario: Повторное нажатие
    sha256: 483352bdf9470d210d6a12ed411ba94cceea31a7d764efd6e646945753b4e51b
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Кнопка SHALL использовать узнаваемую контурную улыбку и доступное название
      «Выбрать эмодзи». Область нажатия SHALL быть не меньше 44 × 44 px/pt/dp,
      видимая иконка — около 23. Раскрытое состояние SHALL сообщаться экранному диктору;
      повторное нажатие SHALL закрывать панель с сохранением черновика.
  steps:
    - action: пользователь нажимает кнопку уже открытой панели эмодзи
      expected: панель закрывается, фокус возвращается к кнопке и её состояние обновляется
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
