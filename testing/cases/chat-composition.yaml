      expected: "Компактный состав пересчитан по данным: 3 текущих, три имени без +1; полные 6 ответов сохранены.
        Значения/имена не захардкожены под demo."
    - action: Под организатором и участником проверить приглашение, настройки и собственный ответ при обоих видах
