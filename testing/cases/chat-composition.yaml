- id: TC-CHAT-F00844F6
  title: "Управление панелями на телефоне: Переключение панели"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Управление панелями на телефоне
    scenario: Переключение панели
    sha256: 0de221142dca824c08df4cd4b4e1558fce34e9d8746a07ecd2b2427ab4853094
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Клиенты SHALL показывать одну активную панель добавления/эмодзи.
      На телефоне панель SHALL учитывать клавиатуру и безопасные области; поле ввода
      и действие закрытия SHALL оставаться доступны. Поиск SHALL поддерживать ввод
      с системной клавиатуры без потери выбранного сообщения или черновика.
  steps:
    - action: пользователь после меню добавления открывает эмодзи
      expected: меню закрывается и не перекрывает новую панель
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
