- id: TC-CHAT-03C1F855
  title: "Компактное меню добавления: Выбор действия"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-composition/spec.md
    requirement: Компактное меню добавления
    scenario: Выбор действия
    sha256: 0f53862e33bec39baca1d67e3a2c536138ae1449d773f0846a2bf4866fb844fd
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Плюс рядом с сообщением SHALL открывать компактное меню фото, файла, предложения
      даты, места и задачи. Форма SHALL открываться после выбора пункта. Закрытие меню
      SHALL сохранять черновик и возвращать фокус к кнопке. Существующие права и правила
      опросов/задач SHALL сохраняться.
  steps:
    - action: участник открывает плюс и выбирает «Предложить дату»
      expected: появляется форма существующего опроса даты для этой встречи её подтверждение создаёт
        действие по действующим правилам
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
