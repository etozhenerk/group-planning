- id: TC-API-PROFILE-PRIVACY
  title: "API: собственный профиль и публичные представления без контактов"
  lifecycle: active
  level: integration
  risk: critical
  source:
    path: openspec/changes/meeting-experience-refresh/specs/user-profile/spec.md
    requirement: Приватность контактов
    scenario: Просмотр участника
    sha256: cc16a90e6b4646d09b2dafab877193b680c053cc5a634dced038e4407e3e143d
  platforms:
    - backend
  preconditions:
    - Изолированный реально запущенный HTTP API/Go memory fixture по testing/environments.md;
      зафиксированы commit, версия API и управляемые часы. Профили синтетические; UI-клиент и
      устройство для этой интеграционной проверки не требуются.
    - Профиль A содержит все личные поля; профиль B — текущий участник встречи A; профиль C не имеет
      доступа. Используются Cookie и Bearer-сессии fixture.
  steps:
    - action: Запросить /api/v1/me/profile от A с Cookie и Bearer; повторить анонимно.
      expected: A получает собственные данные по контракту, анонимный запрос отвергнут. Необязательные
        отсутствующие поля не дополняются демонстрационными значениями.
    - action: От B запросить встречу, список встреч, участников, ленту и реакции; от C — публичное
        приглашение.
      expected: Публичные пользователи содержат только ID, имя и аватар.
        login/first_name/last_name/birthday/sex/email/phone отсутствуют во всех чужих ответах.
        Публичное приглашение не раскрывает закрытый состав и медиа.
    - action: Проверить фактические ответы по OpenAPI и чтение прежним контрактным потребителем,
        игнорирующим новые необязательные поля.
      expected: Новые profile/summary/media поля совместимы; старые обязательные поля и версии
        существующих сообщений сохранены. Это не утверждение о запуске старого мобильного бинарника.
  cleanup:
    - Очистить только созданные этим прогоном fixture-данные; восстановить изменённые настройки,
      ориентацию и масштаб. Сохранить обезличенный журнал действий и результат до очистки.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/experience_test.go
          selector: TestExperienceOpenAPIResponses
          runner: backend-unit-integration
          level: integration
- id: TC-API-RSVP-CUTOFF
  title: "API: атомарная часовая отсечка RSVP и сохранение действующего доступа"
  lifecycle: active
  level: integration
  risk: critical
  source:
    path: openspec/changes/meeting-experience-refresh/specs/invitation-rsvp/spec.md
    requirement: Отсечка присоединения за час
    scenario: Ровно за час
    sha256: 0f14625a3e518ca18328a8e68a1cdc685f879184dc936f997bfc2e33fbb4f285
  platforms:
    - backend
  preconditions:
    - Изолированный реально запущенный HTTP API/Go memory fixture по testing/environments.md;
      зафиксированы commit, версия API и управляемые часы. Профили синтетические; UI-клиент и
      устройство для этой интеграционной проверки не требуются.
    - Часы fixture управляются явно. Есть встречи с точным starts_at в UTC и смещённом timezone, с
      starts_on без времени, текущий участник и ранее отказавшийся участник.
  steps:
    - action: На независимых встречах отправить новое «Приду» за 1 секунду до starts_at − 1h, ровно на
        границе и на секунду после неё.
      expected: До границы участие подтверждается, на/после границы отклоняется; расчёт по абсолютному
        времени одинаков для разных timezone.
    - action: После границы повторить подтверждённый запрос текущего участника и попытаться вернуться
        ранее отказавшемуся.
      expected: Повтор не отнимает действующий доступ; возвращение считается новым вступлением и отклоняется.
    - action: Отправить RSVP на встречу с датой без точного времени; перенести точное начало другой
        встречи и повторить попытку относительно нового начала.
      expected: Дата без времени не вводит часовой запрет; перенос пересчитывает границу, сохраняя прочие
        ограничения участия.
    - action: Запустить конкурирующие RSVP/изменение времени с синхронизированными fixture-барьерами,
        затем прочитать сохранённый состав и закрытую ленту.
      expected: Нет подтверждённого вступления, нарушающего атомарную проверку; отвергнутому пользователю
        не раскрываются чат и закрытые фотографии.
  cleanup:
    - Очистить только созданные этим прогоном fixture-данные; восстановить изменённые настройки,
      ориентацию и масштаб. Сохранить обезличенный журнал действий и результат до очистки.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/experience_test.go
          selector: TestExperienceOpenAPIResponses
          runner: backend-unit-integration
          level: integration
- id: TC-API-RSVP-LEGACY
  title: "API: прежний запрос RSVP получает совместимый запрет"
  lifecycle: active
  level: integration
  risk: critical
  source:
    path: openspec/changes/meeting-experience-refresh/specs/invitation-rsvp/spec.md
    requirement: Актуальность состояния приглашения
    scenario: Старый мобильный клиент
    sha256: bee3f0ba3c2b9a32aa003d489998633e0a0735233648c6e8cf0a4e605e743293
  platforms:
    - backend
  preconditions:
    - Изолированный реально запущенный HTTP API/Go memory fixture по testing/environments.md;
      зафиксированы commit, версия API и управляемые часы. Профили синтетические; UI-клиент и
      устройство для этой интеграционной проверки не требуются.
    - Имеются зафиксированные прежние запросы RSVP без новых UI-полей; часы переведены за отсечку,
      до этого получено разрешающее приглашение.
  steps:
    - action: Отправить прежний формат запроса после отсечки, используя ранее загруженное разрешение.
      expected: Сервер заново проверяет состояние и возвращает совместимую ошибку запрета, а не принимает
        устаревшее разрешение.
    - action: Прочитать приглашение и попробовать получить закрытую ленту/фотографии отвергнутой сессией.
      expected: Приглашение объясняет закрытие с причиной/временем по контракту; закрытые данные недоступны.
    - action: Повторить прежний запрос после допустимого переноса начала.
      expected: Решение принимается по новой границе и текущим правам, без зависимости от наличия нового
        экрана клиента.
  cleanup:
