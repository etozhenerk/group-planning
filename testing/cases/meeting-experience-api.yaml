- id: TC-API-ALBUM-PAGINATION
  title: "API: общий альбом, страницы и прежний переход в past"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-memories/spec.md
    requirement: Общий альбом участников
    scenario: Фото добавляет обычный участник
    sha256: 5642674b2ba76cf95d3cd0ac7330216f5f259cc1f01f8fd13acaff4ce25ea544
  platforms:
    - backend
  preconditions:
    - Изолированный реально запущенный HTTP API/Go memory fixture по testing/environments.md;
      зафиксированы commit, версия API и управляемые часы. Профили синтетические; UI-клиент и
      устройство для этой интеграционной проверки не требуются.
    - Управляемые календарные часы, организатор и обычный текущий участник; отдельные прошедшие
      встречи с нулём, одним и числом фото больше одной страницы.
    - Пересмотр UI от 28.10 меняет карусель, единый loading и автоматическое закрытие формы. Этот
      backend-кейс проверяет сохранённые API-ограничения, публикацию, идемпотентность и данные; он
      не подтверждает клиентскую композицию или auto-dismiss.
  steps:
    - action: Перевести встречу в past существующим календарным правилом и прочитать альбом/представление
        встречи.
      expected: Фото не требуется для перехода в past; чат остаётся доступен, пустой альбом имеет честные
        count/preview.
    - action: Обычным участником явно добавить фотографии в альбом и прочитать все страницы до конца.
      expected: Подтверждённые фото доступны всем текущим участникам; порядок устойчив, ни пропусков, ни
        повторов между страницами нет.
    - action: Проверить одно фото, полный альбом и курсор от другой встречи; прочитать summary списка.
      expected: Количество/превью соответствуют альбому; курсор не раскрывает чужую встречу. Фото чата не
        добавлено без явного действия.
  cleanup:
    - Очистить только созданные этим прогоном fixture-данные; восстановить изменённые настройки,
      ориентацию и масштаб. Сохранить обезличенный журнал действий и результат до очистки.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/experience_test.go
          selector: TestExperienceOpenAPIResponses
          runner: backend-unit-integration
          level: integration
- id: TC-API-SUPPORT-ACCEPTANCE
  title: "API: безопасное принятие обращения и идемпотентный номер"
  lifecycle: active
  level: integration
  risk: critical
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Надёжное принятие обращения
    scenario: Потерян ответ
    sha256: 91e5532406980165efd44421a4605dc46722f563106b465812e8fb4c82c72b71
  platforms:
    - backend
  preconditions:
    - Изолированный реально запущенный HTTP API/Go memory fixture по testing/environments.md;
      зафиксированы commit, версия API и управляемые часы. Профили синтетические; UI-клиент и
      устройство для этой интеграционной проверки не требуются.
    - Отдельный support memory fixture и мок доставки без реального Telegram-адресата; синтетические
      описание, контакт и скриншот. Доступна потеря HTTP-ответа после принятия.
  steps:
    - action: Отправить обращение анонимно без почты/скриншота/диагностики, потерять ответ после принятия
        и повторить исходный ключ/тело.
      expected: Возвращается один подтверждённый номер, запись одна, отсутствие контакта допустимо.
    - action: С тем же ключом изменить описание; отдельно проверить длины 9/10/3000/3001 после trim,
        фактический формат/размер скриншота и rate limit.
      expected: Изменённый повтор конфликтует; сервер проверяет границы и фактическое изображение,
        ограничивает частоту, не принимает лишние поля.
    - action: Сверить ответ, клиентский payload, журналы и попытку публичного чтения по номеру.
      expected: Текст чата, cookie, токены и приватные URL не подмешаны; диагностика opt-in.
        Контакты/скриншот/секреты не утекли в логи и публичный endpoint.
    - action: Запустить мок очереди после временного сбоя доставки.
      expected: Принятая запись не теряется; повтор доставки не требует нового обращения пользователя.
  cleanup:
    - Очистить только созданные этим прогоном fixture-данные; восстановить изменённые настройки,
      ориентацию и масштаб. Сохранить обезличенный журнал действий и результат до очистки.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/support_test.go
          selector: TestSupportOpenAPIResponses
          runner: backend-unit-integration
          level: integration
- id: TC-API-MEDIA-DURABILITY
  title: "Облачный этап: сохранность медиа, миграция и проверяемый откат"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Надёжность загрузки
    scenario: Один файл не загрузился
    sha256: 90c0fddbac66ab0076bbf840d1778fbd3eabe99c09a0a846c5e81d0aa2aea129
  platforms:
    - backend
  preconditions:
    - "Только заключительный облачный этап7.2 после отдельного разрешения: изолированная постоянная
      база/хранилище, согласованные квоты, проверяемые migration/GRANT/backup и совместимый план
      отката. Локальную БД/Docker для этого не поднимать."
    - Зафиксированы версия кандидата, схема и тестовые медиа. Если постоянное окружение, backup или
      утверждённый откат отсутствует, кейс blocked; memory fixture не заменяет его.
    - Пересмотр UI от 28.10 меняет карусель, единый loading и автоматическое закрытие формы. Этот
      backend-кейс проверяет сохранённые API-ограничения, публикацию, идемпотентность и данные; он
      не подтверждает клиентскую композицию или auto-dismiss.
  steps:
    - action: На тестовой базе применить поддерживаемую миграцию отдельной DDL-ролью и запустить runtime
        под ограниченной ролью.
      expected: Runtime использует заявленный постоянный media adapter, не fallback memory; штатные
        операции разрешены без DDL-привилегий приложения.
    - action: Сохранить два файла и получить ошибку третьего; перезапустить API/worker, затем повторить
        только неуспешную операцию.
      expected: Подтверждённые bytes, metadata, реакции и привязки не потеряны; повтор не дублирует
        сохранённые объекты.
    - action: Восстановить backup в отдельном тестовом назначении, проверить originals/previews, права
        чтения, утверждённые квоты и очистку просроченных незавершённых объектов.
      expected: Восстановленные данные согласованы; квоты/очистка не удаляют живые вложения, приватные
        объекты не становятся публичными.
    - action: Пройти утверждённую процедуру отката на тестовом назначении.
      expected: Получена совместимая работоспособная версия без потери подтверждённых объектов; замена
        бинарника на несовместимую со схемой версию не считается откатом.
  cleanup:
    - Очистить только тестовые данные и восстановить настройки; сохранить обезличенные результаты.
      Не затрагивать production или реальные обращения.
  automation:
    backend:
      status: planned
      health: unknown
      tests: []
- id: TC-API-SUPPORT-DURABILITY
  title: "Облачный этап: постоянная очередь обращений и согласованная очистка"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Постоянное хранение и ограниченный срок
    scenario: Рестарт и очистка
    sha256: 6f986f668f083278b6e18761a0a6de83344c4364bac36fac4b9da5a665fd6c67
  platforms:
    - backend
  preconditions:
    - "Только заключительный этап8.9: изолированные постоянная база/очередь и тестовый канал поддержки. Сроки
      хранения и очистки утверждены; без них или доступа результат blocked."
    - Синтетическое обращение; реальным пользователям и в рабочие Telegram-чаты сообщения не отправляются.
      Конфигурация и секреты не входят в Git/evidence.
  steps:
    - action: Принять обращение, заблокировать тестовую доставку временным отказом и перезапустить API/worker.
      expected: Принятая запись и состояние очереди сохранены; пользователь не должен заново отправлять обращение.
    - action: Восстановить тестовую доставку, дождаться контролируемого повтора и сверить номер обращения.
      expected: Доставлено исходное обращение в разрешённый тестовый канал; нет новой клиентской записи или
        бесконтрольной частоты повторов.
    - action: Управляемым временем выполнить очистку на границе 30 дней с момента принятия и проверить отдельный
        доступ к данным/скриншоту.
      expected: Текст, контакт, скриншот и служебная запись удалены после 30 дней; до границы сохранены,
        содержимое/контакты/секреты не появляются в логах.
    - action: Проверить фактическое правило удаления резервных копий.
      expected: Копии истёкших обращений выходят из хранения в течение дополнительных 7 дней; конфигурация без
        доказательства её применения не даёт pass.
  cleanup:
    - Очистить только тестовые данные и восстановить настройки; сохранить обезличенные результаты. Не
      затрагивать production или реальные обращения.
  automation:
    backend:
      status: planned
      health: unknown
      tests: []
