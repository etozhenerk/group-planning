    - action: Снять «Приду» у участника из превью и снова запросить список/встречу.
      expected: Превью и количество отражают текущий состав, отказавшийся не остаётся в числе текущих.
    - action: Проверить поля участника без аватара и публичное приглашение.
      expected: Аватар честно отсутствует; контакты не появились в превью. Публичный ответ не раскрывает
        закрытый состав.
  cleanup:
