      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/experience_test.go
          selector: TestExperienceOpenAPIResponses
          runner: backend-unit-integration
          level: integration
- id: TC-API-PARTICIPANT-SUMMARY
  title: "API: краткий состав и точное количество текущих участников"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/personal-meetings/spec.md
    requirement: Содержательная карточка встречи
    scenario: Встреча с шестью участниками
    sha256: 601f58619cceb25e939ab9505e306fd65c57177666b360f77ddb4608da5e47f0
  platforms:
    - backend
  preconditions:
    - Изолированный реально запущенный HTTP API/Go memory fixture по testing/environments.md;
      зафиксированы commit, версия API и управляемые часы. Профили синтетические; UI-клиент и
      устройство для этой интеграционной проверки не требуются.
    - Созданы шесть участников «Приду», один «Возможно», один «Не смогу» (answer=not_going); у
      одного текущего участника нет аватара. Личные поля заполнены для проверки приватности.
  steps:
