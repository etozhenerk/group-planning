- id: TC-API-REACTION-IDEMPOTENCY
  title: "API: повтор, снятие и конкурентные реакции без дубликатов"
  lifecycle: active
  level: integration
  risk: critical
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-reactions/spec.md
    requirement: Выбор и снятие своей реакции
    scenario: Повтор запроса
    sha256: e5923df1614169ea3c699e5b02e886ded95f9ecb3376fec47af2bda66ef03732
  platforms:
    - backend
  preconditions:
    - Изолированный реально запущенный HTTP API/Go memory fixture по testing/environments.md;
      зафиксированы commit, версия API и управляемые часы. Профили синтетические; UI-клиент и
      устройство для этой интеграционной проверки не требуются.
    - Встреча с двумя текущими участниками, текстовым сообщением, сообщением с вложением и системным
      событием. Доступна инъекция потери ответа после commit.
  steps:
    - action: Установить реакцию, потерять ответ после сохранения и повторить исходный запрос; затем
        параллельно повторить установку того же эмодзи тем же пользователем.
      expected: Пара пользователь/эмодзи учитывается один раз, подтверждённый счётчик не растёт от повторов.
    - action: Добавить другой эмодзи тем же пользователем и тот же эмодзи вторым; снять первую собственную
        реакцию.
      expected: Разные эмодзи и пользователи учитываются отдельно; снятие уменьшает соответствующий
        счётчик на один.
    - action: Проверить обычное сообщение с вложением и попытку использовать реакцию как голос/изменение
        системного события.
      expected: Вложение допускает реакцию; реакция не подменяет голоса и системные события.
    - action: Отозвать доступ и запросить/изменить реакции; проверить представление имён другим текущим
        участником.
      expected: Отозванная сессия не читает/не меняет реакции; контакты не возвращаются.
  cleanup:
    - Очистить только созданные этим прогоном fixture-данные; восстановить изменённые настройки,
      ориентацию и масштаб. Сохранить обезличенный журнал действий и результат до очистки.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/experience_test.go
          selector: TestExperienceOpenAPIResponses
          runner: backend-unit-integration
          level: integration
- id: TC-API-MEDIA-LIMITS
  title: "API: резервирование, фактические ограничения и очистка временной загрузки"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Надёжность загрузки
    scenario: Формат или размер недопустим
    sha256: 0c9bb70e887743c6982df3c840fa0a1c3a42523872c82101f4ded4ba59c65598
  platforms:
    - backend
  preconditions:
    - Изолированный реально запущенный HTTP API/Go memory fixture по testing/environments.md;
      зафиксированы commit, версия API и управляемые часы. Профили синтетические; UI-клиент и
      устройство для этой интеграционной проверки не требуются.
    - Отдельный memory/media fixture с управляемыми часами, известным PNG и синтетическим PDF.
      Только временный каталог этого прогона; production и реальные файлы не используются.
    - Пересмотр UI от 28.10 меняет карусель, единый loading и автоматическое закрытие формы. Этот
      backend-кейс проверяет сохранённые API-ограничения, публикацию, идемпотентность и данные; он
      не подтверждает клиентскую композицию или auto-dismiss.
  steps:
    - action: Получить media/limits и подготовить загрузки на допустимой границе и за ограничением
        размера/формата; повторить резервирование с тем же ключом.
      expected: Допустимый резерв один; несовместимый тип/размер отклонён согласно контракту, повтор не
        создаёт второй объект.
    - action: Передать bytes, не соответствующие заявленному типу/размеру, и попробовать опубликовать
        объект без подтверждённой загрузки.
      expected: Сервер проверяет фактическое содержимое и не публикует неподтверждённый объект.
    - action: Управляемыми часами сделать незавершённый резерв и неподтверждённые bytes просроченными,
        выполнить штатную очистку; сохранить другой завершённый файл.
      expected: Просроченные временные объекты удалены, подтверждённый файл доступен. Сроки и порядок
        берутся из утверждённого backend/docs/media.md, а не из ожидания реальных суток.
    - action: Остановить только fixture временного файлового режима и проверить его каталог; запустить
        новый memory fixture.
      expected: Каталог штатно очищен; прежние memory-данные не обещаются после рестарта. Эта проверка не
        доказывает постоянное хранение PostgreSQL.
  cleanup:
    - Очистить только созданные этим прогоном fixture-данные; восстановить изменённые настройки,
      ориентацию и масштаб. Сохранить обезличенный журнал действий и результат до очистки.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/experience_test.go
          selector: TestExperienceOpenAPIResponses
          runner: backend-unit-integration
          level: integration
- id: TC-API-MEDIA-PUBLICATION
  title: "API: публикация вложения и подписи после потерянного ответа"
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Выбор и отправка вложений
    scenario: Потерян ответ публикации документа с подписью
    sha256: 092a1970f8c3c3253086993150e310b65d965691277f372f5e2058b298635eba
  platforms:
    - backend
  preconditions:
    - Изолированный реально запущенный HTTP API/Go memory fixture по testing/environments.md;
      зафиксированы commit, версия API и управляемые часы. Профили синтетические; UI-клиент и
      устройство для этой интеграционной проверки не требуются.
    - Есть текущий участник, подготовленные синтетический PDF и фото; fault fixture теряет ответ
      публикации после commit.
    - Пересмотр UI от 28.10 меняет карусель, единый loading и автоматическое закрытие формы. Этот
      backend-кейс проверяет сохранённые API-ограничения, публикацию, идемпотентность и данные; он
      не подтверждает клиентскую композицию или auto-dismiss.
  steps:
    - action: Опубликовать документ с подписью, потерять ответ и повторить те же ключ/данные; прочитать
        ленту вторым участником.
      expected: Создано одно сообщение с тем же вложением и подписью; повтор возвращает прежний результат.
    - action: Повторить с изменённой подписью при прежнем ключе, затем попытаться изменить подпись уже
        опубликованного документа новым ключом.
      expected: Изменение отклонено, опубликованные подпись и сообщение не переписаны.
    - action: Опубликовать фото сообщения и фото альбома; повторить успешные операции после частичного
        сбоя соседнего файла.
      expected: Ни сообщение, ни альбом не получают дубликатов; фото из чата не попадает в альбом
        автоматически. Фото не получает пользовательскую подпись.
    - action: Прочитать сообщение потребителем прежней схемы и текущим клиентом.
      expected: Сохраняются совместимые kind/version/текст и необязательное вложение; текущий ответ
        соответствует OpenAPI.
  cleanup:
    - Очистить только созданные этим прогоном fixture-данные; восстановить изменённые настройки,
      ориентацию и масштаб. Сохранить обезличенный журнал действий и результат до очистки.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/experience_test.go
          selector: TestExperienceOpenAPIResponses
          runner: backend-unit-integration
          level: integration
