- id: TC-MOBILE-ONBOARD-NAV
  title: "Общее мобильное знакомство: Навигация по знакомству"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/mobile-mvp-design-refresh/specs/product-onboarding/spec.md
    requirement: Общее мобильное знакомство
    scenario: Навигация по знакомству
    sha256: d7e38ee17d95ef4eddd75cdde8861d25f13bcacde9772381bade8bda1bb7130c
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение testing/environments.md, точная сборка/API и тестовые профили;
      исходное состояние входа/приглашения записано.
  steps:
    - action: Открыть общий вход без сессии; пройти согласованную последовательность тем встреч и входа
        кнопками, вернуться, выбрать страницу индикатором, выполнить свайп и Пропустить.
      expected: Рассказ содержит создание/приглашения, список/календарь, чат с фото/файлами/реакциями,
        выбор даты и места, подготовку и фотоальбом. Профиль, помощь и управление аккаунтом не
        являются отдельными темами. Последний шаг ведёт к явному входу; Пропустить не авторизует, не
        создаёт встречу и не меняет RSVP.
  cleanup:
    - Удалить только собственные fixture-данные, вернуть настройки доступности и задержек; не
      изменять production и чужую сессию.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
