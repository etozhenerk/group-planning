- id: TC-MOBILE-LAUNCH-COLD
  title: "Увеличенная заставка нативных клиентов: Холодный запуск"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/mobile-mvp-design-refresh/specs/product-onboarding/spec.md
    requirement: Увеличенная заставка нативных клиентов
    scenario: Холодный запуск
    sha256: af8ea9f0cda844660dcc1d13fff35e3814ed9c7c1c1e6d63f49a7bc9bbb457c8
  platforms:
    - ios
    - android
  preconditions:
    - Изолированное окружение testing/environments.md, точная сборка/API и тестовые профили;
      исходное состояние входа/приглашения записано.
  steps:
    - action: На изолированной сборке завершить приложение и открыть холодным запуском; снять системный
        этап и приложение.
      expected: Название 44 pt/sp, знак 53 pt/dp слева с промежутком 16 pt/dp, один оборот за 1200 ms;
        слово неподвижно. Переход не меняет масштаб; Android не обрезает подпись маской.
  cleanup:
    - Удалить только собственные fixture-данные, вернуть настройки доступности и задержек; не
      изменять production и чужую сессию.
  automation:
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
