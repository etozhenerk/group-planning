  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/vibe-album-download/specs/meeting-memories/spec.md
    requirement: Доступ и срок жизни экспорта
    scenario: Отзыв доступа и чужой экспорт
    sha256: bda747f42131fab1f4d9216b6dd83c345f3f0e5d99298cc582d7898772bb4e9d
  platforms:
    - backend
    - web
    - ios
