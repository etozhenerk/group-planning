- id: TC-VIBE-EXPORT-RECOVERY
  title: Восстановление собственных pending записей после остановки Android
  lifecycle: active
  level: integration
  risk: high
  source:
    path: openspec/changes/vibe-album-download/specs/meeting-memories/spec.md
    requirement: Восстановление незавершённого сохранения Android
    scenario: Остановка процесса между созданием записи и завершением публикации
    sha256: 358b2515aff6b32f99421f56c04d9581b71ac240c6796afe3321a246f34d39fd
  platforms:
    - android
  preconditions:
    - Только отдельное QA-приложение на явно выбранном тестовом Android API29+;
      собственные JPEG/EXIF и marker UUID, без реальных фото пользователя.
    - До операции есть опубликованная контрольная запись и pending запись другого
      marker; известные URI сохранены для точечной очистки теста.
  steps:
    - action: Остановить QA-процесс после pending insert при записанном намерении,
        затем вызвать begin адаптера в новом процессе.
      expected: Предыдущий pending удалён, даже если URI не успели сохранить;
        новое действие начинается после recovery, контрольные записи целы.
    - action: Повторить остановку после публикации части и после публикации всего
        пакета до удаления журнала; запустить recovery дважды.
      expected: Удаляются только оставшиеся pending данного marker; публичные фото
        остаются без изменения байтов, второй recovery ничего не удаляет.
    - action: Повторить begin при активном lock, затем проверить повреждённый,
        неверный UUID и превышающий лимит журнал.
      expected: Нет удаления активной или другой операции; невалидный журнал
        возвращает ошибку до запроса удаления MediaStore.
  cleanup:
    - Удалить только известные QA URI и journal namespace этого теста;
      не очищать данные обычного приложения, другие галереи или устройства.
  automation:
    android:
      status: partial
      health: unknown
      tests:
        - path: frontend/android/app/src/test/java/dev/groupplanning/android/album/AlbumPendingJournalTests.kt
          selector: AlbumPendingJournalTests
          runner: android-unit
          level: unit
        - path: frontend/android/scripts/test-album-recovery.sh
          selector: pending partial published
          runner: android-album-recovery
          level: integration
- id: TC-VIBE-EXPORT-ALL
  title: Весь альбом независимо от просмотренных страниц
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/vibe-album-download/specs/meeting-memories/spec.md
    requirement: Сохранение полного альбома
    scenario: Весь альбом независимо от просмотренных страниц
    sha256: c1440fe17cac8ec459f2ae44d2ebd9fdd8789f91726c2876c6cfd066d120f01f
  platforms:
    - backend
    - web
    - ios
    - android
  preconditions:
    - Изолированный QA API, точный candidate, два участника и посторонний; свой
      набор фото с EXIF, совпадающими именами и более одной страницей.
  steps:
    - action: участник просмотрел только первую страницу альбома и запускает
        сохранение всех фото
      expected: результат включает каждое фото снимка альбома ровно один раз, с
        уникальными безопасными именами и правильной ориентацией; новые фото,
        добавленные после запуска, остаются для следующего сохранения
  cleanup:
    - Отменить собственные экспорты; удалить только созданные тестом
      файлы/записи галереи, восстановить сеть.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/album_export_test.go
          selector: TestAlbumExportOpenAPIResponses
          runner: backend-unit-integration
          level: integration
        - path: backend/internal/albumexport/manager_test.go
          selector: TestArchiveFullFrozenSnapshotOriginalBytesAndSafeNames
          runner: backend-unit-integration
          level: unit
    web:
      status: planned
      health: unknown
      tests: []
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
- id: TC-VIBE-EXPORT-ZIP
  title: Скачивание архива браузером
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/vibe-album-download/specs/meeting-memories/spec.md
    requirement: ZIP на web без загрузки всего архива в память страницы
    scenario: Скачивание архива браузером
    sha256: ea681e6c2eef7fbc9006ba92345792d337a88cd333534d6985fdb32d6bb9b3d8
  platforms:
    - backend
    - web
  preconditions:
    - Изолированный QA API, точный candidate, два участника и посторонний; свой
      набор фото с EXIF, совпадающими именами и более одной страницей.
  steps:
    - action: Открыть непустой альбом с длинным названием на ширинах320/390/740/1024/1440.
      expected: «Скачать все» находится рядом с «Добавить фото»; на телефоне две
        равные колонки одинаковой высоты. При нехватке места рядом с заголовком
        группа переносится целиком под него; кнопки не переходят на отдельные
        строки и не выходят за контейнер. Полное доступное имя — «Скачать все фото».
    - action: участник нажимает «Скачать все фото» и подготовка завершается
      expected: браузер получает один корректный ZIP со всеми фото; приложение
        сохраняет положение альбома и сообщает только о начале скачивания;
        отменённая или неуспешная подготовка не создаёт неполный архив и
        позволяет повторить действие
    - action: Задержать подготовку, отменить её и затем повторить после ошибки.
      expected: Вторая кнопка показывает общий spinner и «Отменить», без третьей
        кнопки и сдвига фотографии; отмена и повтор сохраняют индекс альбома.
  cleanup:
    - Отменить собственные экспорты; удалить только созданные тестом
      файлы/записи галереи, восстановить сеть.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/album_export_test.go
          selector: TestAlbumExportOpenAPIResponses
          runner: backend-unit-integration
          level: integration
        - path: backend/internal/albumexport/manager_test.go
          selector: TestArchiveFullFrozenSnapshotOriginalBytesAndSafeNames
          runner: backend-unit-integration
          level: unit
    web:
      status: planned
      health: unknown
      tests: []
- id: TC-VIBE-EXPORT-GALLERY
  title: Сохранение всех фотографий в галерею
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/vibe-album-download/specs/meeting-memories/spec.md
    requirement: Сохранение в галерею телефона
    scenario: Сохранение всех фотографий в галерею
    sha256: 6783d78244d82703bb114c0784c6c88806de4087cb06a65025aeb4218d731fda
  platforms:
    - ios
    - android
  preconditions:
    - Изолированный QA API, точный candidate, два участника и посторонний; свой
      набор фото с EXIF, совпадающими именами и более одной страницей.
  steps:
    - action: Открыть непустой альбом на телефоне, включая узкую ширину320.
      expected: «Сохранить все» и «Добавить фото» находятся в одном ряду равных
        колонок одинаковой высоты; доступное имя — «Сохранить все фото».
    - action: участник запускает «Сохранить все фото» и при необходимости разрешает
        запись в галерею
      expected: все фото появляются в галерее с правильной ориентацией, а приложение
        показывает подтверждение только после системного результата; отказ в
        разрешении, отмена или ошибка подготовки сохраняют открытый вайб и не
        теряют его положение
    - action: Задержать подготовку и отменить её; повторить до системной записи.
      expected: Второе действие заменяется spinner и отменой без сдвига фото;
        после передачи пакета системе показано «Сохраняем…», отмена недоступна.
  cleanup:
    - Отменить собственные экспорты; удалить только созданные тестом
      файлы/записи галереи, восстановить сеть.
  automation:
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
