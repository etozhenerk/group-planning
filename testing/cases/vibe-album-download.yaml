- id: TC-VIBE-EXPORT-ALL
  title: Весь альбом независимо от просмотренных страниц
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/vibe-album-download/specs/meeting-memories/spec.md
    requirement: Сохранение полного альбома
    scenario: Весь альбом независимо от просмотренных страниц
    sha256: c1440fe17cac8ec459f2ae44d2ebd9fdd8789f91726c2876c6cfd066d120f01f
  platforms:
    - backend
    - web
    - ios
    - android
  preconditions:
    - Изолированный QA API, точный candidate, два участника и посторонний; свой
      набор фото с EXIF, совпадающими именами и более одной страницей.
  steps:
    - action: участник просмотрел только первую страницу альбома и запускает
        сохранение всех фото
      expected: результат включает каждое фото снимка альбома ровно один раз, с
        уникальными безопасными именами и правильной ориентацией; новые фото,
        добавленные после запуска, остаются для следующего сохранения
  cleanup:
    - Отменить собственные экспорты; удалить только созданные тестом
      файлы/записи галереи, восстановить сеть.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/album_export_test.go
          selector: TestAlbumExportOpenAPIResponses
          runner: backend-unit-integration
          level: integration
        - path: backend/internal/albumexport/manager_test.go
          selector: TestArchiveFullFrozenSnapshotOriginalBytesAndSafeNames
          runner: backend-unit-integration
          level: unit
    web:
      status: planned
      health: unknown
      tests: []
    ios:
      status: planned
      health: unknown
      tests: []
    android:
      status: planned
      health: unknown
      tests: []
- id: TC-VIBE-EXPORT-ZIP
  title: Скачивание архива браузером
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/vibe-album-download/specs/meeting-memories/spec.md
    requirement: ZIP на web без загрузки всего архива в память страницы
    scenario: Скачивание архива браузером
    sha256: ea681e6c2eef7fbc9006ba92345792d337a88cd333534d6985fdb32d6bb9b3d8
  platforms:
    - backend
    - web
  preconditions:
    - Изолированный QA API, точный candidate, два участника и посторонний; свой
      набор фото с EXIF, совпадающими именами и более одной страницей.
  steps:
    - action: участник нажимает «Скачать все фото» и подготовка завершается
      expected: браузер получает один корректный ZIP со всеми фото; приложение
        сохраняет положение альбома и сообщает только о начале скачивания;
        отменённая или неуспешная подготовка не создаёт неполный архив и
        позволяет повторить действие
  cleanup:
    - Отменить собственные экспорты; удалить только созданные тестом
      файлы/записи галереи, восстановить сеть.
  automation:
    backend:
      status: partial
      health: unknown
      tests:
        - path: backend/internal/httpapi/album_export_test.go
          selector: TestAlbumExportOpenAPIResponses
          runner: backend-unit-integration
          level: integration
        - path: backend/internal/albumexport/manager_test.go
          selector: TestArchiveFullFrozenSnapshotOriginalBytesAndSafeNames
          runner: backend-unit-integration
          level: unit
    web:
      status: planned
      health: unknown
      tests: []
- id: TC-VIBE-EXPORT-GALLERY
