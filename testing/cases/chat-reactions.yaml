  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-reactions/spec.md
    requirement: Подтверждённое состояние реакций
    scenario: Фильтр людей и возврат
    sha256: 167b914f3962fe9a36b1675c1646956a6449751dfe44c426608bcf61dc162f16
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture и реально собранный клиент по testing/environments.md;
      синтетические профили, зафиксированные build/API, часы, locale ru-RU, timezone и устройство.
      Production и реальные сообщения не используются.
    - Два текущих участника имеют доступ к одной встрече; есть сообщения с устойчивыми ID, обычный
      текст, сообщение с вложением и системное событие. Разговор длиннее viewport; записан видимый
      участок выше конца и неотправленный черновик «До XX после».
    - "Mobile web: 320 × 760 и 390 × 844; iOS/Android: выбранный QA-телефон. Для низкой высоты — 390
      × 430 и landscape 844 × 390 на web, реальные доступные ориентация/IME на native. Viewport не
      подменяет системную клавиатуру; недоступное действие фиксируется blocked."
    - На одном сообщении 👍 у двух людей, 🍕 у одного из них и текущего; на другом иной набор. Все
      профили синтетические, ни один контакт не нужен.
  steps:
    - action: Удержать существующий чип 👍 с собственной реакцией; отпустить палец. Повторить доступным
        контекстным действием чипа.
      expected: Открыта одна панель людей (mobile sheet / desktop dialog) сразу с фильтром 👍. Счётчик и
        своё участие не меняются; после отпускания нет побочного tap toggle. Постоянной отдельной
        кнопки людей нет.
    - action: Клавиатурой/доступным управлением последовательно выбрать 👍, 🍕 и «Все».
      expected: Каждый фильтр показывает только соответствующие имена без контактов; «Все» объединяет
        людей. Выбранность объявляется, после перерисовки фокус остаётся на том же фильтре; счётчики
        и участие не изменены.
    - action: Повторить фильтрацию при низкой высоте, прокрутить список, закрыть панель и вновь открыть
        реакции сообщения.
      expected: Скролл принадлежит списку; фокус после закрытия на исходном чипе либо bubble, если чип
        исчез. Черновик/участок чата сохранены, участие до/после одинаково.
  cleanup:
    - Очистить только собственные fixture-данные после сохранения журнала/evidence; восстановить
      ориентацию, размер текста и настройки клавиатуры.
