- id: TC-REACT-FULL-PICKER
  title: "Реакции: полный выбор связан с сообщением и не перекрывает ввод"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-reactions/spec.md
    requirement: Выбор и снятие своей реакции
    scenario: Полный выбор у сообщения
    sha256: 5fa1e799382ca8ec140456b22d674eb456b591677299d823309fea45e149d1c6
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture и реально собранный клиент по testing/environments.md;
      синтетические профили, зафиксированные build/API, часы, locale ru-RU, timezone и устройство.
      Production и реальные сообщения не используются.
    - Два текущих участника имеют доступ к одной встрече; есть сообщения с устойчивыми ID, обычный
      текст, сообщение с вложением и системное событие. Разговор длиннее viewport; записан видимый
      участок выше конца и неотправленный черновик «До XX после».
    - "Mobile web: 320 × 760 и 390 × 844; iOS/Android: выбранный QA-телефон. Для низкой высоты — 390
      × 430 и landscape 844 × 390 на web, реальные доступные ориентация/IME на native. Viewport не
      подменяет системную клавиатуру; недоступное действие фиксируется blocked."
    - "Desktop web 768/1440: все действия «+» открываются модалками поверх чата; mobile web/native —
      нижними панелями. Sidebar сохраняется; mobile landscape не превращается в desktop route."
  steps:
    - action: Зафиксировать участок разговора/черновик, открыть quick реакции конкретного сообщения и
        перейти в полный выбор.
      expected: То же сообщение выделено, краткий контекст однозначен. Поиск, категории и недавние
        находятся в доступной области разговора; это выбор реакции, не вставка в composer.
    - action: Явно ввести русский запрос, прокрутить сетку, выбрать эмодзи; повторить при низкой высоте и
        landscape.
      expected: Прокручивается сетка; composer/отправка не перекрыты. Реакция добавлена именно целевому
        сообщению, черновик не изменён; фокус на самом сообщении, прежний участок чата восстановлен.
    - action: Снова открыть полный выбор и закрыть доступной кнопкой, Escape/Back где поддерживается.
      expected: Новая реакция не создаётся; фокус/прокрутка возвращаются к тому же исходному сообщению.
        После закрытия нет пустого резерва или смещения chat header.
  cleanup:
    - Очистить только собственные fixture-данные после сохранения журнала/evidence; восстановить
      ориентацию, размер текста и настройки клавиатуры.
