- id: TC-REACT-1AAA13AA
  title: "Выбор и снятие своей реакции: Быстрая реакция"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-reactions/spec.md
    requirement: Выбор и снятие своей реакции
    scenario: Быстрая реакция
    sha256: 1bab8ce8d9c1eb9ea17ed0a86adb424172248e654fbb1d420ae178c08a3c08ca
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture и реально собранный клиент по testing/environments.md;
      синтетические профили, зафиксированные build/API, часы, locale ru-RU, timezone и устройство.
      Production и реальные сообщения не используются.
    - Два текущих участника имеют доступ к одной встрече; есть сообщения с устойчивыми ID, обычный
      текст, сообщение с вложением и системное событие. Разговор длиннее viewport; записан видимый
      участок выше конца и неотправленный черновик «До XX после».
    - "Mobile web: 320 × 760 и 390 × 844; iOS/Android: выбранный QA-телефон. Для низкой высоты — 390
      × 430 и landscape 844 × 390 на web, реальные доступные ориентация/IME на native. Viewport не
      подменяет системную клавиатуру; недоступное действие фиксируется blocked."
    - "Desktop web 768/1440: все действия «+» открываются модалками поверх чата; mobile web/native —
      нижними панелями. Sidebar сохраняется; mobile landscape не превращается в desktop route."
  steps:
    - action: Удержать обычное сообщение штатным native long press; повторить на web через контекстное
        меню/Enter/Space и на native через доступное действие сообщения.
      expected: Доступны ❤️ 👍 😂 🔥 🎉 и полный выбор возле выбранного сообщения. Ни до, ни после
        закрытия у сообщения нет постоянных smile/add-reaction/people кнопок; альтернативные
        действия доступны на самом сообщении.
    - action: Выбрать 🔥, затем повторить на сообщении с вложением.
      expected: Подтверждённая реакция относится только к выбранному сообщению, composer/черновик не
        изменён. Системное событие и голос опроса не становятся обычной реакцией.
    - action: Проверить результат вторым участником и вернуться к исходному сообщению.
      expected: Оба видят один подтверждённый счётчик; после выбора фокус возвращён к нужному сообщению
        без потери draft/scroll.
  cleanup:
    - Очистить только собственные fixture-данные после сохранения журнала/evidence; восстановить
      ориентацию, размер текста и настройки клавиатуры.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
