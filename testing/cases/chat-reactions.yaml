- id: TC-REACT-18CAB411
  title: "Подтверждённое состояние реакций: Ошибка сохранения"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-reactions/spec.md
    requirement: Подтверждённое состояние реакций
    scenario: Ошибка сохранения
    sha256: fb73721a13f9bf8a1b7e3f9d962225d4a7991592ce4bf16ecb21bfd3a4e66a03
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Реакции SHALL показывать эмодзи, количество и собственное участие, различимое
      без цвета. Ошибка SHALL сохранять последнее подтверждённое состояние и давать
      повтор. Счётчик SHALL позволять узнать имена отреагировавших с текущим доступом
      к сообщению, без раскрытия контактов.
  steps:
    - action: сервер не подтвердил реакцию
      expected: клиент отменяет неподтверждённое изменение и предлагает повторить
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
