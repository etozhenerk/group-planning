- id: TC-REACT-1AAA13AA
  title: "Выбор и снятие своей реакции: Быстрая реакция"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/chat-reactions/spec.md
    requirement: Выбор и снятие своей реакции
    scenario: Быстрая реакция
    sha256: 1646ea10bf037925906f2915ba2619ced61dacce3c3e334bd7dfddf41ad66447
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Участник с доступом к чату SHALL добавлять Unicode-реакцию к обычному сообщению,
      включая сообщение с вложением. Повторное нажатие той же реакции SHALL снимать
      её. Одна пара пользователь/эмодзи SHALL учитываться один раз; разные эмодзи
      одного пользователя допускаются. Системные события и голоса опросов не заменяются реакциями.
  steps:
    - action: пользователь открывает действия сообщения наведением, кнопкой или долгим нажатием
      expected: доступны ❤️ 👍 😂 🔥 🎉 и переход к полному выбору
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
