- id: TC-MEDIA-82F4AC83
  title: "Выбор и отправка вложений: Выбрать несколько фотографий"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Выбор и отправка вложений
    scenario: Выбрать несколько фотографий
    sha256: 8c1a719515e1aacb8ec7c10eca0dfbf6614c07b0cc09512cc808660baf9ae622
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Любой текущий участник с доступом к чату SHALL отправлять фото и файлы.
      Клиенты SHALL показывать выбранные файлы до отправки и разрешать убрать их.
      Фотографии SHALL NOT иметь отдельного поля подписи; текст можно отправить
      обычным сообщением. Отмена системного выбора SHALL сохранять черновик сообщения.
      После подтверждённого полного успеха фото или документа форма SHALL закрываться
      автоматически без кнопки «Готово»; ошибки и неопределённый результат сохраняют форму.
  steps:
    - action: участник выбирает фото через плюс
      expected: видит предпросмотр выбранного и может убрать отдельный кадр до отправки форма не содержит
        поля подписи фото
    - action: Подтвердить отправку и дождаться реального ACK всего набора или документа.
      expected: После подтверждения форма автоматически закрывается без кнопки «Готово»; созданные
        вложения видны один раз, черновик чата сохранён.
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
