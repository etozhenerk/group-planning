- id: TC-MEDIA-BC197682
  title: "Закрытые медиа встречи: Ссылка переслана постороннему"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Закрытые медиа встречи
    scenario: Ссылка переслана постороннему
    sha256: d758a61a6bf01e6a9eaccc35c4f4e468041fad90961014de97505328e2eb5233
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Чтение, загрузка и выдача файлов SHALL проверять текущий доступ к чату.
      Публичное приглашение и его обложка SHALL NOT раскрывать приватные вложения
      или альбом. Потеря доступа SHALL закрывать предпросмотр и очищать локальный
      кеш встречи; поздние ответы SHALL NOT восстанавливать его.
  steps:
    - action: пользователь без доступа запрашивает приватное фото или файл
      expected: содержимое и метаданные вложения ему не возвращаются
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
