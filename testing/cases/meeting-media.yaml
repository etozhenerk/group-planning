- id: TC-MEDIA-7640A673
  title: "Надёжность загрузки: Один файл не загрузился"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Надёжность загрузки
    scenario: Один файл не загрузился
    sha256: 90c0fddbac66ab0076bbf840d1778fbd3eabe99c09a0a846c5e81d0aa2aea129
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Клиенты SHALL хранить результат каждого файла для безопасного повтора, показывая
      загрузку фото одним состоянием набора без per-photo progress. Полный успех фото
      или документа SHALL автоматически закрывать форму без «Готово». Pending,
      ошибка и частичный успех SHALL сохранять форму; повтор касается только
      неуспешного без дублей. Ограничения SHALL проверяться до отправки и сервером.
  steps:
    - action: Отправить три фото с контролируемым сбоем третьего после сохранения первых двух.
      expected: Во время передачи виден один loading набора без per-photo progress. Форма не закрыта; два
        фото сохранены, третье остаётся доступным для повтора.
    - action: Восстановить API и повторить неуспешное; дождаться подтверждения всего набора.
      expected: Успешные фото не отправлены повторно; в чате ровно три вложения. Форма автоматически
        закрылась, отдельного экрана успеха и кнопки «Готово» нет.
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
