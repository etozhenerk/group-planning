- id: TC-MEDIA-WEB-FORM-FIRST
  title: "Форма вложений web до системного выбора: Web открывает пустую форму до выбора фото или файла"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Форма вложений web до системного выбора
    scenario: Web открывает пустую форму до выбора фото или файла
    sha256: 04a5c6d9a3a05e6dcdcfe087e421279baec3378f05a8fdb8474c077f5537c0c4
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md, текущий участник встречи; зафиксированы
      exact web build, API, браузер, viewport, locale, время и опубликованный raw 3.0.0.
    - Desktop и mobile web проверяются отдельно. Для системной отмены нужен настоящий OS picker;
      подстановка файлов или synthetic cancel не доказывают этот путь. Недоступный системный UI
      отмечается blocked.
    - Подготовлены обезличенные тестовые фото с известными пропорциями, PDF и черновик «Привет XX
      мир» с выделением XX; реальные личные данные не используются.
  steps:
    - action: В чате набрать «Привет XX мир», выделить XX; открыть плюс → Фото на desktop и mobile web.
      expected: "Открыта пустая форма поверх чата: desktop dialog или mobile bottom sheet. OS picker не
        появился; одна поверхность, заголовок, закрытие и выбор доступны."
    - action: Нажать явную кнопку выбора внутри формы, выбрать две разные фотографии.
      expected: Только это действие открывает OS picker; после выбора видны два предпросмотра с удалением,
        без подписи фото; отправка требует подтверждения.
    - action: Закрыть форму и повторить путь через плюс → Файл; выбрать тестовый PDF.
      expected: До явной кнопки выбора показана пустая форма без OS picker. После выбора видны имя, тип,
        размер и необязательная подпись; черновик и selection чата сохранены.
  cleanup:
    - Удалить только собственные тестовые вложения/встречу либо сбросить fixture; вернуть исходные
      viewport/ориентацию и закрыть собственные OS picker/формы.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
- id: TC-MEDIA-WEB-PICKER-CANCEL
  title: "Форма вложений web до системного выбора: Web сохраняет форму после повторной отмены
    системного выбора"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Форма вложений web до системного выбора
    scenario: Web сохраняет форму после повторной отмены системного выбора
    sha256: fb53725d85752a1a16e1db52d52e1f7dea59de92ad5361d0cfc09aff20abdc00
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md, текущий участник встречи; зафиксированы
      exact web build, API, браузер, viewport, locale, время и опубликованный raw 3.0.0.
    - Desktop и mobile web проверяются отдельно. Для системной отмены нужен настоящий OS picker;
      подстановка файлов или synthetic cancel не доказывают этот путь. Недоступный системный UI
      отмечается blocked.
    - Подготовлены обезличенные тестовые фото с известными пропорциями, PDF и черновик «Привет XX
      мир» с выделением XX; реальные личные данные не используются.
  steps:
    - action: В пустой форме Фото открыть настоящий OS picker и нажать его Cancel три раза подряд; после
        каждой отмены проверить форму.
      expected: После Cancel №1, №2 и №3 остаётся та же пустая форма. Следующая кнопка выбора работает;
        закрытия формы, отправки или потери draft/selection нет.
    - action: Выбрать две фотографии, затем повторить три открытия и отмены OS picker.
      expected: После каждой отмены оба предпросмотра и порядок сохранены; пользователь может удалить кадр
        или явно отправить оставшееся.
    - action: Повторить пустой и заполненный путь в форме Файл; до повторных отмен заполнить подпись «План
        встречи».
      expected: Форма, прежний документ и подпись сохраняются после всех трёх отмен; composer «Привет XX
        мир» и выделение XX не изменены.
  cleanup:
    - Удалить только собственные тестовые вложения/встречу либо сбросить fixture; вернуть исходные
      viewport/ориентацию и закрыть собственные OS picker/формы.
  automation:
    web:
      status: planned
      health: unknown
      tests: []
- id: TC-MEDIA-WEB-FORM-FOCUS
  title: "Форма вложений web до системного выбора: Web показывает ровный клавиатурный фокус выбора"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Форма вложений web до системного выбора
    scenario: Web показывает ровный клавиатурный фокус выбора
    sha256: e8dd206b8507f5cddd1ac1b7f417b3132b9057dcca26b74512530c3284d5890c
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md, текущий участник встречи; зафиксированы
      exact web build, API, браузер, viewport, locale, время и опубликованный raw 3.0.0.
    - Desktop и mobile web проверяются отдельно. Для системной отмены нужен настоящий OS picker;
      подстановка файлов или synthetic cancel не доказывают этот путь. Недоступный системный UI
      отмечается blocked.
    - Подготовлены обезличенные тестовые фото с известными пропорциями, PDF и черновик «Привет XX
      мир» с выделением XX; реальные личные данные не используются.
  steps:
    - action: На desktop перевести Tab/Shift+Tab фокус на кнопку выбора пустой формы Фото и затем Файл;
        сравнить normal/focus с опубликованным raw.
      expected: Focus-visible следует контуру и геометрии согласованной кнопки, не обрезан и не смещён;
        содержимое и layout не прыгают.
    - action: Активировать выбор Enter, отменить OS picker; затем активировать Space и снова отменить.
      expected: Каждая активация открывает OS picker ровно один раз; после отмены видимый фокус находится
        в открытой форме, без потери прежнего выбора.
    - action: Закрыть форму собственной кнопкой; на desktop повторить через Escape. На mobile закрыть
        видимой кнопкой.
      expected: Форма уходит с предусмотренной анимацией; фокус возвращается в исходный контекст,
        черновик/selection/scroll сохранены. Escape не требуется от телефона без клавиатуры.
