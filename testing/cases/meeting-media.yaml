- id: TC-MEDIA-7640A673
  title: "Надёжность загрузки: Один файл не загрузился"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/meeting-media/spec.md
    requirement: Надёжность загрузки
    scenario: Один файл не загрузился
    sha256: 7426bc46618cc7ef70d46d7dc33c80516fca57c89e3e8a6632dc2595788e02eb
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Клиенты SHALL различать подготовку, загрузку, успех и ошибку каждого файла.
      Повтор SHALL NOT создавать дубликат вложения. При частичном успехе SHALL
      сохраняться успешные файлы и повторяться только неудачные. Ограничения сервера
      SHALL быть известны до отправки и проверяться повторно сервером.
  steps:
    - action: два фото сохранены, а третье не удалось загрузить
      expected: видны два сохранённых и отдельная ошибка третьего с повтором
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
