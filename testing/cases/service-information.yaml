- id: TC-INFO-28355B41
  title: "Разделы помощи и документов: Десктопный онбординг"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/service-information/spec.md
    requirement: Разделы помощи и документов
    scenario: Десктопный онбординг
    sha256: 76288c86ee48971dd4c60eb6977d4a06c0f696d0b51b54f00930f4613ccd9143
  platforms:
    - web
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Web SHALL показывать футер с разделами «Сервис», «Обратная связь» и «Документы»
      только на десктопном онбординге. На внутренних страницах и мобильном web
      футер SHALL NOT отображаться; iOS и Android SHALL NOT содержать футер.
      Все клиенты SHALL обеспечивать
      доступ к помощи, обратной связи, версии и документам из профиля. Панель сведений
      о встрече SHALL NOT содержать эти пункты.
  steps:
    - action: посетитель открывает онбординг в десктопной компоновке web
      expected: видит футер с помощью, документами и фактической версией
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
