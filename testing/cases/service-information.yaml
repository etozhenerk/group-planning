- id: TC-INFO-PUBLIC-POLICY-RELEASE
  title: "Выпуск документов: согласованные реквизиты, публичный доступ и фактическое хранение"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/service-information/spec.md
    requirement: Публичная политика
    scenario: Пользователь ещё не вошёл
    sha256: 73b2a3ef1a3da771ee1188025c2253890b6e35f853b41f20ca736027267c5787
  platforms:
    - web
  preconditions:
    - Владелец утвердил реальные реквизиты оператора, контакт, цели/основания, страны, сроки и
      условия передачи через Telegram. Если сведения ещё отложены, кейс blocked и задача8.8 остаётся
      открытой.
    - Проверяется изолированный кандидат с фактической конфигурацией трафика/cookie/storage и
      согласованным решением о необходимости отдельного согласия. Не определять юридическое
      основание по наличию cookie.
  steps:
    - action: Без авторизации открыть политику из формы входа/обращения и документы из профиля.
      expected: Публичный документ доступен; опубликованная версия содержит все утверждённые реальные
        сведения, без шаблонных полей или ложной подписи окончательной политики.
    - action: Сопоставить перечни/сроки в политике и cookie-странице с фактическими запросами, cookies и
        локальным хранением кандидата.
      expected: Объявления соответствуют поведению; авторизационный срок до30дней описан верно, передачи в
        поддержку отражены.
    - action: Проверить согласованный режим необязательного отслеживания и отказа от него.
      expected: Если согласие требуется, отслеживание не включается до отдельного действия; отказ не
        отключает необходимый вход. Если отслеживания нет, оно не выдумывается ради кейса.
  cleanup:
