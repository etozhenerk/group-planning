- id: TC-INFO-87665C8F
  title: "Версия и разработчик: Разные выпуски клиентов"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/service-information/spec.md
    requirement: Версия и разработчик
    scenario: Разные выпуски клиентов
    sha256: d93a30539e677afce95bb75fbaa7b8570715514f052e1b73a6320f6dc945e4fc
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Клиенты SHALL показывать собственную фактическую версию и подпись
      «Developed by MintyDev». Версия SHALL соответствовать сборке открытого клиента,
      а не версии API или другого приложения. Подпись web SHALL сохранять полный
      SemVer, включая PATCH и RC, например «Версия 0.1.0-rc.2». Отдельный номер
      CI-сборки SHALL быть доступен в справке как «Сборка 42». Подпись разработчика SHALL NOT
      подменять реквизиты оператора персональных данных.
  steps:
    - action: версии web и мобильного приложения различаются
      expected: каждый клиент показывает свою версию в разделе «О somewhere»
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
