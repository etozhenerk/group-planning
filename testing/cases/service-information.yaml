- id: TC-INFO-ONBOARDING-NO-SERVICE
  title: "Мобильный онбординг: весь экран без сервисной кнопки и перекрытий"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/meeting-experience-refresh/specs/service-information/spec.md
    requirement: Мобильный онбординг без сервисной панели
    scenario: Отсутствие лишней кнопки на слайдах
    sha256: 0fc44d4083b2036ba40633a976c1b843e00c5d51350b50890613e86b3170574d
  platforms:
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture, тестовые профили и реально собранный клиент по
      testing/environments.md; зафиксированы commit, API, часы, locale и устройство. Реальные
      пользовательские данные не используются.
    - Отдельное QA-приложение находится до завершения онбординга. Личная обычная сборка и её данные
      не сбрасываются.
    - Зафиксированы обычный и максимальный поддержанный доступный размер текста; доступен тестовый
      вход для проверки профиля.
  steps:
    - action: Открыть первый слайд и пройти все слайды, захватывая весь экран приложения вместе с общей
        оболочкой.
      expected: Нигде нет отдельной кнопки помощи, знака вопроса или панели документов. Предусмотренные
        навигация и вход не перекрыты.
    - action: На предусмотренном слайде нажать «Пропустить», затем в отдельном чистом QA-сценарии дойти до
        последнего слайда обычным перелистыванием.
      expected: Оба пути приводят к предусмотренному завершающему состоянию. На последнем слайде доступны
        текст, подпись и кнопка входа.
    - action: Увеличить системный размер текста и повторить первый/последний слайды, прокрутить весь текст
        и нажать основную кнопку.
      expected: Текст достижим без обрезки, навигация/CTA работают; посторонних перекрытий нет. Проверка
        не ограничена наличием AX-узла.
    - action: Войти тестовым профилем и открыть профиль.
      expected: Помощь и документы доступны из профиля; их удаление с онбординга не удалило
        предусмотренный путь.
  cleanup:
    - Очистить только созданные этим прогоном fixture-данные; восстановить изменённые настройки,
