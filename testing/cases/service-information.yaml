- id: TC-INFO-666F6B46
  title: "Прозрачность cookie и хранения: Длительное сохранение входа"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/service-information/spec.md
    requirement: Прозрачность cookie и хранения
    scenario: Длительное сохранение входа
    sha256: 116771fffef3e178d7edf45fb8456e04fe5288ba1102e4bbe805f81ad2f61e46
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Страница cookie SHALL описывать фактические цели и сроки cookie и хранения
      в браузере. Само наличие cookie авторизации SHALL NOT трактоваться как решение
      о необходимости либо отсутствии согласия. До выпуска SHALL быть определены
      применимые правила и основания; требуемое согласие SHALL быть отдельным действием,
      не подменённым ссылкой на политику.
  steps:
    - action: авторизация сохраняется между посещениями до 30 дней
      expected: страница сообщает этот срок и не описывает cookie как исчезающую при закрытии вкладки
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
