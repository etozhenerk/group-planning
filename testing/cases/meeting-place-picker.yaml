- id: TC-MAP-PLACE-SEARCH
  title: "Выбор места через Яндекс Карты: Найденное заведение"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-place-picker/specs/meeting-place-picker/spec.md
    requirement: Выбор места через Яндекс Карты
    scenario: Найденное заведение
    sha256: 8eecce3a2f9cf44763b48d0537873ac266842ba4f54185f7cc44902a2122f1dd
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное QA-окружение, точные сборки/API, профиль going и организатор; provider test
      fixture либо разрешённый тестовый ключ, без production и реальной геолокации пользователя.
  steps:
    - action: Найти организацию, выбрать один результат, изменить запрос до ответа и подтвердить
        актуальный результат.
      expected: форма показывает выбранные название и адрес, сохраняет координаты и доступный
        идентификатор/URI провайдера пояснение и срок опроса сохраняются, место самой встречи ещё не
        изменяется
  cleanup:
    - Удалить только собственные fixture-данные, вернуть разрешения/задержки; не менять чужие планы
      и evidence.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
