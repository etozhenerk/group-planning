- id: TC-CREATE-D1DE264B
  title: "Раздельный выбор даты и времени на вебе: Выбрать дату в форме"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/gathering-activity-feed/specs/meeting-creation/spec.md
    requirement: Раздельный выбор даты и времени на вебе
    scenario: Выбрать дату в форме
    sha256: f5207860bd936f0fa70527d21add6457785c4cf21148fafb7652a3609405ac47
  platforms:
    - web
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Веб SHALL предоставлять отдельные поля даты и времени с календарём сервиса,
      без поля пояса. Новая встреча SHALL использовать IANA-пояс браузера,
      редактируемая — пояс встречи, черновик SHALL сохранять исходный пояс.
      При заданном времени API SHALL получать согласованные дату, время, смещение
      и пояс; при пустом — сохранять дату в поясе встречи.
      Неоднозначное или несуществующее время SHALL NOT молча переноситься библиотекой.
  steps:
    - action: организатор открывает календарь у поля «Дата» и выбирает день
      expected: день сохраняется отдельно от поля «Время», календарь закрывается,
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
