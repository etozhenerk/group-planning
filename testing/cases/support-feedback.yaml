- id: TC-SUPPORT-689C3B5F
  title: "Контроль передаваемых сведений: Добавить и убрать скриншот"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Контроль передаваемых сведений
    scenario: Добавить и убрать скриншот
    sha256: bea2c6aac1f111ddf0e88d85d723396bae536200cf7a6cc96994922b4367a829
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Текст чата, cookie, токены и параметры приватных ссылок SHALL NOT автоматически
      попадать в обращение. Скриншот SHALL добавляться только явным выбором файла;
      диагностика SHALL быть выключена по умолчанию и перечислять состав до включения.
      Форма SHALL давать ссылку на политику, без строки о получателе и канале доставки.
  steps:
    - action: пользователь выбирает PNG/JPEG/WebP до 5 МБ, а затем нажимает «Убрать»
      expected: видит предпросмотр до удаления, а файл не входит в отправку после удаления
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
