- id: TC-SUPPORT-2B1C9FBF
  title: "Доставка в выделенный канал поддержки: Telegram временно недоступен"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Доставка в выделенный канал поддержки
    scenario: Telegram временно недоступен
    sha256: 6cba433b28bf2c87b4740cfd4d34f6d0efc7401390eaa101b9918b9084768eb2
  platforms:
    - backend
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Принятые обращения SHALL направляться ботом в отдельный настроенный Telegram-чат.
      Секрет бота и ID назначения SHALL NOT передаваться клиенту. Сбой доставки SHALL
      сохранять принятую запись и давать контролируемый повтор; логи SHALL NOT содержать
      полный текст, скриншот, почту или секреты. Доступ к каналу SHALL быть ограничен.
  steps:
    - action: обращение принято, но отправка ботом завершилась временной ошибкой
      expected: обращение остаётся в очереди доставки и повторяется с ограничением частоты пользователь не
        обязан повторно заполнять форму
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    backend:
      status: manual
      health: unknown
      tests: []
