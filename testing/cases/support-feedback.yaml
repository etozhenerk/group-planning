- id: TC-SUPPORT-E6C8467F
  title: "Надёжное принятие обращения: Потерян ответ"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Надёжное принятие обращения
    scenario: Потерян ответ
    sha256: 91e5532406980165efd44421a4605dc46722f563106b465812e8fb4c82c72b71
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Система SHALL подтверждать успех только после принятия обращения сервером.
      Повтор запроса с тем же ключом SHALL NOT создавать новый номер обращения.
      При ошибке форма SHALL сохранять описание и выбранный файл в текущем сеансе,
      показывать повтор и не обещать срок ответа. Ограничения SHALL проверяться сервером.
  steps:
    - action: сервер принял обращение, но клиент повторил запрос после потери ответа
      expected: клиент получает прежний номер, а не новое обращение
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
