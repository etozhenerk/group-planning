- id: TC-SUPPORT-C47A0ACC
  title: "Доступная форма обращения: Обращение без контакта"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Доступная форма обращения
    scenario: Обращение без контакта
    sha256: 38a2ab86465bc8ba15d2345a09e0ea2cf9ac360fc242602d278b75b4ed993d7c
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - >-
      Клиенты SHALL предоставлять действие «Сообщить о проблеме» в помощи/профиле,

      а web — также в футере десктопного онбординга и боковой навигации. Из чата SHALL быть доступен
      вход

      через меню деталей. Форма SHALL содержать тему, описание и выбранный экран;

      почта, один скриншот и сведения об устройстве SHALL быть необязательными.

      Отсутствие почты SHALL NOT запрещать обращение.
  steps:
    - action: пользователь заполнил описание, не добавив почту и скриншот
      expected: может отправить обращение и получить номер после подтверждения сервера
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
