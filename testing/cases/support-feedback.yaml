- id: TC-SUPPORT-C47A0ACC
  title: "Доступная форма обращения: Обращение без контакта"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Доступная форма обращения
    scenario: Обращение без контакта
    sha256: d7d7744f3a74c285de0859ccbf12ee29162642efef498b89c6cb72e1cb51798d
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture, тестовые профили и реально собранный клиент по
      testing/environments.md; зафиксированы commit, API, часы, locale и устройство. Реальные
      пользовательские данные не используются.
    - Доступны профиль/помощь; для web также десктопный онбординг и боковая навигация. Доставка
      обращений подключена только к мок-каналу, без реальных получателей.
  steps:
    - action: Открыть форму из профиля или помощи; в desktop web дополнительно проверить вход из футера
        онбординга и боковой навигации.
      expected: Форма открывается с темой, описанием, выбранным экраном и необязательными почтой,
        скриншотом, диагностикой.
    - action: Открыть сведения о встрече, а на iOS/Android — полный экран мобильного онбординга.
      expected: В этих местах нет отдельного входа в обращение; онбординг не перекрыт сервисной кнопкой.
    - action: Вернуться в форму, выбрать тему и экран, заполнить описание «Не открывается встреча после
        нажатия», оставить почту/скриншот пустыми и диагностику выключенной; отправить.
      expected: Отсутствие контакта не блокирует отправку. До принятия сервером успех и номер не
        показываются.
    - action: Подтвердить принятие в fixture, дождаться ответа и сверить номер с созданной записью.
      expected: Показан именно подтверждённый номер; создано одно обращение без почты, скриншота и
        диагностических сведений.
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
- id: TC-SUPPORT-B8F9FF7E
  title: "Доступная форма обращения: Недостаточное описание"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Доступная форма обращения
    scenario: Недостаточное описание
    sha256: 010c6896c4a5723333129493cd6aa9ecc675f472ca1636546a0eaad9da6e66e1
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированный Go memory fixture, тестовые профили и реально собранный клиент по
      testing/environments.md; зафиксированы commit, API, часы, locale и устройство. Реальные
      пользовательские данные не используются.
    - Форма открыта через профиль/помощь; мок-канал изолирован. Сгенерированы строки длиной 9, 10,
      3000 и 3001 символ после trim.
  steps:
    - action: Выбрать тему/экран; ввести описание из 9 символов с крайними пробелами и нажать отправку.
      expected: Ошибка показана у описания; введённое, тема и экран сохранены, успеха нет.
    - action: Заменить описание строкой из 3001 символа и повторить отправку.
      expected: Показана ошибка ограничения; значения сохранены, обращение не принято.
    - action: На отдельных чистых формах проверить строки длиной 10 и 3000 символов после trim, не
        указывая почту.
      expected: Граничная длина допустима; сервер подтверждает каждую отправку своим номером.
    - action: Открыть сведения встречи и мобильный онбординг соответствующей платформы.
      expected: Недоступный по требованиям вход в обращение не возвращён туда ради теста; форма
        по-прежнему доступна из профиля.
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
    ios:
      status: manual
      health: unknown
      tests: []
    android:
      status: manual
      health: unknown
      tests: []
- id: TC-SUPPORT-689C3B5F
  title: "Контроль передаваемых сведений: Добавить и убрать скриншот"
  lifecycle: active
  level: e2e
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Контроль передаваемых сведений
    scenario: Добавить и убрать скриншот
    sha256: bea2c6aac1f111ddf0e88d85d723396bae536200cf7a6cc96994922b4367a829
  platforms:
    - web
    - ios
    - android
  preconditions:
    - Изолированное окружение и тестовые профили по testing/environments.md; зафиксированы сборка,
      API и время.
    - |-
      Текст чата, cookie, токены и параметры приватных ссылок SHALL NOT автоматически
      попадать в обращение. Скриншот SHALL добавляться только явным выбором файла;
      диагностика SHALL быть выключена по умолчанию и перечислять состав до включения.
      Форма SHALL давать ссылку на политику, без строки о получателе и канале доставки.
  steps:
    - action: пользователь выбирает PNG/JPEG/WebP до 5 МБ, а затем нажимает «Убрать»
      expected: видит предпросмотр до удаления, а файл не входит в отправку после удаления
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые
      настройки.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
