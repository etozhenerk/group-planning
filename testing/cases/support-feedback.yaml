- id: TC-SUPPORT-2B1C9FBF
  title: "Доставка в выделенный канал поддержки: Telegram временно недоступен"
  lifecycle: active
  level: integration
  risk: normal
  source:
    path: openspec/changes/meeting-experience-refresh/specs/support-feedback/spec.md
    requirement: Доставка в выделенный канал поддержки
    scenario: Telegram временно недоступен
    sha256: c89b411941ca925f3785dbed75122fbaddf0bcb814baf09e1b140cb5d1d541fe
  platforms:
    - backend
  preconditions:
    - Изолированные Go support fixture, memory queue и подменённый транспорт Telegram. Реальных
      адресатов/токенов нет; очередь и часы доступны проверяющему.
  steps:
    - action: Принять синтетическое обращение через API и выполнить доставку при временном отказе мок-транспорта.
      expected: Запись принята один раз, статус не теряется, пользователь уже получил подтверждённый номер.
    - action: До и после разрешённого времени повтора вызвать worker, затем восстановить мок-транспорт.
      expected: Очередь ограничивает частоту и доставляет исходное обращение после восстановления; пользователь не
        заполняет форму заново.
    - action: Проверить клиентский ответ, журналы и конфигурацию назначения.
      expected: Секрет/ID назначения не переданы клиенту; логи не содержат полный текст, скриншот, почту или секрет.
        Проверка постоянной очереди после рестарта — отдельный TC-API-SUPPORT-DURABILITY.
  cleanup:
    - Удалить созданные тестовые данные или сбросить собственный fixture; восстановить изменённые настройки.
  automation:
    backend:
      status: manual
      health: unknown
      tests: []
