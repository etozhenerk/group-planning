- id: TC-WEB-RELEASE-IDENTITY-6D753EFB
  title: "Доступная подпись версии: Длинный RC на телефоне"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/release-version-policy/specs/web-release-identity/spec.md
    requirement: Доступная подпись версии
    scenario: Длинный RC на телефоне
    sha256: 0b8201b437f4b08e0a3ccfb0bf72cd5997205068732f828389f7a7bd677fdde3
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - |-
      Полный номер SHALL оставаться читаемым и выделяемым текстом на узком
      экране, при увеличении текста и управлении клавиатурой. Он SHALL NOT
      обрезаться многоточием или перекрываться нижней навигацией. Новые действия,
      модальные окна и принудительная перезагрузка для чтения версии не требуются.
  steps:
    - action: в «О somewhere» на ширине 320 px отображается 0.12.34-rc.123 с увеличенным текстом
      expected: полный номер доступен без горизонтальной прокрутки и перекрытия элементов
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
