- id: TC-WEB-RELEASE-IDENTITY-74FB4009
  title: "Достоверные метаданные выпуска: Потеря номера при сборке"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/release-version-policy/specs/web-release-identity/spec.md
    requirement: Достоверные метаданные выпуска
    scenario: Потеря номера при сборке
    sha256: 809152b0465778f5766dffa2f8e271d8a38caf542e4f2a6ae0fcad3f202ab69f
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - |-
      Версия, тег, component=web и commit SHA в web-сборке SHALL совпадать
      с проверенным источником релиза и его manifest. Отсутствие или несогласованность
      этих значений SHALL блокировать публикацию. Номер пакета инструментов,
      константа из макета или произвольная переменная окружения SHALL NOT заменять
      проверенную версию релиза.
  steps:
    - action: релизный тег имеет версию 0.1.1, но сборка получила 0.0.0 либо пустое значение
      expected: выпуск останавливается до публикации артефакта
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
