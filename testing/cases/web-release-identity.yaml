- id: TC-WEB-RELEASE-IDENTITY-DBDD7231
  title: "Полный номер открытого клиента: Кандидат на сайте"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/release-version-policy/specs/web-release-identity/spec.md
    requirement: Полный номер открытого клиента
    scenario: Кандидат на сайте
    sha256: fa938e498d719d60dcc68cfae6f6fe0ed6fc0db727d54fe059202df3248e419c
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - >-
      Web SHALL показывать `Версия X.Y.Z` либо `Версия X.Y.Z-rc.N` в футере

      десктопного онбординга и разделе «О somewhere» на всех размерах экрана.

      На mobile web и внутренних страницах футера SHALL NOT быть. Значение SHALL

      соответствовать загруженному web-артефакту. PATCH и RC SHALL NOT отбрасываться. Номер
      CI-сборки SHALL

      показываться отдельно в справке. Отсутствие футера SHALL NOT скрывать

      номер в «О somewhere» или добавлять футер в native-клиенты.
  steps:
    - action: посетитель открывает web-артефакт 0.1.0-rc.3
      expected: в справке и футере десктопного онбординга показано «Версия 0.1.0-rc.3», без префикса
        web/v; подпись доступна без авторизации и без запроса к API
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
