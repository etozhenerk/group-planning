- id: TC-WEB-RELEASE-IDENTITY-F6282EEF
  title: "Работа без релизного контекста: Разработка без тега"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/release-version-policy/specs/web-release-identity/spec.md
    requirement: Работа без релизного контекста
    scenario: Разработка без тега
    sha256: 0f657cc744fee1a36482b34d272833c6591f28f674481feed9e1e118c141ef83
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - |-
      Локальный запуск и demo SHALL оставаться доступны без Git-тега и облачных
      секретов. Они SHALL явно обозначаться «Локальная сборка» или «Демо» и SHALL NOT
      выдаваться за опубликованную версию. Повреждённая старая сборка без метаданных
      SHALL показывать «Версия недоступна», не придумывая номер.
  steps:
    - action: разработчик запускает web:dev в незакоммиченном рабочем дереве
      expected: сайт работает с подписью «Локальная сборка», а релизный workflow по-прежнему требует
        чистый проверенный источник
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
- id: TC-WEB-RELEASE-IDENTITY-7A0F2E0A
  title: "Версия следует артефакту: Открытая вкладка во время деплоя"
  lifecycle: active
  level: e2e
  risk: high
  source:
    path: openspec/changes/release-version-policy/specs/web-release-identity/spec.md
    requirement: Версия следует артефакту
    scenario: Открытая вкладка во время деплоя
    sha256: 597b88e1b9bba6adeab336570f003275d0394ced2bd767a375ddd2a781d15866
  platforms:
    - web
  preconditions:
    - Изолированное окружение по testing/environments.md.
    - |-
      Версия SHALL встраиваться в статический клиент и SHALL NOT определяться
      запросом последнего GitHub Release, API-версии или глобальной mutable-константы.
      После отката и свежей загрузки SHALL отображаться версия возвращённого
      артефакта. Ранее открытая вкладка SHALL сохранять номер реально загруженной сборки.
  steps:
    - action: пользователь открыл 0.1.0, а на сервере развёрнут 0.1.1
      expected: до загрузки нового клиента его вкладка продолжает показывать 0.1.0
  cleanup:
    - Удалить только созданные этим прогоном тестовые данные.
  automation:
    web:
      status: manual
      health: unknown
      tests: []
